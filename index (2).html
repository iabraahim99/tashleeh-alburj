async function renderUsers(){
  if(CU.role!=='admin'){document.getElementById('usersContent').innerHTML=`<div class="admin-msg">${T('usersAdminOnly')}</div>`;return;}
  const{data:accounts}=await sb.from('accounts').select('*').order('created_at');
  const list=(accounts||[]).map(u=>`<div class="ucard">
    <div class="uavatar ${u.role}">${u.role==='admin'?'👑':'🔧'}</div>
    <div class="uinfo">
      <div class="uname">${u.name}</div>
      <div class="umeta">
        <span class="rbadge ${u.role}">${u.role==='admin'?'مشرف':'موظف'}</span>
        &nbsp; اسم الدخول: <b>${u.username}</b>
        ${u.id===CU.id?' &nbsp;(أنت)':''}
      </div>
    </div>
    <div style="display:flex;gap:6px">
      <button class="ibtn g" style="padding:6px 8px;font-size:11px" onclick="editAccount('${u.id}','${u.name}','${u.username}','${u.password}','${u.role}')">✏️</button>
      ${u.id!==CU.id?`<button class="ibtn r" style="padding:6px 8px;font-size:11px" onclick="delAccount('${u.id}','${u.name}')">🗑</button>`:''}
    </div>
  </div>`).join('');

  document.getElementById('usersContent').innerHTML=`
    <div style="margin-bottom:16px">${list}</div>
    <div style="font-size:14px;font-weight:800;margin-bottom:10px">➕ إضافة موظف جديد</div>
    <div class="add-sale">
      <div class="fgrid">
        <div class="fgi full"><label>الاسم</label><input type="text" id="new_name" placeholder="اسم الموظف"></div>
        <div class="fgi"><label>اسم الدخول</label><input type="text" id="new_user" placeholder="مثال: ali123" dir="ltr"></div>
        <div class="fgi"><label>كلمة المرور</label><input type="text" id="new_pass" placeholder="مثال: 1234" dir="ltr"></div>
        <div class="fgi"><label>الصلاحية</label>
          <select id="new_role">
            <option value="staff">موظف</option>
            <option value="admin">مشرف</option>
          </select>
        </div>
      </div>
      <button class="btn" style="margin-bottom:0" onclick="addAccount()">✓ إضافة</button>
    </div>`;
}

async function addAccount(){
  const name=val('new_name').trim();
  const username=val('new_user').trim();
  const password=val('new_pass').trim();
  const role=document.getElementById('new_role').value;
  if(!name||!username||!password){toast(T('fillAll'));return;}
  const{error}=await sb.from('accounts').insert({name,username,password,role});
  if(error){toast('خطأ: '+error.message);return;}
  toast(T('addStaffOk'));renderUsers();
}

async function delAccount(id,name){
  if(!confirm(`حذف حساب ${name}؟`))return;
  await sb.from('accounts').delete().eq('id',id);
  toast(T('delOk'));renderUsers();
}

function editAccount(id,name,username,password,role){
  modal(`<h2>✏️ تعديل الحساب</h2>
    <div class="fg"><label>الاسم</label><input id="e_name" type="text" value="${name}"></div>
    <div class="fg"><label>اسم الدخول</label><input id="e_user" type="text" value="${username}" dir="ltr"></div>
    <div class="fg"><label>كلمة المرور</label><input id="e_pass" type="text" value="${password}" dir="ltr"></div>
    <div class="fg"><label>الصلاحية</label>
      <select id="e_role">
        <option value="staff" ${role==='staff'?'selected':''}>موظف</option>
        <option value="admin" ${role==='admin'?'selected':''}>مشرف</option>
      </select>
    </div>
    <div class="macts">
      <button class="btn" style="margin-bottom:0" onclick="saveEditAccount('${id}')">✓ حفظ</button>
      <button class="btn sec" style="margin-bottom:0" onclick="closeModal()">${T('cancel')}</button>
    </div>`);
}

async function saveEditAccount(id){
  const name=val('e_name').trim();
  const username=val('e_user').trim();
  const password=val('e_pass').trim();
  const role=document.getElementById('e_role').value;
  if(!name||!username||!password){toast(T('fillAll'));return;}
  const{error}=await sb.from('accounts').update({name,username,password,role}).eq('id',id);
  if(error){toast('خطأ: '+error.message);return;}
  // update local session if editing own account
  if(CU.id===id){
    CU={...CU,name,username,role};
    localStorage.setItem('alburj_session',JSON.stringify(CU));
    document.getElementById('hName').textContent=name;
    document.getElementById('hRole').textContent=role==='admin'?'👑 مشرف':'🔧 موظف';
  }
  closeModal();toast(T('editOk'));renderUsers();
}

  const cats={salary:'👔 رواتب',bill:'💡 فواتير',fuel:'⛽ وقود/ديزل',purchase:'🛒 مشتريات',other:'📦 أخرى'};

  const rows=list.length?list.map(x=>`

async function addExpense(){
  const category=document.getElementById('exp_cat').value;
  const amount=parseFloat(document.getElementById('exp_amount').value)||0;
  const description=val('exp_desc').trim();
  if(!amount||!description){toast(T('fillAll'));return;}
  const{error}=await sb.from('expenses').insert({category,amount,description,added_by:CU.name,expense_date:new Date().toISOString()});
  if(error){toast('خطأ: '+error.message);return;}
  toast(T('expOk'));renderExpenses();
}

async function delExpense(id){
  if(!confirm(T('delExpConfirm')))return;
  await sb.from('expenses').delete().eq('id',id);
  toast(T('delOk'));renderExpenses();
}


function nav(page,el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.ni').forEach(n=>n.classList.remove('on'));
  document.getElementById('p'+page).classList.add('on');
  if(el)el.classList.add('on');
  const fab=document.getElementById('fabBtn');
  if(page==='Home'){fab.classList.remove('hidden');}
  else{fab.classList.add('hidden');}
  if(page==='Data') switchData('reports', document.querySelector('#dataTabs .tab.on')||document.querySelector('#dataTabs .tab'));
  if(page==='Users')renderUsers();
}

let curDataTab='reports';
function switchData(tab, el){
  curDataTab=tab;
  document.querySelectorAll('#dataTabs .tab').forEach(b=>b.classList.remove('on'));
  if(el)el.classList.add('on');
  const isA=CU&&CU.role==='admin';
  const dc=document.getElementById('dataContent');
  if(!dc)return;

  if(tab==='reports'){
    if(!isA){dc.innerHTML=`<div class="admin-msg">⚠️ التقارير للمشرف فقط</div>`;return;}
    dc.innerHTML=`<div id="reportsContent"></div>`;
    renderReports();
  } else if(tab==='warranty'){
    dc.innerHTML=`<div id="warrantyList"></div>`;
    renderWarranty();
  } else if(tab==='invoices'){
    renderInvoices();
  } else if(tab==='workshop'){
    dc.innerHTML=`<div id="freeSalesContent"></div>`;
    renderFreeSales();
  } else if(tab==='deposits'){
    dc.innerHTML=`<div id="depositsContent"></div>`;
    renderDeposits();
  } else if(tab==='expenses'){
    if(!isA){dc.innerHTML=`<div class="admin-msg">⚠️ المصاريف للمشرف فقط</div>`;return;}
    dc.innerHTML=`<div id="expensesContent"></div>`;
    renderExpenses();
  } else if(tab==='users'){
    dc.innerHTML=`<div id="usersContent"></div>`;
    renderUsers();
  }
}

// ── صفحة الفواتير ──
function renderInvoices(){
  const dc=document.getElementById('dataContent');
  if(!dc)return;

  // جمع كل المبيعات من كل السيارات مجمّعة برقم الفاتورة
  const invoiceMap={};
  cars.forEach(car=>{
    car.sales.forEach(s=>{
      const inv=s.invoice_num||('SALE-'+s.id.slice(-6).toUpperCase());
      if(!invoiceMap[inv]){
        invoiceMap[inv]={
          num:inv,
          date:s.sale_date,
          customer:s.customer_name||'-',
          phone:s.customer_phone||'',
          payment:s.payment_method||'cash',
          parts:[],
          car,
          carId:car.id
        };
      }
      invoiceMap[inv].parts.push(s);
    });
  });

  const invoices=Object.values(invoiceMap).sort((a,b)=>new Date(b.date)-new Date(a.date));

  if(!invoices.length){
    dc.innerHTML=`<div class="empty"><div class="empty-icon">🧾</div><h3>لا توجد فواتير</h3><p>سجّل مبيعة لتظهر هنا</p></div>`;
    return;
  }

  dc.innerHTML=`
    <div style="margin-bottom:12px">
      <input type="text" id="invSearch" placeholder="🔍 ابحث برقم فاتورة، اسم زبون، أو رقم سيارة..." oninput="filterInvoices()"
        style="width:100%;padding:10px 12px;border:1.5px solid var(--bor);border-radius:10px;font-size:13px;font-family:'Cairo',sans-serif;outline:none">
    </div>
    <div id="invList">
    ${invoices.map(inv=>{
      const total=inv.parts.reduce((s,p)=>s+Number(p.price||0)+Number(p.labor||0),0);
      const returned=inv.parts.filter(p=>p.returned).length;
      return `<div class="car-card inv-item" data-search="${inv.num.toLowerCase()} ${inv.customer.toLowerCase()} ${inv.car.num} ${(inv.car.model||'').toLowerCase()}" style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--bor);cursor:pointer" onclick="toggleSection('inv-${inv.num}')">
          <div>
            <div style="font-size:13px;font-weight:800;color:var(--bl)">🧾 ${inv.num}</div>
            <div style="font-size:12px;color:var(--mu);margin-top:2px">
              📅 ${new Date(inv.date).toLocaleDateString('ar-SA')}
              ${inv.customer!=='-'?' · 👤 '+inv.customer:''}
              ${inv.phone?' · 📱 '+inv.phone:''}
            </div>
            <div style="font-size:11px;margin-top:3px">
              🚗 #${inv.car.num} ${inv.car.model||''}
              · ${inv.parts.length} قطعة
              ${returned?` · <span style="color:var(--r)">${returned} مرتجع</span>`:''}
              · <span style="color:${inv.payment==='cash'?'var(--gd)':'var(--bl)'}">${inv.payment==='cash'?'💵 كاش':'💳 شبكة'}</span>
            </div>
          </div>
          <div style="text-align:left">
            <div style="font-size:15px;font-weight:900;color:var(--g)">${fmt(total)}</div>
            <svg viewBox="0 0 24 24" id="arr-inv-${inv.num}" style="width:16px;height:16px;stroke:var(--mu);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;margin-top:4px;transition:transform .3s"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
        </div>
        <div id="inv-${inv.num}" style="display:none;padding:10px 14px">
          ${inv.parts.map(p=>`
            <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--bor);font-size:12px">
              <div>
                <div style="font-weight:700${p.returned?';color:var(--mu);text-decoration:line-through':''}">${p.part_name||'قطعة'}</div>
                ${p.technician?`<div style="color:var(--mu)">🛠️ ${p.technician}</div>`:''}
              </div>
              <div style="text-align:left">
                <div style="font-weight:800;color:${p.returned?'var(--mu)':'var(--g)'}">${fmt(Number(p.price||0)+Number(p.labor||0))}</div>
                ${p.returned?`<div style="color:var(--r);font-size:10px">مرتجع</div>`:''}
              </div>
            </div>`).join('')}
          <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">
            <button class="ibtn b" style="font-size:11px" onclick="exportSalePDF('${inv.carId}','${inv.parts[0].id}')">🧾 فاتورة أول قطعة</button>
            <button class="ibtn b" style="font-size:11px" onclick="exportCarPDF('${inv.carId}')">📄 تقرير السيارة</button>
          </div>
        </div>
      </div>`;
    }).join('')}
    </div>`;
}

function filterInvoices(){
  const q=(document.getElementById('invSearch')?.value||'').toLowerCase();
  document.querySelectorAll('.inv-item').forEach(el=>{
    el.style.display=el.dataset.search?.includes(q)?'':'none';
  });
}

// ── DEPOSITS (العربون) ──
async function renderDeposits(){
  const{data:deps}=await sb.from('deposits').select('*').order('created_at',{ascending:false});
  const list=deps||[];
  const pending=list.filter(d=>d.status==='pending');
  const completed=list.filter(d=>d.status==='completed');

  const depCard=(d)=>{
    const remaining=Number(d.total_amount)-Number(d.deposit_amount);
    const pct=Math.round((Number(d.deposit_amount)/Number(d.total_amount))*100)||0;
    const isPending=d.status==='pending';
    return `<div class="car-card" style="${!isPending?'opacity:0.7':''}">
      <div class="car-top">
        <div>
          <div class="car-badge">${isPending?'⏳ معلق':'✅ مكتمل'}</div>
          <div class="car-name">${d.customer_name}</div>
          <div class="car-sub">📦 ${d.part_description}${d.customer_phone?` | 📱 ${d.customer_phone}`:''}</div>
        </div>
        <div class="car-acts">
          ${isPending&&CU.role==='admin'?`<button class="ibtn g" onclick="completeDeposit('${d.id}')" style="font-size:11px;padding:5px 8px">✓ اكتمل</button>`:''}
          ${isPending?`<button class="ibtn b" onclick="exportDepositPDF('${d.id}')" style="font-size:11px;padding:5px 8px">🧾 فاتورة</button>`:''}
          ${CU.role==='admin'?`<button class="ibtn r" onclick="delDeposit('${d.id}')" style="font-size:11px;padding:5px 8px">🗑</button>`:''}
        </div>
      </div>
      <div class="car-kpis">
        <div class="kpi"><div class="kpi-label">إجمالي الحساب</div><div class="kpi-val">${fmt(d.total_amount)}</div></div>
        <div class="kpi"><div class="kpi-label">العربون المدفوع</div><div class="kpi-val g">${fmt(d.deposit_amount)}</div></div>
        <div class="kpi"><div class="kpi-label">المتبقي</div><div class="kpi-val ${remaining>0?'r':'g'}">${fmt(remaining)}</div></div>
      </div>
      <div style="background:var(--bg2);border-radius:8px;height:8px;margin:8px 0;overflow:hidden">
        <div style="background:${pct>=100?'var(--g)':'var(--gr)'};height:100%;width:${Math.min(pct,100)}%;transition:width .3s"></div>
      </div>
      <div style="font-size:11px;color:var(--mu);text-align:center">${pct}% تم السداد</div>
      ${d.notes?`<div class="car-notes">📝 ${d.notes}</div>`:''}
      <div style="font-size:11px;color:var(--mu);margin-top:6px">📅 ${new Date(d.created_at).toLocaleDateString('ar-SA')}</div>
    </div>`;
  };

  document.getElementById('depositsContent').innerHTML=`
    <button class="add-car-btn" onclick="openAddDeposit()" style="margin-bottom:16px">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      تسجيل عربون جديد
    </button>

    ${pending.length?`<div style="font-size:14px;font-weight:800;margin-bottom:10px;color:var(--r)">⏳ معلقة (${pending.length})</div>
    ${pending.map(depCard).join('')}`:'<div style="color:var(--mu);text-align:center;padding:16px">لا توجد عربونات معلقة ✅</div>'}

    ${completed.length?`<div style="font-size:14px;font-weight:800;margin:16px 0 10px;color:var(--g)">✅ مكتملة (${completed.length})</div>
    ${completed.map(depCard).join('')}`:'' }`;
}

function searchDepCar(q){
  const results=document.getElementById('dep_car_results');
  const hidden=document.getElementById('dep_car');
  const selected=document.getElementById('dep_car_selected');
  if(!results)return;

  // إذا مسح البحث — إعادة تعيين الاختيار
  if(!q){
    results.style.display='none';
    if(hidden)hidden.value='';
    if(selected)selected.style.display='none';
    return;
  }

  const filtered=cars.filter(c=>!c.done&&(
    String(c.num).includes(q)||
    (c.model||'').toLowerCase().includes(q.toLowerCase())
  )).slice(0,8);

  if(!filtered.length){
    results.innerHTML=`<div style="padding:10px;font-size:12px;color:var(--mu);text-align:center">لا توجد نتائج</div>`;
    results.style.display='block';
    return;
  }

  results.innerHTML=filtered.map(c=>`
    <div onclick="selectDepCar('${c.id}','#${c.num} ${c.model||''}')"
      style="padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--bor);font-size:13px;display:flex;align-items:center;gap:8px"
      onmouseover="this.style.background='#f0fdf4'" onmouseout="this.style.background=''">
      <span style="font-size:11px;background:var(--g);color:#fff;padding:2px 7px;border-radius:5px;font-weight:700">#${c.num}</span>
      <span style="font-weight:600">${c.model||'-'}</span>
      <span style="font-size:11px;color:var(--mu);margin-right:auto">${fmt(c.buy_price)} ر.س</span>
    </div>`).join('');
  results.style.display='block';
}

function previewDepPartImg(input,idx){

    const thumb=document.getElementById('dep_partImgThumb_'+idx);
    if(thumb)thumb.src=e.target.result;

async function saveDeposit(){
  const customer_name=document.getElementById('dep_name')?.value.trim();
  const customer_phone=document.getElementById('dep_phone')?.value.trim()||null;
  const total_amount=parseFloat(document.getElementById('dep_total')?.value)||0;
  const deposit_amount=parseFloat(document.getElementById('dep_amount')?.value)||0;
  const payment_method=document.getElementById('dep_pm')?.value||'cash';
  const car_id=document.getElementById('dep_car')?.value||null;
  const notes=document.getElementById('dep_notes')?.value.trim();

  // جمع القطع
  const rows=document.querySelectorAll('#dep_partsContainer .part-row');
  const parts=[];
  rows.forEach((row,i)=>{
    const name=row.querySelector('input[type="text"]')?.value.trim();
    const img=row.dataset.img||null;
    if(name)parts.push({name,img});
  });
  const part_description=parts.map(p=>p.name).join(' | ')||'قطعة';

  if(!customer_name){toast('أدخل اسم الزبون ⚠️');return;}
  if(!part_description||part_description==='قطعة'&&parts.length===0){toast('أدخل وصف القطعة ⚠️');return;}
  if(!total_amount){toast('أدخل إجمالي الحساب ⚠️');return;}
  if(deposit_amount>total_amount){toast('❌ العربون أكبر من الحساب');return;}

  const{data:dep,error}=await sb.from('deposits').insert({
    customer_name,customer_phone,
    part_description,
    total_amount,deposit_amount,payment_method,
    car_id:car_id||null,notes,status:'pending'
  }).select().single();

  if(error){toast('خطأ: '+error.message);return;}

  // رفع صور القطع
  if(dep){
    for(const part of parts){
      if(part.img){
        await sb.from('media').insert({
          car_id:car_id||null,
          url:part.img,
          type:'deposit_part'
        });
      }
    }
  }

  depPartCounter=1;
  closeModal();toast('تم تسجيل العربون ✅');renderDeposits();
}

async function confirmComplete(depId, carId){
  const part_name=document.getElementById('cmp_part')?.value.trim();
  const price=parseFloat(document.getElementById('cmp_price')?.value)||0;
  const payment_method=document.getElementById('cmp_pm')?.value||'cash';

  // سجل المبيعة في السيارة
  const{error:sErr}=await sb.from('sales').insert({
    car_id:carId,
    part_name,price,labor:0,warranty_days:0,

    customer_phone:dep?.customer_phone||null,
    payment_method,

function exportDepositPDF(id){
  // نجلب البيانات من الـ DOM مؤقتاً
  sb.from('deposits').select('*').eq('id',id).single().then(({data:d})=>{
    if(!d)return;
    const{jsPDF}=window.jspdf;
    const doc=new jsPDF({orientation:'p',unit:'mm',format:'a4'});
    const W=210;
    const now=new Date();
    const dateStr=now.getDate()+'/'+(now.getMonth()+1)+'/'+now.getFullYear();
    const remaining=Number(d.total_amount)-Number(d.deposit_amount);
    const pct=Math.round((Number(d.deposit_amount)/Number(d.total_amount))*100)||0;

    function aImg(text,fontSize,color,bold,width){
      const w=width||500;
      const c=document.createElement('canvas');
      const scale=4;c.width=w*scale;c.height=(fontSize+10)*scale;
      const ctx=c.getContext('2d');ctx.scale(scale,scale);
      ctx.font=(bold?'bold ':'')+fontSize+'px Cairo, Arial';
      ctx.fillStyle=color||'#0f172a';ctx.textAlign='right';
      ctx.fillText(text,w-2,fontSize+1);
      return c.toDataURL('image/png');
    }

    // هيدر
    doc.setFillColor(20,83,45);doc.rect(0,0,W,50,'F');
    doc.setFillColor(22,163,74);doc.rect(0,25,W,25,'F');
    doc.setTextColor(255,255,255);
    doc.setFontSize(18);doc.setFont('helvetica','bold');
    doc.text('TASHLEEH AL-BURJ',14,13);
    const t1=aImg('تشليح البرج',18,'#ffffff',true,400);
    doc.addImage(t1,'PNG',W-100,2,86,11);
    doc.setFontSize(8);doc.setFont('helvetica','normal');
    doc.text('Al-Qassim - Al-Rass | Date: '+dateStr,14,20);
    const inv=aImg('فاتورة عربون معلقة',13,'#ffffff',true,300);
    doc.addImage(inv,'PNG',14,34,80,8);

    let y=58;
    // عنوان
    doc.setFillColor(22,163,74);doc.rect(14,y,W-28,8,'F');
    const sec=aImg('تفاصيل العربون',10,'#ffffff',true,300);
    doc.addImage(sec,'PNG',W-100,y+1,86,5);y+=10;

    const fields=[
      ['اسم الزبون',d.customer_name,true],
      ['القطعة / الخدمة',d.part_description,false],
      ['إجمالي الحساب',Number(d.total_amount).toLocaleString()+' ر.س',true],
      ['العربون المدفوع',Number(d.deposit_amount).toLocaleString()+' ر.س',false],
      ['المبلغ المتبقي',remaining.toLocaleString()+' ر.س',remaining>0],
      ['نسبة السداد',pct+'%',false],
      ['التاريخ',dateStr,false],
    ];

    fields.forEach(([lbl,val,hi],i)=>{
      doc.setFillColor(i%2===0?245:250,i%2===0?255:252,i%2===0?245:248);
      doc.rect(14,y,W-28,10,'F');
      const li=aImg(': '+lbl,9,'#64748b',true,200);
      doc.addImage(li,'PNG',W-82,y+1.5,68,5.5);
      const vi=aImg(String(val),10,hi?'#16a34a':'#0f172a',true,200);
      doc.addImage(vi,'PNG',14,y+1.5,80,5.5);
      y+=10;
    });

    if(d.notes){y+=6;
      const ni=aImg('ملاحظة: '+d.notes,9,'#64748b',false,400);
      doc.addImage(ni,'PNG',14,y,180,6);
    }

    // شريط السداد
    y+=14;
    doc.setFillColor(230,240,230);doc.roundedRect(14,y,W-28,8,2,2,'F');
    doc.setFillColor(22,163,74);doc.roundedRect(14,y,Math.max(4,(W-28)*pct/100),8,2,2,'F');
    const pctImg=aImg(pct+'% تم السداد',8,'#0f172a',true,200);
    doc.addImage(pctImg,'PNG',W-90,y+1,76,5);

    // فوتر
    const pH=doc.internal.pageSize.height;
    doc.setFillColor(20,83,45);doc.rect(0,pH-14,W,14,'F');
    doc.setTextColor(255,255,255);doc.setFontSize(8);doc.setFont('helvetica','bold');
    doc.text('TASHLEEH AL-BURJ | Al-Qassim - Al-Rass',14,pH-8);
    const fa=aImg('هذه فاتورة عربون معلقة — لم يكتمل السداد بعد',8,'rgba(255,255,255,0.8)',false,400);
    doc.addImage(fa,'PNG',14,pH-6,182,4);

    doc.save('عربون_'+d.customer_name+'.pdf');
    toast('تم إصدار فاتورة العربون ✅');
  });
}

// ── فاتورة مبيعة بدون سيارة ──
async function exportGenSalePDF(saleId){
  // جلب البيانات من Supabase
  const{data:s}=await sb.from('free_sales').select('*').eq('id',saleId).single();
  if(!s){toast('خطأ: لم يتم إيجاد المبيعة');return;}

  const{jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'p',unit:'mm',format:'a4'});
  const W=210;

  // دالة نص عربي
  function arImg(text,fs,clr,bold){
    const w=500,h=fs*2+12;
    const cv=document.createElement('canvas');
    cv.width=w*3;cv.height=h*3;
    const ctx=cv.getContext('2d');
    ctx.scale(3,3);
    ctx.font=(bold?'bold ':'')+fs+'px Cairo,Arial';
    ctx.fillStyle=clr||'#0f172a';
    ctx.direction='rtl';ctx.textAlign='right';
    ctx.fillText(text,w-2,fs+3);
    return cv.toDataURL('image/png');
  }
  function arR(text,fs,clr,bold,xRight,yy,maxW){
    const mw=maxW||200;
    const h=(fs+6)*0.35;
    doc.addImage(arImg(text,fs,clr,bold),'PNG',xRight-mw,yy,mw,h);
  }

  // ── هيدر ──
  doc.setFillColor(20,83,45);doc.rect(0,0,W,20,'F');
  doc.setFillColor(22,163,74);doc.rect(0,20,W,20,'F');
  arR('تشليح البرج',18,'#ffffff',true,W-14,3,120);
  arR('فاتورة مبيعة',12,'#ffffff',false,W-14,21,100);
  arR('القصيم — الرس',9,'#dcfce7',false,W-14,31,100);
  doc.setFontSize(8);doc.setTextColor(255,255,255);doc.setFont('helvetica','normal');
  doc.text(new Date().toLocaleDateString('en-GB'),14,36);
  let y=50;

  // رقم الفاتورة
  doc.setFillColor(240,253,244);doc.roundedRect(14,y,W-28,30,3,3,'F');
  doc.setDrawColor(22,163,74);doc.setLineWidth(.5);doc.roundedRect(14,y,W-28,30,3,3,'D');

  const cats={mechanic:'ميكانيكا',electric:'كهرباء',ac:'تكييف',body:'هيكل',other:'أخرى',general:'عامة'};
  const details=[
    ['الخدمة / القطعة', s.description||'مبيعة'],
    ['النوع', cats[s.category]||s.category||'-'],
    ['التاريخ', new Date(s.sale_date).toLocaleDateString('ar-SA')],
    ['الموظف', s.sold_by||'-'],
    ['الفني', s.technician||'-'],
  ];
  details.forEach(([lb,vl],i)=>{
    const ry=y+6+(i*5.5);
    doc.setFontSize(8);doc.setTextColor(100,116,139);doc.setFont('helvetica','normal');
    doc.text(lb+':',20,ry);
    arR(vl,8,'#0f172a',true,W-20,ry-6,120);
  });
  y+=36;

  // المبلغ
  y+=6;
  doc.setFillColor(22,163,74);doc.roundedRect(14,y,W-28,16,3,3,'F');
  arR('المبلغ الإجمالي: '+Number(s.price||0).toLocaleString()+' ر.س',14,'#ffffff',true,W-16,y+2,W-28);
  y+=22;

  // ملاحظة
  doc.setFontSize(9);doc.setTextColor(100,116,139);doc.setFont('helvetica','normal');
  doc.text('Thank you for choosing Tashleeh Al-Burj',W/2,y+10,{align:'center'});

  pF(doc,W);
  doc.save('فاتورة_'+s.description+'_'+new Date(s.sale_date).toLocaleDateString('en-GB').replace(/\//g,'-')+'.pdf');
  toast(T('pdfOk'));
}

  y+=10;

  doc.setFillColor(245,255,245); doc.rect(14,y,W-28,12,'F');
  doc.setDrawColor(...SH.G); doc.setLineWidth(.3);
  doc.roundedRect(14,y,W-28,12,1,1,'D');
  const carInfo=aImg('#'+car.num+' — '+(car.model||'غير محدد'),11,'#14532d',true,400);
  doc.addImage(carInfo,'PNG',W-110,y+2,96,7);
  y+=18;

  // ── الشروط ──
  doc.setDrawColor(200,235,210); doc.setLineWidth(.3);
  doc.roundedRect(14,y,W-28,16,2,2,'D');
  const t1=aImg('الفاتورة صادرة من تشليح البرج — منطقة القصيم، الرس *',8,'#64748b',false,500);
  const t2=aImg('الضمان يبدأ من تاريخ البيع. لا يقبل الإرجاع بعد انتهاء الضمان *',8,'#64748b',false,500);
  doc.addImage(t1,'PNG',14,y+2,182,5);
  doc.addImage(t2,'PNG',14,y+9,182,5);

  // ── فوتر ──
  const pH2=doc.internal.pageSize.height;
  doc.setFillColor(...SH.GD); doc.rect(0,pH2-16,W,16,'F');
  const footAr=aImg('شكراً لاختيارك تشليح البرج',9,'rgba(255,255,255,0.8)',false,400);
  doc.addImage(footAr,'PNG',W-100,pH2-13,86,6);
  doc.setTextColor(...SH.WH); doc.setFontSize(8); doc.setFont('helvetica','bold');
  doc.text('TASHLEEH AL-BURJ  |  Al-Qassim - Al-Rass',14,pH2-9);
  doc.setFont('helvetica','normal'); doc.setFontSize(7);
  doc.text('Thank you for choosing Tashleeh Al-Burj',14,pH2-4);

  doc.save('فاتورة_'+invNum+'.pdf');
  toast(T('pdfOk'));
}

// ── UTILS ──
function show(id){const el=document.getElementById(id);if(el){el.style.display='';el.classList.add('on');}}
function hide(id){const el=document.getElementById(id);if(el)el.classList.remove('on');}
function hideLd(){const el=document.getElementById('loading');if(el)el.style.display='none';}
function val(id){return document.getElementById(id)?.value||'';}
function showStep(id){document.querySelectorAll('.step').forEach(s=>s.classList.remove('on'));document.getElementById(id)?.classList.add('on');}
function modal(html){document.getElementById('modalWrap').innerHTML=`<div class="overlay" onclick="if(event.target.classList.contains('overlay'))closeModal()"><div class="modal"><div class="mhandle"></div>${html}</div></div>`;}
function openModal(html){modal(html);}
function closeModal(){document.getElementById('modalWrap').innerHTML='';}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.getElementById('toastWrap').appendChild(t);setTimeout(()=>t.remove(),2800);}

init();
</script>
</body>
</html>
