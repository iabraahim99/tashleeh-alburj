<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="تشليح البرج">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14532d">
<title>تشليح البرج</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--g:#16a34a;--gd:#14532d;--gl:#dcfce7;--gs:#f0fdf4;--r:#dc2626;--rl:#fee2e2;--bl:#2563eb;--bll:#dbeafe;--am:#d97706;--al:#fef3c7;--bg:#f0fdf4;--sur:#fff;--bor:#d1fae5;--txt:#0f172a;--mu:#64748b;--rad:14px;--sh:0 2px 8px rgba(22,163,74,.08);--hh:60px;--nh:64px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--txt);min-height:100dvh;overflow-x:hidden}
.screen{display:none;min-height:100dvh}.screen.on{display:flex;flex-direction:column}
/* LOADING */
#loading{position:fixed;inset:0;background:linear-gradient(160deg,#14532d,#16a34a);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:16px;transition:opacity .4s}
#loading svg{width:64px;height:64px;fill:#fff;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.7;transform:scale(.93)}}
#loading p{color:rgba(255,255,255,.8);font-size:14px;font-weight:600}
/* LOGIN */
#sLogin{background:linear-gradient(160deg,#14532d 0%,#15803d 45%,#16a34a 100%);align-items:center;justify-content:center;padding:24px}
.login-logo{text-align:center;margin-bottom:32px}
.logo-box{width:80px;height:80px;background:rgba(255,255,255,.15);border-radius:24px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;border:1px solid rgba(255,255,255,.2)}
.logo-box svg{width:44px;height:44px;fill:#fff}
.login-logo h1{color:#fff;font-size:26px;font-weight:900}
.login-logo p{color:rgba(255,255,255,.7);font-size:13px;margin-top:3px}
.card{background:#fff;border-radius:20px;padding:26px 22px;width:100%;max-width:380px;box-shadow:0 24px 64px rgba(0,0,0,.25)}
.card h2{font-size:17px;font-weight:800;margin-bottom:18px}
.step{display:none}.step.on{display:block}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.fg label{font-size:11px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.4px}
.fg input,.fg select,.fg textarea{padding:11px 13px;border:2px solid var(--bor);border-radius:10px;font-size:14px;font-family:'Cairo',sans-serif;color:var(--txt);background:#fff;width:100%;transition:border .2s}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--g)}
.fg textarea{resize:vertical;min-height:68px}
.btn{width:100%;background:var(--g);color:#fff;border:none;border-radius:11px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif;transition:background .2s;margin-bottom:8px}
.btn:hover{background:var(--gd)}.btn:active{transform:scale(.99)}
.btn.sec{background:var(--bg);color:var(--mu);border:1.5px solid var(--bor)}
.btn.sec:hover{background:#e8f5e9}
.otp-note{font-size:12px;color:var(--mu);text-align:center;margin-top:8px;line-height:1.6}
.otp-note b{color:var(--g)}
/* APP */
#sApp{background:var(--bg)}
.header{background:linear-gradient(135deg,#14532d,#16a34a);height:var(--hh);padding:0 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(22,163,74,.4)}
.hlogo{display:flex;align-items:center;gap:10px}
.hlogo svg{width:28px;height:28px;fill:#fff}
.htitle{color:#fff;font-size:17px;font-weight:800}.hsub{color:rgba(255,255,255,.65);font-size:10px}
.huser{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);padding:6px 10px;border-radius:10px;cursor:pointer}
.huser-name{color:#fff;font-size:12px;font-weight:600}.huser-role{font-size:10px;color:rgba(255,255,255,.7)}
.main{flex:1;max-width:900px;margin:0 auto;padding:16px 14px;padding-bottom:calc(var(--nh) + 16px);width:100%}
.bnav{position:fixed;bottom:0;left:0;right:0;height:var(--nh);background:#fff;border-top:1px solid var(--bor);display:flex;box-shadow:0 -4px 20px rgba(22,163,74,.1);z-index:40;padding-bottom:env(safe-area-inset-bottom)}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--mu);font-size:10px;font-weight:600;font-family:'Cairo',sans-serif;border:none;background:none;padding:8px 4px}
.ni svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ni.on{color:var(--g)}
.page{display:none}.page.on{display:block}
/* STATS */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.stat{background:#fff;border-radius:var(--rad);border:1px solid var(--bor);padding:14px;box-shadow:var(--sh);position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;right:0;width:4px;height:100%;background:var(--g);border-radius:0 var(--rad) var(--rad) 0}
.stat.red::before{background:var(--r)}.stat.blue::before{background:var(--bl)}
.stat-icon{font-size:20px;margin-bottom:6px}.stat-label{font-size:11px;color:var(--mu);font-weight:600;margin-bottom:3px}
.stat-val{font-size:17px;font-weight:900}.stat-val.g{color:var(--g)}.stat-val.r{color:var(--r)}.stat-val.b{color:var(--bl)}
/* TABS */
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px}.tabs::-webkit-scrollbar{display:none}
.tab{padding:6px 16px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;border:2px solid var(--bor);background:#fff;color:var(--mu);font-family:'Cairo',sans-serif;transition:all .2s;white-space:nowrap}
.tab.on{background:var(--g);color:#fff;border-color:var(--g)}
/* CAR CARD */
.car-card{background:#fff;border-radius:var(--rad);border:1px solid var(--bor);margin-bottom:14px;box-shadow:var(--sh);overflow:hidden}
.car-top{display:flex;align-items:flex-start;justify-content:space-between;padding:14px 16px;background:linear-gradient(135deg,#f0fdf4,#dcfce7);border-bottom:1px solid var(--bor);gap:10px}
.car-badge{display:inline-flex;background:var(--g);color:#fff;font-size:10px;font-weight:800;padding:3px 10px;border-radius:6px;margin-bottom:5px}
.car-name{font-size:16px;font-weight:800}.car-sub{font-size:12px;color:var(--mu);margin-top:2px}
.car-acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.ibtn{background:#fff;border:1.5px solid var(--bor);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px;color:var(--mu);font-family:'Cairo',sans-serif;font-weight:600;white-space:nowrap;transition:all .15s}
.ibtn:hover{background:var(--bg)}.ibtn.r{border-color:var(--r);color:var(--r)}.ibtn.r:hover{background:var(--rl)}
.ibtn.g{border-color:var(--g);color:var(--gd)}.ibtn.g:hover{background:var(--gl)}
.ibtn.b{border-color:var(--bl);color:var(--bl)}.ibtn.b:hover{background:var(--bll)}
.badge{font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px}
.badge-a{background:var(--gl);color:var(--gd)}.badge-d{background:var(--rl);color:var(--r)}
.car-kpis{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--bor)}
.kpi{padding:11px 8px;text-align:center;border-left:1px solid var(--bor)}.kpi:last-child{border-left:none}
.kpi-label{font-size:10px;color:var(--mu);font-weight:600;margin-bottom:3px}.kpi-val{font-size:14px;font-weight:800}
.kpi-val.g{color:var(--g)}.kpi-val.r{color:var(--r)}
.car-notes{font-size:12px;color:#92400e;padding:8px 16px;border-bottom:1px solid var(--bor);background:#fffbeb}
/* SALES */
.sales-area{padding:14px 16px}
.sales-title{font-size:11px;font-weight:800;color:var(--mu);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.sale-item{border:1px solid var(--bor);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fafffe}
.sale-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:5px}
.sale-desc{font-size:13px;font-weight:700}.sale-price{font-size:14px;font-weight:900;color:var(--g)}
.sale-meta{display:flex;flex-wrap:wrap;gap:5px;font-size:11px}
.mtag{background:#f1f5f9;padding:2px 8px;border-radius:6px;font-weight:600;color:var(--mu)}
.wbadge{padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700}
.wa{background:var(--gl);color:var(--gd)}.we{background:var(--rl);color:var(--r)}.wn{background:#f1f5f9;color:var(--mu)}
/* ADD SALE */
.add-sale{background:linear-gradient(135deg,#f0fdf4,#f8fafc);border:1.5px solid var(--bor);border-radius:12px;padding:13px;margin-top:10px}
.add-sale-title{font-size:11px;font-weight:800;color:var(--gd);margin-bottom:11px;text-transform:uppercase;letter-spacing:.5px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.fgrid .full{grid-column:1/-1}
.fgi{display:flex;flex-direction:column;gap:4px}
.fgi label{font-size:10px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.3px}
.fgi input,.fgi select{padding:9px 10px;border:1.5px solid var(--bor);border-radius:8px;font-size:13px;font-family:'Cairo',sans-serif;background:#fff;color:var(--txt);width:100%}
.fgi input:focus,.fgi select:focus{outline:none;border-color:var(--g)}
/* FAB */
.fab{position:fixed;bottom:calc(var(--nh)+16px);left:50%;transform:translateX(-50%);background:var(--g);color:#fff;border:none;border-radius:28px;padding:13px 26px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif;box-shadow:0 8px 32px rgba(22,163,74,.3);display:flex;align-items:center;gap:8px;z-index:30;transition:all .2s}
.fab.hidden{visibility:hidden;pointer-events:none}
.fab:hover{background:var(--gd);transform:translateX(-50%) scale(1.03)}
.fab svg{width:18px;height:18px;fill:#fff}
.add-car-btn{width:100%;background:var(--g);color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif;margin-bottom:16px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:var(--sh)}
.add-car-btn:hover{background:var(--gd)}
.add-car-btn svg{width:20px;height:20px;fill:#fff}
/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:100;backdrop-filter:blur(4px);animation:oIn .2s ease}
@keyframes oIn{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:520px;max-height:90dvh;overflow-y:auto;animation:sUp .3s cubic-bezier(.34,1.56,.64,1)}
@keyframes sUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.mhandle{width:40px;height:4px;background:var(--bor);border-radius:2px;margin:0 auto 18px}
.modal h2{font-size:17px;font-weight:800;margin-bottom:16px}
.macts{display:flex;gap:10px;margin-top:16px}
/* TOAST */
.toast{position:fixed;bottom:calc(var(--nh)+16px);left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:11px 22px;border-radius:12px;font-size:13px;font-weight:600;z-index:999;animation:tIn .3s ease;box-shadow:0 8px 24px rgba(0,0,0,.25);white-space:nowrap;max-width:90vw}
@keyframes tIn{from{opacity:0;transform:translateX(-50%) translateY(16px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
/* EMPTY */
.empty{text-align:center;padding:60px 20px;color:var(--mu)}
.empty-icon{font-size:52px;margin-bottom:12px}.empty h3{font-size:16px;font-weight:700;margin-bottom:6px;color:var(--txt)}
/* REPORTS */
.rep-row{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--bor);border-radius:10px;padding:12px 14px;margin-bottom:6px;box-shadow:var(--sh)}
.rep-label{font-size:13px;font-weight:600}.rep-val{font-size:14px;font-weight:900}
.rep-val.g{color:var(--g)}.rep-val.r{color:var(--r)}
.rep-sec{margin-bottom:20px}.rep-sec h3{font-size:11px;font-weight:800;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
/* USERS */
.ucard{background:#fff;border:1.5px solid var(--bor);border-radius:var(--rad);padding:13px 15px;display:flex;align-items:center;gap:12px;box-shadow:var(--sh);margin-bottom:8px}
.uavatar{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.uavatar.admin{background:linear-gradient(135deg,#14532d,#16a34a)}.uavatar.staff{background:linear-gradient(135deg,#1e40af,#3b82f6)}
.uinfo{flex:1}.uname{font-size:15px;font-weight:800}.umeta{font-size:12px;color:var(--mu);margin-top:2px}
.rbadge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px}
.rbadge.admin{background:var(--gl);color:var(--gd)}.rbadge.staff{background:var(--bll);color:var(--bl)}
/* WARRANTY */
.witem{background:#fff;border:1px solid var(--bor);border-radius:10px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--sh)}
.witem-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:5px}
.admin-msg{background:var(--al);border:1px solid #fcd34d;border-radius:10px;padding:12px 14px;font-size:13px;color:#92400e;margin-bottom:12px}
@media(min-width:600px){.stats{grid-template-columns:repeat(4,1fr)}.fgrid{grid-template-columns:1fr 1fr 1fr}}
</style>
</head>
<body>

<div id="loading">
  <svg viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.85 7h10.29l1.08 3.11H5.77L6.85 7zM19 17H5v-5h14v5z"/><circle cx="7.5" cy="14.5" r="1.5"/><circle cx="16.5" cy="14.5" r="1.5"/></svg>
  <p>تشليح البرج — جاري التحميل...</p>
</div>

<!-- LOGIN -->
<div id="sLogin" class="screen">
  <div class="login-logo">
    <div class="logo-box"><svg viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.85 7h10.29l1.08 3.11H5.77L6.85 7zM19 17H5v-5h14v5z"/><circle cx="7.5" cy="14.5" r="1.5"/><circle cx="16.5" cy="14.5" r="1.5"/></svg></div>
    <h1 id="loginTitle">تشليح البرج</h1><p id="loginSub">منطقة القصيم — الرس</p>
  </div>
  <div class="card">
    <h2 id="loginHead">👋 تسجيل الدخول</h2>
    <div class="fg"><label id="lblUsername">اسم المستخدم</label><input id="usernameInput" type="text" placeholder="admin" autocomplete="username" dir="ltr"></div>
    <div class="fg"><label id="lblPassword">كلمة المرور</label><input id="passwordInput" type="password" placeholder="••••" autocomplete="current-password" dir="ltr"></div>
    <div id="loginErr" style="color:var(--r);font-size:13px;margin-bottom:10px;display:none">❌ <span id="loginErrTxt">اسم المستخدم أو كلمة المرور غير صحيحة</span></div>
    <button class="btn" id="loginBtn" onclick="loginUser()">دخول ✓</button>
  </div>
</div>

<!-- APP -->
<div id="sApp" class="screen">
  <div class="header">
    <div class="hlogo">
      <svg viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.85 7h10.29l1.08 3.11H5.77L6.85 7zM19 17H5v-5h14v5z"/><circle cx="7.5" cy="14.5" r="1.5"/><circle cx="16.5" cy="14.5" r="1.5"/></svg>
      <div><div class="htitle" id="appTitle">تشليح البرج</div><div class="hsub" id="appSub">القصيم — الرس</div></div>
    </div>
    <div style="display:flex;align-items:center;gap:6px">
      <button onclick="cycleLang()" style="background:rgba(255,255,255,.15);border:none;color:#fff;padding:5px 10px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif" id="langBtn">🌐 AR</button>
      <div class="huser" onclick="logout()">
        <div><div class="huser-name" id="hName"></div><div class="huser-role" id="hRole"></div></div>
        <span style="color:rgba(255,255,255,.7)">⇢</span>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="page on" id="pHome">
      <div id="statsGrid" class="stats" style="margin-bottom:16px"></div>
      <button class="add-car-btn" onclick="openAddCar()">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        <span id="addCarTxt">سيارة جديدة</span>
      </button>
      <button class="add-car-btn" onclick="openNewSale()" style="background:var(--g);margin-top:8px;color:#fff">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        <span id="addSaleTxt">مبايعة جديدة +</span>
      </button>
      <div style="font-size:15px;font-weight:800;margin-bottom:12px;margin-top:4px" id="carsTitle">السيارات</div>
      <div style="position:relative;margin-bottom:10px">
        <input type="text" id="carSearch" 
          placeholder="🔍 ابحث برقم السيارة أو الموديل..."
          oninput="renderCars()"
          style="width:100%;padding:11px 14px 11px 38px;border:2px solid var(--bor);border-radius:12px;font-size:14px;font-family:'Cairo',sans-serif;background:#fff;color:var(--txt);outline:none;transition:border .2s"
          onfocus="this.style.borderColor='var(--g)'"
          onblur="this.style.borderColor='var(--bor)'">
        <span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mu);font-size:14px;pointer-events:none">×</span>
      </div>
      <div class="tabs" id="carTabs">
        <button class="tab on" onclick="switchTab('all',this)" id="tabAll">الكل</button>
        <button class="tab" onclick="switchTab('active',this)" id="tabActive">نشطة</button>
        <button class="tab" onclick="switchTab('done',this)" id="tabDone">منتهية</button>
      </div>
      <div id="carsList"></div>
    </div>
    <div class="page" id="pWarranty" style="display:none"></div>
    <div class="page" id="pFreeSales" style="display:none"></div>
    <div class="page" id="pDeposits" style="display:none"></div>
    <div class="page" id="pReports" style="display:none"></div>
    <div class="page" id="pExpenses" style="display:none"></div>

    <!-- صفحة البيانات الموحدة -->
    <div class="page" id="pData">
      <div id="pDataTitle" style="font-size:15px;font-weight:800;margin-bottom:10px">📋 البيانات</div>

      <!-- تبويبات داخلية -->
      <div style="display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px" id="dataTabs">
        <button class="tab on" onclick="switchData('reports',this)">📊 التقارير</button>
        <button class="tab" onclick="switchData('warranty',this)">🛡️ الضمانات</button>
        <button class="tab" onclick="switchData('invoices',this)">🧾 الفواتير</button>
        <button class="tab" onclick="switchData('workshop',this)">🔧 الورشة</button>
        <button class="tab" onclick="switchData('deposits',this)">💰 العربون</button>
        <button class="tab" onclick="switchData('expenses',this)" id="tabExpenses">💸 المصاريف</button>
        <button class="tab" onclick="switchData('users',this)" id="tabUsers">👥 الموظفون</button>
      </div>

      <div id="dataContent"></div>
    </div>

    <div class="page" id="pUsers" style="display:none"><div id="usersContentOld"></div></div>

  set('lblUsername',L.username); set('lblPassword',L.password);
  set('loginErrTxt',L.wrongPass.replace('❌ ',''));

  // الرئيسية
  set('addCarTxt',L.addCar);
  set('carsTitle',L.allCars);
  set('tabAll',L.all); set('tabActive',L.active); set('tabDone',L.done);

  // nav
  const navIds=['navHome','navWarranty','navFreeSales','navDeposits','navExpenses','navReports','navUsers'];
  const navKeys=['home','warranty','workshop','deposits','expenses','reports','users'];
  navIds.forEach((id,i)=>{
    const el=document.getElementById(id);
    if(el){const t=el.lastChild;if(t&&t.nodeType===3)t.textContent=L[navKeys[i]]||t.textContent;}
  });

  // زر سيارة جديدة في FAB
  const fab=document.getElementById('fabBtn');
  if(fab){const t=fab.lastChild;if(t&&t.nodeType===3)t.textContent=L.addCar;}

  // page titles
  set('pWarrantyTitle',L.warranty);
  set('pFreeSalesTitle',L.workshop);
  set('pReportsTitle',L.reports);
  set('pExpensesTitle',L.expenses);
  set('pUsersTitle',L.users);

  // حفظ
  localStorage.setItem('alburj_lang',curLang);

  // إعادة رسم إذا مسجل دخول
  if(CU) render();
}

function cycleLang(){
  const idx=langOrder.indexOf(curLang);
  curLang=langOrder[(idx+1)%langOrder.length];
  applyLang();
  toast(curLang==='ar'?'تم التغيير للعربية 🇸🇦':curLang==='en'?'Switched to English 🇬🇧':'हिंदी में बदला गया 🇮🇳');
}

// ── INIT ──
const APP_VER = 'v3';
async function init(){
  if(localStorage.getItem('alburj_ver') !== APP_VER){
    localStorage.removeItem('alburj_session');
    localStorage.setItem('alburj_ver', APP_VER);
  }

  // timeout 8 ثواني - لو Supabase ما رد يطلع لصفحة الدخول
  const timeout = setTimeout(()=>{
    hideLd(); show('sLogin');
  }, 8000);

  try {
    const saved=localStorage.getItem('alburj_session');
    if(saved){
      const session=JSON.parse(saved);
      if(session && session.username){
        const{data}=await sb.from('accounts').select('*').eq('id',session.id).single();
        if(data){
          clearTimeout(timeout);
          CU={id:data.id,name:data.name,role:data.role,username:data.username};
          localStorage.setItem('alburj_session',JSON.stringify(CU));
          startApp();
          return;
        }
      }
      localStorage.removeItem('alburj_session');
    }
  } catch(e){ localStorage.removeItem('alburj_session'); }
  clearTimeout(timeout);
  hideLd();show('sLogin');
}

// ── LOGIN ──
async function loginUser(){
  const username=val('usernameInput').trim();
  const password=val('passwordInput').trim();
  if(!username||!password){toast(T('enterCredentials'));return;}
  const btn=document.querySelector('#sLogin .btn');
  btn.textContent=T('checking');btn.disabled=true;
  document.getElementById('loginErr').style.display='none';
  const{data,error}=await sb.from('accounts').select('*').eq('username',username).eq('password',password).single();
  btn.textContent=T('enter');btn.disabled=false;
  if(error||!data){document.getElementById('loginErr').style.display='block';return;}
  CU={id:data.id,name:data.name,role:data.role,username:data.username};
  localStorage.setItem('alburj_session',JSON.stringify(CU));
  startApp();
}

document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&document.getElementById('sLogin').classList.contains('on'))loginUser();
});

function startApp(){
  hideLd(); hide('sLogin'); show('sApp');
  document.getElementById('hName').textContent=CU.name;
  document.getElementById('hRole').textContent=CU.role==='admin'?LANGS[curLang].admin:LANGS[curLang].staff;
  applyLang();
  document.getElementById('fabBtn').classList.remove('hidden');
  if(CU.role!=='admin'){
    const tabExp=document.getElementById('tabExpenses');
    if(tabExp)tabExp.style.display='none';
    const tabUsers=document.getElementById('tabUsers');
    if(tabUsers)tabUsers.style.display='none';
  } else {
    const tabExp=document.getElementById('tabExpenses');
    if(tabExp)tabExp.style.display='';
    const tabUsers=document.getElementById('tabUsers');
    if(tabUsers)tabUsers.style.display='';
  }
  sb.from('accounts').select('*').then(({data})=>{ window._accounts=data||[]; });
  loadCars();
}

// ── LOGOUT ──
async function logout(){
  if(!confirm(T('logoutConfirm')))return;
  CU=null;cars=[];
  localStorage.removeItem('alburj_session');
  hide('sApp');show('sLogin');
  document.getElementById('usernameInput').value='';
  document.getElementById('passwordInput').value='';
  document.getElementById('loginErr').style.display='none';
  ['navData','navWorkshop','navDeposits2'].forEach(id=>{
    const el=document.getElementById(id);if(el)el.style.display='';
  });
}

// ── DATA ──
async function loadCars(){
  try{
    const {data,error}=await sb.from('cars').select('*,sales(*)').order('num',{ascending:false});
    if(error){toast('خطأ تحميل البيانات');return;}
    const{data:deps}=await sb.from('deposits').select('*').eq('status','pending');
    const{data:freeS}=await sb.from('free_sales').select('price');
    const{data:exps}=await sb.from('expenses').select('amount');
    const totFree=(freeS||[]).reduce((s,x)=>s+Number(x.price||0),0);
    const totExp=(exps||[]).reduce((s,x)=>s+Number(x.amount||0),0);
    cars=(data||[]).map(c=>({
      ...c,num:c.num,sales:c.sales||[],
      deposits:(deps||[]).filter(d=>d.car_id===c.id)
    }));
    render(totFree,totExp);
  }catch(e){toast('خطأ في الاتصال، حاول مجدداً');}
}

function calcCar(car){
  const active=car.sales.filter(x=>!x.returned);
  const s=active.reduce((a,x)=>a+Number(x.price||0),0);
  const l=active.reduce((a,x)=>a+Number(x.labor||0),0);
  // شغل اليد يبقى حتى لو رجعت القطعة (تعب فك وتركيب)
  const laborReturned=car.sales.filter(x=>x.returned).reduce((a,x)=>a+Number(x.labor||0),0);
  const returnedPrice=car.sales.filter(x=>x.returned).reduce((a,x)=>a+Number(x.price||0),0);
  const totalLabor=l+laborReturned;
  return{sales:s,labor:totalLabor,net:(s+totalLabor)-Number(car.buy_price||0),returned:returnedPrice};
}

function fmt(n){return Number(n||0).toLocaleString('ar-SA',{minimumFractionDigits:0,maximumFractionDigits:0})+' ر.س';}

function wStatus(sale){
  if(!sale.warranty_days||sale.warranty_days==0)return{label:'بدون ضمان',cls:'wn'};
  const exp=new Date(new Date(sale.sale_date).getTime()+sale.warranty_days*86400000);
  const diff=Math.ceil((exp-new Date())/86400000);
  if(diff>0)return{label:'ضمان: '+diff+' يوم متبقي',cls:'wa',expiry:exp};
  return{label:'انتهى الضمان',cls:'we',expiry:exp};
}

// ── RENDER ──
function renderStats(totFree,totExp){
  const isA=CU.role==='admin';
  let tB=0,tS=0,tL=0;
  cars.forEach(c=>{tB+=Number(c.buy_price||0);const r=calcCar(c);tS+=r.sales;tL+=r.labor;});
  const totalSales=tS+tL+(totFree||0);
  const net=totalSales-tB-(totExp||0);
  const parts=cars.reduce((s,c)=>s+c.sales.filter(x=>!x.returned).length,0);
  const st='cursor:pointer;transition:transform .15s,box-shadow .15s" onmouseenter="this.style.transform=\'scale(1.03)\';this.style.boxShadow=\'0 4px 16px rgba(22,163,74,.2)\'" onmouseleave="this.style.transform=\'\';this.style.boxShadow=\'\'';
  document.getElementById('statsGrid').innerHTML=isA?`
    <div class="stat" style="${st}" onclick="showStatDetail('cars')"><div class="stat-icon">🚗</div><div class="stat-label">السيارات</div><div class="stat-val b">${cars.length}</div></div>
    <div class="stat" style="${st}" onclick="showStatDetail('buy')"><div class="stat-icon">🛒</div><div class="stat-label">إجمالي الشراء</div><div class="stat-val">${fmt(tB)}</div></div>
    <div class="stat" style="${st}" onclick="showStatDetail('sales')"><div class="stat-icon">💰</div><div class="stat-label">المبيعات</div><div class="stat-val g">${fmt(totalSales)}</div></div>
    <div class="stat ${net>=0?'':'red'}" style="${st}" onclick="showStatDetail('net')"><div class="stat-icon">${net>=0?'📈':'📉'}</div><div class="stat-label">${net>=0?'صافي الربح':'صافي الخسارة'}</div><div class="stat-val ${net>=0?'g':'r'}">${fmt(Math.abs(net))}</div></div>`
  :`<div class="stat"><div class="stat-icon">🚗</div><div class="stat-label">السيارات</div><div class="stat-val b">${cars.length}</div></div>
    <div class="stat"><div class="stat-icon">✅</div><div class="stat-label">نشطة</div><div class="stat-val g">${cars.filter(c=>!c.done).length}</div></div>
    <div class="stat"><div class="stat-icon">🔩</div><div class="stat-label">القطع المباعة</div><div class="stat-val">${parts}</div></div>
    <div class="stat red"><div class="stat-icon">🔴</div><div class="stat-label">منتهية</div><div class="stat-val r">${cars.filter(c=>c.done).length}</div></div>`;
}

function showStatDetail(type){
  let title='',html='',searchId='statSearch_'+type;

  if(type==='cars'){
    title='🚗 السيارات ('+cars.length+')';
    html=`<input type="text" id="${searchId}" placeholder="🔍 ابحث برقم أو موديل..." oninput="filterStatList('${type}')"
      style="width:100%;padding:10px 12px;border:1.5px solid var(--bor);border-radius:10px;font-size:13px;font-family:'Cairo',sans-serif;margin-bottom:12px;outline:none">
    <div id="statList_${type}">`;
    cars.forEach(c=>{
      const r=calcCar(c);
      html+=`<div class="rep-row stat-item" data-search="${c.num} ${(c.model||'').toLowerCase()}" onclick="closeModal();nav('Home',document.getElementById('navHome'));setTimeout(()=>{document.getElementById('carSearch').value='${c.num}';renderCars();},200)" style="cursor:pointer">
        <div><div style="font-weight:700">${c.model||'سيارة'} <span style="color:var(--mu);font-size:11px">#${c.num}</span></div>
        <div style="font-size:11px;color:var(--mu)">${c.done?'🔴 منتهية':'🟢 نشطة'} · ${c.sales.filter(x=>!x.returned).length} قطعة</div></div>
        <div style="text-align:left"><div class="${r.net>=0?'rep-val g':'rep-val r'}">${fmt(Math.abs(r.net))}</div>
        <div style="font-size:10px;color:var(--mu)">${r.net>=0?'ربح':'خسارة'}</div></div>
      </div>`;
    });
    html+='</div>';

  } else if(type==='buy'){
    title='🛒 إجمالي الشراء';
    let tB=0;
    html=`<input type="text" id="${searchId}" placeholder="🔍 ابحث..." oninput="filterStatList('${type}')"
      style="width:100%;padding:10px 12px;border:1.5px solid var(--bor);border-radius:10px;font-size:13px;font-family:'Cairo',sans-serif;margin-bottom:12px;outline:none">
    <div id="statList_${type}">`;
    [...cars].sort((a,b)=>Number(b.buy_price||0)-Number(a.buy_price||0)).forEach(c=>{
      tB+=Number(c.buy_price||0);
      html+=`<div class="rep-row stat-item" data-search="${c.num} ${(c.model||'').toLowerCase()}">
        <div><div style="font-weight:700">${c.model||'سيارة'} <span style="color:var(--mu);font-size:11px">#${c.num}</span></div>
        <div style="font-size:11px;color:var(--mu)">${new Date(c.created_at).toLocaleDateString('ar-SA')}</div></div>
        <div class="rep-val r">${fmt(c.buy_price||0)}</div>
      </div>`;
    });
    html+=`</div><div class="rep-row" style="background:var(--rl);border-color:var(--r);margin-top:8px">
      <div style="font-weight:800">الإجمالي</div><div class="rep-val r">${fmt(tB)}</div></div>`;

  } else if(type==='sales'){
    title='💰 المبيعات';
    let allSales=[];
    cars.forEach(car=>{
      car.sales.filter(s=>!s.returned).forEach(s=>{
        allSales.push({...s,carNum:car.num,carModel:car.model,type:'car'});
      });
    });
    // إضافة مبيعات الورشة/العامة
    const freeData=window._repData?.freeS||[];
    freeData.forEach(s=>{
      allSales.push({
        id:s.id,part_name:s.description||'خدمة',
        price:s.price,labor:0,
        sale_date:s.sale_date,
        sold_by:s.sold_by,
        carNum:null,carModel:null,
        type:'free',freeId:s.id
      });
    });
    allSales.sort((a,b)=>new Date(b.sale_date)-new Date(a.sale_date));
    html=`<input type="text" id="${searchId}" placeholder="🔍 ابحث باسم القطعة أو السيارة..." oninput="filterStatList('${type}')"
      style="width:100%;padding:10px 12px;border:1.5px solid var(--bor);border-radius:10px;font-size:13px;font-family:'Cairo',sans-serif;margin-bottom:12px;outline:none">
    <div id="statList_${type}">`;
    allSales.forEach(s=>{
      const isFree=s.type==='free';
      html+=`<div class="rep-row stat-item" data-search="${s.carNum||''} ${(s.part_name||'').toLowerCase()} ${(s.sold_by||'').toLowerCase()}">
        <div><div style="font-weight:700">${s.part_name||'قطعة'} ${isFree?'<span style="background:var(--gl);color:var(--gd);font-size:10px;padding:1px 6px;border-radius:6px;font-weight:700">بدون سيارة</span>':''}</div>
        <div style="font-size:11px;color:var(--mu)">${isFree?'🔧 ورشة':('سيارة #'+s.carNum)} · ${s.sold_by||'-'} · ${new Date(s.sale_date).toLocaleDateString('ar-SA')}</div></div>
        <div style="display:flex;align-items:center;gap:6px">
          <div class="rep-val g">${fmt(Number(s.price||0)+Number(s.labor||0))}</div>
          ${isFree?`<button class="ibtn b" style="padding:3px 7px;font-size:10px" onclick="exportGenSalePDF('${s.freeId}')">🧾</button>`:`<button class="ibtn b" style="padding:3px 7px;font-size:10px" onclick="exportSalePDF('${cars.find(c=>c.num==s.carNum)?.id||''}','${s.id}')">🧾</button>`}
        </div>
      </div>`;
    });
    html+=`</div>`;

  } else if(type==='net'){
    title='📊 الملخص المالي';
    let tB=0,tS=0,tL=0;
    cars.forEach(c=>{tB+=Number(c.buy_price||0);const r=calcCar(c);tS+=r.sales;tL+=r.labor;});
    const net=tS+tL-tB;
    html=`<div class="rep-row"><div class="rep-label">💰 مبيعات القطع</div><div class="rep-val g">${fmt(tS)}</div></div>
    <div class="rep-row"><div class="rep-label">🛠️ شغل اليد</div><div class="rep-val g">${fmt(tL)}</div></div>
    <div class="rep-row"><div class="rep-label">🛒 إجمالي الشراء</div><div class="rep-val r">${fmt(tB)}</div></div>
    <div class="rep-row" style="border:2px solid ${net>=0?'var(--g)':'var(--r)'}">
      <div style="font-weight:800;font-size:14px">${net>=0?'📈 صافي الربح':'📉 صافي الخسارة'}</div>
      <div class="rep-val ${net>=0?'g':'r'}" style="font-size:16px">${fmt(Math.abs(net))}</div>
    </div>
    <div style="font-size:11px;color:var(--mu);margin-top:8px;text-align:center">* لا يشمل المصاريف والورشة — للتفصيل راجع التقارير</div>`;
  }

  openModal(`<h2>${title}</h2>${html}`);
}

function filterStatList(type){
  const q=(document.getElementById('statSearch_'+type)?.value||'').toLowerCase();
  document.querySelectorAll('#statList_'+type+' .stat-item').forEach(el=>{
    el.style.display=el.dataset.search?.includes(q)?'':'none';
  });
}

function renderCars(){
  const isA=CU.role==='admin';
  let list=cars;
  if(curTab==='active')list=cars.filter(c=>!c.done);
  if(curTab==='done')list=cars.filter(c=>c.done);

  const q=(document.getElementById('carSearch')?.value||'').trim().toLowerCase();
  if(q){
    list=list.filter(c=>
      String(c.num).includes(q)||
      (c.model||'').toLowerCase().includes(q)||
      (c.notes||'').toLowerCase().includes(q)
    );
  }

  if(!list.length){
    document.getElementById('carsList').innerHTML=q
      ?`<div class="empty"><div class="empty-icon">🔍</div><h3>لا توجد نتائج</h3><p>جرب رقم أو موديل مختلف</p></div>`
      :`<div class="empty"><div class="empty-icon">🚗</div><h3>${T('noCars')}</h3><p>${T('addFirst')}</p></div>`;
    return;
  }

  document.getElementById('carsList').innerHTML=list.map(car=>{
    const{sales,labor,net}=calcCar(car);
    // استخراج السنة واللون من الملاحظات/الاسم
    const colorMatch=(car.notes||'').match(/اللون: ([^|]+)/);
    const color=colorMatch?colorMatch[1].trim():'';
    const modelParts=(car.model||'').split(' ');
    const year=modelParts.find(p=>/^20\d{2}$/.test(p))||'';
    const modelName=modelParts.filter(p=>!/^20\d{2}$/.test(p)).join(' ');

    return `<div class="car-card" id="cc-${car.id}">
      <!-- ── رأس البطاقة (دائماً ظاهر) ── -->
      <div class="car-top" onclick="toggleCar('${car.id}')" style="cursor:pointer">
        <div style="flex:1">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <div class="car-badge">#${car.num}</div>
            <div class="car-name">${modelName||car.model||'-'}</div>
            ${year?`<span style="font-size:11px;color:var(--mu);font-weight:600">${year}</span>`:''}
            ${color?`<span style="font-size:11px;background:#f1f5f9;padding:2px 8px;border-radius:6px;color:var(--mu)">${color}</span>`:''}
          </div>
          <div style="display:flex;align-items:center;gap:10px;margin-top:4px;flex-wrap:wrap">
            <span class="badge ${car.done?'badge-d':'badge-a'}">${car.done?T('doneCar'):T('activeCar')}</span>
            <span style="font-size:11px;color:var(--mu)">🔩 ${car.sales.filter(x=>!x.returned).length} قطعة</span>
            ${isA?`<span style="font-size:11px;color:${net>=0?'var(--g)':'var(--r)'};font-weight:700">${net>=0?'📈':'📉'} ${fmt(Math.abs(net))}</span>`:''}
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <svg id="arrow-${car.id}" viewBox="0 0 24 24" style="width:20px;height:20px;stroke:var(--mu);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </div>

      <!-- ── محتوى البطاقة (يفتح/يغلق) ── -->
      <div id="carBody-${car.id}" style="display:none">

        <!-- أزرار الإجراءات -->
        ${isA?`<div style="display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--bor);flex-wrap:wrap">
          <button class="ibtn b" onclick="viewCarMedia('${car.id}')">📷 الصور</button>
          <button class="ibtn b" onclick="exportCarPDF('${car.id}')">🧾 PDF</button>
          <button class="ibtn g" onclick="openEditCar('${car.id}')">✏️ تعديل</button>
          <button class="ibtn" onclick="toggleDone('${car.id}',${car.done})">${car.done?'↩ إعادة':'✔ إنهاء'}</button>
          <button class="ibtn r" onclick="delCar('${car.id}')">🗑 حذف</button>
        </div>`:''}

        <!-- الملاحظات -->
        ${car.notes?`<div class="car-note-row" onclick="toggleSection('notes-${car.id}')" style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--bor);cursor:pointer;background:#fffbeb">
          <span style="font-size:13px;font-weight:700;color:#92400e">📝 الملاحظات</span>
          <svg id="arr-notes-${car.id}" viewBox="0 0 24 24" style="width:16px;height:16px;stroke:var(--mu);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div id="notes-${car.id}" style="display:none;padding:10px 14px;background:#fffbeb;border-bottom:1px solid var(--bor);font-size:13px;color:#92400e">${car.notes}</div>`:''}

        <!-- الأرقام المالية (للمشرف فقط) -->
        ${isA?`<div onclick="toggleSection('kpis-${car.id}')" style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--bor);cursor:pointer">
          <span style="font-size:13px;font-weight:700">💰 التفاصيل المالية</span>
          <svg id="arr-kpis-${car.id}" viewBox="0 0 24 24" style="width:16px;height:16px;stroke:var(--mu);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div id="kpis-${car.id}" style="display:none;border-bottom:1px solid var(--bor)">
          <div class="car-kpis">
            <div class="kpi"><div class="kpi-label">${T('totalSales')}</div><div class="kpi-val">${fmt(sales)}</div></div>
            <div class="kpi"><div class="kpi-label">${T('laborTotal')}</div><div class="kpi-val">${fmt(labor)}</div></div>
            <div class="kpi"><div class="kpi-label">${net>=0?T('profit'):T('loss')}</div><div class="kpi-val ${net>=0?'g':'r'}">${fmt(Math.abs(net))}</div></div>
          </div>
          <div style="padding:8px 14px;display:flex;gap:12px;flex-wrap:wrap">
            <span style="font-size:12px;color:var(--mu)">${T('purchasePrice')}: <b>${fmt(car.buy_price)}</b></span>
            <span style="font-size:12px;color:var(--mu)">📅 ${new Date(car.created_at).toLocaleDateString()}</span>
          </div>
        </div>`:`<div class="car-kpis" style="border-bottom:1px solid var(--bor)">
          <div class="kpi"><div class="kpi-label">${T('parts')}</div><div class="kpi-val">${car.sales.filter(x=>!x.returned).length}</div></div>
          <div class="kpi"><div class="kpi-label">${T('laborTotal')}</div><div class="kpi-val">${fmt(labor)}</div></div>
          <div class="kpi"><div class="kpi-label">${T('status')}</div><div class="kpi-val ${car.done?'r':'g'}">${car.done?T('doneCar'):T('activeCar')}</div></div>
        </div>`}

        <!-- العربونات المعلقة -->
        ${car.deposits&&car.deposits.length?`
        <div onclick="toggleSection('deps-${car.id}')" style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--bor);cursor:pointer;background:#fffbeb">
          <span style="font-size:13px;font-weight:700;color:#92400e">⏳ عربونات معلقة (${car.deposits.length})</span>
          <svg id="arr-deps-${car.id}" viewBox="0 0 24 24" style="width:16px;height:16px;stroke:#92400e;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div id="deps-${car.id}" style="display:none;border-bottom:1px solid var(--bor);padding:10px 14px;background:#fffbeb">
          ${car.deposits.map(d=>{
            const rem=Number(d.total_amount)-Number(d.deposit_amount);
            return `<div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:6px 0;border-bottom:1px solid #fde68a">
              <div><div style="font-weight:700">${d.customer_name} — ${d.part_description}</div>
              <div style="color:#92400e">متبقي: ${fmt(rem)} من ${fmt(d.total_amount)}</div></div>
              ${CU.role==='admin'?`<button class="ibtn g" style="font-size:10px;padding:4px 7px" onclick="completeDeposit('${d.id}')">✓ اكتمل</button>`:''}
            </div>`;
          }).join('')}
        </div>`:''}

        <!-- المبيعات -->
        <div onclick="toggleSection('sales-${car.id}')" style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--bor);cursor:pointer">
          <span style="font-size:13px;font-weight:700">🔩 المبيعات (${car.sales.filter(x=>!x.returned).length})</span>
          <svg id="arr-sales-${car.id}" viewBox="0 0 24 24" style="width:16px;height:16px;stroke:var(--mu);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div id="sales-${car.id}" style="display:none;border-bottom:1px solid var(--bor)">
          <div style="padding:10px 14px">
            ${car.sales.length?car.sales.map(s=>{
              const ws=wStatus(s);
              return `<div class="sale-item" style="${s.returned?'opacity:0.7;background:#fff5f5':''}">
                <div class="sale-head">
                  <div class="sale-desc">${s.part_name||'-'}${s.returned?` <span style="color:var(--r);font-size:10px">(${T('returned')})</span>`:''}</div>
                  <div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap">
                    <div class="sale-price" style="${s.returned?'text-decoration:line-through;color:var(--mu)':''}">${fmt(s.price)}</div>
                    <button class="ibtn b" style="padding:3px 7px;font-size:10px" onclick="exportSalePDF('${car.id}','${s.id}')">${T('salePDF')}</button>
                    ${s.returned?`<button class="ibtn r" style="padding:3px 7px;font-size:10px" onclick="exportReturnPDF('${car.id}','${s.id}','')">${T('retPDF')}</button>`:''}
                    ${isA&&!s.returned?`<button class="ibtn r" style="padding:3px 7px;font-size:10px" onclick="returnSale('${car.id}','${s.id}')">${T('returnBtn')}</button>`:''}
                    ${isA?`<button class="ibtn r" style="padding:3px 7px;font-size:10px" onclick="delSale('${car.id}','${s.id}')">✕</button>`:''}
                  </div>
                </div>
                <div class="sale-meta">
                  <span class="mtag">📅 ${new Date(s.sale_date).toLocaleDateString()}</span>
                  ${s.invoice_num?`<span class="mtag" style="color:var(--bl);background:var(--bll)">🧾 ${s.invoice_num}</span>`:''}
                  ${s.labor>0?`<span class="mtag">🔧 ${fmt(s.labor)}</span>`:''}
                  ${s.technician?`<span class="mtag">🛠️ ${s.technician}</span>`:''}
                  ${s.payment_method?`<span class="mtag">${s.payment_method==='cash'?'💵 كاش':'💳 شبكة'}</span>`:''}
                  ${s.customer_name?`<span class="mtag">👤 ${s.customer_name}</span>`:''}
                  ${s.customer_phone?`<span class="mtag">📱 ${s.customer_phone}</span>`:''}

                </div>
              </div>`;
            }).join(''):`<div style="color:var(--mu);font-size:13px;text-align:center;padding:10px">${T('noSales')}</div>`}

        ${!car.done?`
        <div onclick="toggleSection('addSale-${car.id}')" style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;cursor:pointer;background:var(--gs)">
          <span style="font-size:13px;font-weight:700;color:var(--gd)">➕ ${T('newSale').replace('➕ ','')}</span>
          <svg id="arr-addSale-${car.id}" viewBox="0 0 24 24" style="width:16px;height:16px;stroke:var(--g);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div id="addSale-${car.id}" style="display:none;padding:14px;background:var(--gs)">
          <!-- صورة المركبة -->
          <div style="margin-bottom:10px">
            <label style="font-size:10px;font-weight:700;color:var(--mu);display:block;margin-bottom:5px">📸 صورة المركبة (اختياري)</label>
            <div style="display:flex;gap:8px">
              <label style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:#f0fdf4;border:2px dashed var(--g);border-radius:10px;padding:10px;cursor:pointer;font-size:12px;font-weight:700;color:var(--gd)">
                📷 كاميرا
                <input type="file" accept="image/*" capture="environment" id="carImg_${car.id}" style="display:none" onchange="previewCarImg('${car.id}')">
              </label>
              <label style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:#f0fdf4;border:2px dashed var(--g);border-radius:10px;padding:10px;cursor:pointer;font-size:12px;font-weight:700;color:var(--gd)">
                🖼️ معرض
                <input type="file" accept="image/*" id="carImgGal_${car.id}" style="display:none" onchange="previewCarImgGal('${car.id}')">
              </label>
            </div>
            <div id="carImgPreview_${car.id}" style="margin-top:8px;display:none">
              <img id="carImgThumb_${car.id}" style="width:100%;max-height:160px;object-fit:cover;border-radius:10px;border:2px solid var(--g)">
              <button onclick="clearCarImg('${car.id}')" style="width:100%;margin-top:4px;background:var(--rl);color:var(--r);border:none;border-radius:8px;padding:5px;font-size:11px;cursor:pointer;font-family:'Cairo',sans-serif">✕ إزالة</button>
            </div>
          </div>
          <!-- بيانات الزبون والدفع -->
          <div class="fgrid" style="margin-bottom:8px">
            <div class="fgi"><label>اسم الزبون</label><input type="text" id="cn_${car.id}" placeholder="اختياري"></div>
            <div class="fgi"><label>جوال الزبون</label><input type="tel" id="cp_${car.id}" placeholder="05xxxxxxxx" inputmode="numeric" dir="ltr"></div>
            <div class="fgi"><label>طريقة الدفع</label>
              <select id="pm_${car.id}">
                <option value="cash">💵 كاش</option>
                <option value="network">💳 شبكة</option>
              </select>

function prevModalCarImg(){
  const f=document.getElementById('m_carImg')?.files[0]||document.getElementById('m_carImgGal')?.files[0];
  if(!f)return;
  const r=new FileReader();r.onload=e=>{
    document.getElementById('m_carImgThumb').src=e.target.result;
    document.getElementById('m_carImgPreview').style.display='block';
  };r.readAsDataURL(f);
}

function previewModalPartImg(input,idx){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();r.onload=e=>{
    const preview=document.getElementById('m_partImgPreview_'+idx);
    const thumb=document.getElementById('m_partImgThumb_'+idx);
    if(thumb)thumb.src=e.target.result;
    if(preview)preview.style.display='block';
    if(input.closest('.part-row'))input.closest('.part-row').dataset.img=e.target.result;
  };r.readAsDataURL(f);
}

async function saveCar(){
  const model=(document.getElementById('m_model')?.value||'').trim();
  const year=(document.getElementById('m_year')?.value||'').trim();
  const color=(document.getElementById('m_color')?.value||'').trim();
  const price=parseFloat(document.getElementById('m_price')?.value||'0');
  const notesBase=(document.getElementById('m_notes')?.value||'').trim();
  const fullModel=model+(year?' '+year:'');
  const notes=notesBase+(color?' | اللون: '+color:'');

  if(!model){toast('أدخل موديل المركبة ⚠️');return;}
  if(!price||price<1){toast(T('enterBuyPrice'));return;}

  const btn=document.querySelector('.modal .btn');
  if(btn){btn.textContent=T('saving');btn.disabled=true;}

  const{data,error}=await sb.from('cars').insert({model:fullModel,buy_price:price,notes}).select().single();

  if(btn){btn.textContent='✓ حفظ المركبة';btn.disabled=false;}
  if(error||!data){toast('خطأ في الحفظ: '+(error?.message||''));return;}

  const carId=data.id;

  // رفع صورة المركبة
  const carImgFile=document.getElementById('m_carImg')?.files[0]||document.getElementById('m_carImgGal')?.files[0];
  if(carImgFile){
    const reader=new FileReader();
    reader.onload=async e=>{await sb.from('media').insert({car_id:carId,url:e.target.result,type:'car'});};
    reader.readAsDataURL(carImgFile);
  }

  // حفظ المبيعات المباشرة إن وجدت
  const rows=document.querySelectorAll('#m_partsContainer .part-row');
  if(rows.length){
    const technician=document.getElementById('m_tech')?.value||'';
    const payment_method=document.getElementById('m_pm')?.value||'cash';
    const customer_name=document.getElementById('m_cname')?.value.trim()||null;
    const customer_phone=document.getElementById('m_cphone')?.value.trim()||null;
    const wdays=parseInt(document.getElementById('m_wdays')?.value)||0;
    const invNum='INV-'+carId.slice(-4).toUpperCase()+'-'+Date.now().toString().slice(-5);

    for(const row of rows){
      const name=row.querySelector('input[type="text"]')?.value.trim();
      const salePrice=parseFloat(row.querySelector('input[placeholder="السعر"]')?.value)||0;
      const labor=parseFloat(row.querySelector('input[placeholder="شغل اليد"]')?.value)||0;
      const img=row.dataset.img||null;
      if(!name&&!salePrice)continue;
      const{data:sd}=await sb.from('sales').insert({
        car_id:carId,part_name:name||'قطعة',
        price:salePrice,labor,warranty_days:wdays,
        technician,payment_method,customer_name,customer_phone,
        sold_by:CU.name,sold_by_id:CU.id,
        sale_date:new Date().toISOString(),
        returned:false,invoice_num:invNum
      }).select().single();
      if(img&&sd)await sb.from('media').insert({car_id:carId,sale_id:sd.id,url:img,type:'part'});
    }
  }

  modalPartCounter=1;
  closeModal();toast(T('savedOk'));loadCars();
}

function previewEditCarImgs(){
  const inp1=document.getElementById('ec_img1');
  const inp2=document.getElementById('ec_img2');
  const container=document.getElementById('ec_imgPreviews');
  if(!container)return;
  container.innerHTML='';
  const files=[...(inp1?.files||[]),...(inp2?.files||[])];
  files.forEach(f=>{
    const r=new FileReader();
    r.onload=e=>{
      const img=document.createElement('img');
      img.src=e.target.result;
      img.style.cssText='width:80px;height:80px;object-fit:cover;border-radius:8px;border:2px solid var(--g)';
      container.appendChild(img);
    };
    r.readAsDataURL(f);

async function saveEditCar(carId){
  const model=(document.getElementById('ec_model')?.value||'').trim();
  const color=(document.getElementById('ec_color')?.value||'').trim();
  const price=parseFloat(document.getElementById('ec_price')?.value)||0;
  const notesBase=(document.getElementById('ec_notes')?.value||'').trim();
  const notes=notesBase+(color?' | اللون: '+color:'');
  if(!model){toast('أدخل موديل المركبة ⚠️');return;}
  if(!price){toast(T('enterBuyPrice'));return;}
  const btn=document.querySelector('.modal .btn');
  if(btn){btn.textContent='جاري الحفظ...';btn.disabled=true;}

  const{error}=await sb.from('cars').update({model,buy_price:price,notes}).eq('id',carId);
  if(btn){btn.textContent='💾 حفظ التعديل';btn.disabled=false;}
  if(error){toast('خطأ: '+error.message);return;}

  // رفع الصور الجديدة
  const inp1=document.getElementById('ec_img1');
  const inp2=document.getElementById('ec_img2');
  const files=[...(inp1?.files||[]),...(inp2?.files||[])];
  for(const f of files){
    await new Promise(res=>{
      const r=new FileReader();
      r.onload=async e=>{
        await sb.from('media').insert({car_id:carId,url:e.target.result,type:'car'});
        res();
      };
      r.readAsDataURL(f);
    });
  }

  closeModal();toast('تم الحفظ ✅');loadCars();
}

async function saveNewSale(){
  const mode=window._nsMode||'car';
  const tech=document.getElementById('ns_tech')?.value||'';
  const warranty=parseInt(document.getElementById('ns_warranty')?.value)||0;
  const payment_method=document.getElementById('ns_pm')?.value||'cash';
  const customer_name=document.getElementById('ns_cname')?.value.trim()||null;
  const customer_phone=document.getElementById('ns_cphone')?.value.trim()||null;

  // جمع القطع
  const rows=document.querySelectorAll('#ns_partsContainer .part-row');
  const parts=[];
  rows.forEach(row=>{
    const name=row.querySelector('input[type="text"]')?.value.trim();
    const price=parseFloat(row.querySelector('input[placeholder="السعر"]')?.value)||0;
    const labor=parseFloat(row.querySelector('input[placeholder="شغل اليد"]')?.value)||0;
    const img=row.dataset.img||null;
    if(name||price)parts.push({name:name||'قطعة',price,labor,img});
  });

  if(!parts.length||!parts.some(p=>p.price>0)){toast(T('enterSalePrice'));return;}

  const invNum='INV-GEN-'+Date.now().toString().slice(-5);

  if(mode==='car'){
    const num=document.getElementById('ns_carnum')?.value;
    const car=cars.find(c=>String(c.num)===String(num));
    if(!car){toast('❌ أدخل رقم سيارة صحيح');return;}
    for(const part of parts){
      const{data:sd,error}=await sb.from('sales').insert({
        car_id:car.id,part_name:part.name,
        price:part.price,labor:part.labor,
        warranty_days:warranty,technician:tech,
        payment_method,customer_name,customer_phone,
        sold_by:CU.name,sold_by_id:CU.id,
        sale_date:new Date().toISOString(),
        returned:false,invoice_num:invNum
      }).select().single();
      if(error){toast('خطأ: '+error.message);continue;}
      if(part.img&&sd)await sb.from('media').insert({car_id:car.id,sale_id:sd.id,url:part.img,type:'part'});
    }
  } else {
    for(const part of parts){
      const{error}=await sb.from('free_sales').insert({
        category:'general',
        description:part.name,
        price:part.price+part.labor,
        technician:tech,
        customer_name,customer_phone,
        sold_by:CU.name,
        sale_date:new Date().toISOString()
      });
      if(error){toast('خطأ: '+error.message);}
    }
  }
  closeModal();toast(T('saleOk'));loadCars();
}

async function addSaleMulti(carId){
  const technician=document.getElementById('t_'+carId)?.value||'';
  const payment_method=document.getElementById('pm_'+carId)?.value||'cash';
  const customer_name=document.getElementById('cn_'+carId)?.value.trim()||null;
  const customer_phone=document.getElementById('cp_'+carId)?.value.trim()||null;
  const wdays=parseInt(document.getElementById('w_'+carId)?.value)||0;

  // جمع كل القطع
  const rows=document.querySelectorAll('#partsContainer_'+carId+' .part-row');
  const parts=[];
  rows.forEach((row,i)=>{
    const name=row.querySelector('input[type="text"]')?.value.trim();
    const price=parseFloat(row.querySelector('input[placeholder="السعر"]')?.value)||0;
    const labor=parseFloat(row.querySelector('input[placeholder="شغل اليد"]')?.value)||0;
    const img=row.dataset.img||null;
    if(name||price)parts.push({name:name||'قطعة',price,labor,img});
  });

  if(!parts.length){toast('أدخل قطعة واحدة على الأقل ⚠️');return;}
  if(!parts.some(p=>p.price>0)){toast('أدخل سعر البيع ⚠️');return;}

  const btn=document.querySelector(`#partRow_${carId}_0`)?.closest('.add-sale')?.querySelector('.btn');
  if(btn){btn.textContent='جاري الحفظ...';btn.disabled=true;}

  // توليد رقم فاتورة
  const invNum='INV-'+carId.slice(-4).toUpperCase()+'-'+Date.now().toString().slice(-5);

  // إرسال كل قطعة
  let success=0;
  for(const part of parts){
    const{data:saleData,error}=await sb.from('sales').insert({
      car_id:carId,
      part_name:part.name,
      price:part.price,
      labor:part.labor,
      warranty_days:wdays,
      technician,payment_method,
      customer_name,customer_phone,
      sold_by:CU.name,sold_by_id:CU.id,
      sale_date:new Date().toISOString(),
      returned:false,
      invoice_num:invNum
    }).select().single();
    if(error){toast('خطأ: '+error.message);continue;}

    // رفع صورة القطعة إذا موجودة
    if(part.img&&saleData){
      await sb.from('media').insert({
        car_id:carId,
        sale_id:saleData.id,
        url:part.img,
        type:'part'
      });
    }
    success++;
  }

  // رفع صورة المركبة
  const carImgFile=document.getElementById('carImg_'+carId)?.files[0];
  if(carImgFile){
    const reader=new FileReader();
    reader.onload=async e=>{
      await sb.from('media').insert({car_id:carId,url:e.target.result,type:'car'});
    };
    reader.readAsDataURL(carImgFile);
  }

  if(btn){btn.textContent=T('saveSale');btn.disabled=false;}
  toast('تم تسجيل '+success+' قطعة ✅ | فاتورة: '+invNum);

  // مسح النموذج
  partRowCounters[carId]=1;
  loadCars();
}

function renderWarranty(){
  const all=[];
  cars.forEach(car=>car.sales.forEach(s=>{if(s.warranty_days>0)all.push({car,sale:s,ws:wStatus(s)});}));
  if(!all.length){document.getElementById('warrantyList').innerHTML=`<div class="empty"><div class="empty-icon">🛡️</div><h3>لا توجد ضمانات</h3><p>سجّل مبيعات بضمان لتظهر هنا</p></div>`;return;}
  const active=all.filter(x=>x.ws.cls==='wa').sort((a,b)=>a.ws.expiry-b.ws.expiry);
  const expired=all.filter(x=>x.ws.cls==='we');
  let html='';
  if(active.length){
    html+=`<div class="rep-sec"><h3>✅ سارية (${active.length})</h3>`;
    html+=active.map(x=>`<div class="witem"><div class="witem-head"><div><div style="font-size:13px;font-weight:700">${x.sale.part_name||'قطعة'}</div><div style="font-size:11px;color:var(--mu)">سيارة: ${x.car.model||'#'+x.car.num} | ${new Date(x.sale.sale_date).toLocaleDateString('ar-SA')}</div></div><span class="wbadge ${x.ws.cls}">${x.ws.label}</span></div><div style="font-size:11px;color:var(--mu)">💰 ${fmt(x.sale.price)}${x.sale.sold_by?' | 👤 '+x.sale.sold_by:''}</div></div>`).join('');
    html+='</div>';
  }
  if(expired.length){
    html+=`<div class="rep-sec"><h3>🔴 منتهية (${expired.length})</h3>`;
    html+=expired.map(x=>`<div class="witem"><div class="witem-head"><div><div style="font-size:13px;font-weight:700">${x.sale.part_name||'قطعة'}</div><div style="font-size:11px;color:var(--mu)">سيارة: ${x.car.model||'#'+x.car.num}</div></div><span class="wbadge ${x.ws.cls}">${x.ws.label}</span></div></div>`).join('');
    html+='</div>';
  }
  document.getElementById('warrantyList').innerHTML=html;
}

// ── REPORTS ──
async function renderReports(){
  if(CU.role!=='admin'){document.getElementById('reportsContent').innerHTML=`<div class="admin-msg">${T('reportsAdminOnly')}</div>`;return;}

  const{data:exps}=await sb.from('expenses').select('*');
  const{data:freeS}=await sb.from('free_sales').select('*');
  // المبيعات العامة تخزن في free_sales بـ category='general'
  const genS=[];

  // تحديث البطاقات الإحصائية في أعلى التقارير
  const totFree=(freeS||[]).reduce((s,x)=>s+Number(x.price||0),0);
  const totExp=(exps||[]).reduce((s,x)=>s+Number(x.amount||0),0);
  renderStats(totFree,totExp);

  // ── واجهة التقارير ──
  const now=new Date();
  const y1=now.getFullYear(), m1=now.getMonth()+1;
  const fromDef=y1+'-'+String(m1).padStart(2,'0')+'-01';
  const toDef=y1+'-'+String(m1).padStart(2,'0')+'-'+String(new Date(y1,m1,0).getDate()).padStart(2,'0');

  document.getElementById('reportsContent').innerHTML=`
  <div class="rep-filter">
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:14px">
      <button class="tab" onclick="setRep('day');document.querySelectorAll('.rep-filter .tab').forEach(b=>b.classList.remove('on'));this.classList.add('on')">اليوم</button>
      <button class="tab" onclick="setRep('week');document.querySelectorAll('.rep-filter .tab').forEach(b=>b.classList.remove('on'));this.classList.add('on')">الأسبوع</button>
      <button class="tab on" onclick="setRep('month');document.querySelectorAll('.rep-filter .tab').forEach(b=>b.classList.remove('on'));this.classList.add('on')">الشهر</button>
      <button class="tab" onclick="setRep('year');document.querySelectorAll('.rep-filter .tab').forEach(b=>b.classList.remove('on'));this.classList.add('on')">السنة</button>
      <button class="tab" onclick="setRep('custom');document.querySelectorAll('.rep-filter .tab').forEach(b=>b.classList.remove('on'));this.classList.add('on')">مخصص</button>
    </div>
    <div id="customRange" style="display:none;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center">
      <div style="display:flex;align-items:center;gap:6px;flex:1">
        <label style="font-size:12px;font-weight:700;white-space:nowrap">من:</label>
        <input type="date" id="repFrom" value="${fromDef}" style="flex:1;padding:8px;border-radius:8px;border:1.5px solid var(--g);font-family:'Cairo',sans-serif">
      </div>
      <div style="display:flex;align-items:center;gap:6px;flex:1">
        <label style="font-size:12px;font-weight:700;white-space:nowrap">إلى:</label>
        <input type="date" id="repTo" value="${toDef}" style="flex:1;padding:8px;border-radius:8px;border:1.5px solid var(--g);font-family:'Cairo',sans-serif">
      </div>
      <button class="btn" style="margin:0;padding:8px 16px" onclick="buildReport()">🔍 بحث</button>
    </div>
  </div>
  <div id="repBody"></div>`;

  // ── دوال مساعدة ──
  window._repData={exps:exps||[],freeS:freeS||[]};

  window.setRep=function(mode){
    const n=new Date();
    let from,to;
    if(mode==='day'){from=to=n.toISOString().slice(0,10);}
    else if(mode==='week'){
      const d=new Date(n);d.setDate(n.getDate()-6);
      from=d.toISOString().slice(0,10);to=n.toISOString().slice(0,10);
    }else if(mode==='month'){
      from=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-01';
      to=n.toISOString().slice(0,10);
    }else if(mode==='year'){
      from=n.getFullYear()+'-01-01';to=n.toISOString().slice(0,10);
    }else{
      const cr=document.getElementById('customRange');
      if(cr)cr.style.display='flex';
      return;
    }
    const cr=document.getElementById('customRange');
    if(cr)cr.style.display='none';
    if(document.getElementById('repFrom'))document.getElementById('repFrom').value=from;
    if(document.getElementById('repTo'))document.getElementById('repTo').value=to;
    buildReport(from,to);
  };

  window.buildReport=function(from,to){
    from=from||document.getElementById('repFrom')?.value;
    to=to||document.getElementById('repTo')?.value;
    if(!from||!to)return;
    const f=new Date(from+'T00:00:00');
    const t=new Date(to+'T23:59:59');
    const{exps,freeS}=window._repData;
    const genS=[];

    // مبيعات القطع
    let tS=0,tL=0,tRet=0;
    const salesList=[];
    cars.forEach(car=>{
      car.sales.forEach(s=>{
        const sd=new Date(s.sale_date);
        if(sd>=f&&sd<=t){
          if(s.returned){tRet+=Number(s.price||0);}
          else{tS+=Number(s.price||0);tL+=Number(s.labor||0);}
          salesList.push({...s,carNum:car.num,carModel:car.model});
        }
      });
    });

    // مشتريات السيارات بتاريخ الشراء
    let tB=0;
    const buyList=[];
    cars.forEach(car=>{
      const cd=new Date(car.created_at);
      if(cd>=f&&cd<=t){
        tB+=Number(car.buy_price||0);
        buyList.push(car);
      }
    });

    // الورشة
    const freeList=(freeS||[]).filter(x=>{const d=new Date(x.sale_date);return d>=f&&d<=t;});
    const totFree=freeList.reduce((s,x)=>s+Number(x.price||0),0);

    // مبيعات عامة
    const genList=(genS||[]).filter(x=>{const d=new Date(x.sale_date||x.created_at);return d>=f&&d<=t;});
    const totGen=genList.reduce((s,x)=>s+Number(x.price||0)+Number(x.labor||0),0);

    // المصاريف
    const expList=(exps||[]).filter(x=>{const d=new Date(x.created_at);return d>=f&&d<=t;});
    const totExp=expList.reduce((s,x)=>s+Number(x.amount||0),0);

    const totalIncome=tS+tL+totFree+totGen;
    const grossNet=totalIncome-tB;
    const netFinal=grossNet-totExp;

    const fmtDate=d=>new Date(d).toLocaleDateString('ar-SA');

    // قائمة المبيعات
    const salesRows=salesList.filter(s=>!s.returned).map(s=>`
      <div class="rep-row">
        <div class="rep-label">🔩 ${s.part_name||'قطعة'} — سيارة #${s.carNum}</div>
        <div style="font-size:11px;color:var(--mu)">${fmtDate(s.sale_date)} · ${s.sold_by||'-'}</div>
        <div class="rep-val g">${fmt(Number(s.price||0)+Number(s.labor||0))}</div>
      </div>`).join('');

    // قائمة المشتريات
    const buyRows=buyList.map(c=>`
      <div class="rep-row">
        <div class="rep-label">🚗 ${c.model||'سيارة'} #${c.num}</div>
        <div style="font-size:11px;color:var(--mu)">${fmtDate(c.created_at)}</div>
        <div class="rep-val r">${fmt(c.buy_price||0)}</div>
      </div>`).join('');

    // قائمة المصاريف
    const expRows=expList.map(e=>`
      <div class="rep-row">
        <div class="rep-label">💸 ${e.description||e.category||'مصروف'}</div>
        <div style="font-size:11px;color:var(--mu)">${fmtDate(e.created_at)}</div>
        <div class="rep-val r">${fmt(e.amount||0)}</div>
      </div>`).join('');

    document.getElementById('repBody').innerHTML=`
    <div style="font-size:12px;color:var(--mu);margin-bottom:12px;text-align:center">
      📅 من ${from} إلى ${to}
    </div>

    <div class="rep-sec">
      <h3>📊 الملخص المالي</h3>
      <div class="rep-row"><div class="rep-label">💰 مبيعات القطع</div><div class="rep-val g">${fmt(tS)}</div></div>
      <div class="rep-row"><div class="rep-label">🛠️ شغل اليد</div><div class="rep-val g">${fmt(tL)}</div></div>
      ${totFree>0?`<div class="rep-row"><div class="rep-label">🔧 خدمات الورشة</div><div class="rep-val g">${fmt(totFree)}</div></div>`:''}
      ${totGen>0?`<div class="rep-row"><div class="rep-label">📦 مبيعات عامة</div><div class="rep-val g">${fmt(totGen)}</div></div>`:''}
      ${tRet>0?`<div class="rep-row"><div class="rep-label">↩ مرتجعات</div><div class="rep-val r">- ${fmt(tRet)}</div></div>`:''}
      <div class="rep-row"><div class="rep-label">🛒 مشتريات السيارات</div><div class="rep-val r">- ${fmt(tB)}</div></div>
      <div class="rep-row"><div class="rep-label">📈 الربح قبل المصاريف</div><div class="rep-val ${grossNet>=0?'g':'r'}">${fmt(Math.abs(grossNet))}</div></div>
      ${totExp>0?`<div class="rep-row"><div class="rep-label">💸 المصاريف</div><div class="rep-val r">- ${fmt(totExp)}</div></div>`:''}
      <div class="rep-row" style="border:2px solid ${netFinal>=0?'var(--g)':'var(--r)'}">
        <div class="rep-label" style="font-weight:800;font-size:14px">${netFinal>=0?'📈 صافي الربح':'📉 صافي الخسارة'}</div>
        <div class="rep-val ${netFinal>=0?'g':'r'}" style="font-size:16px">${fmt(Math.abs(netFinal))}</div>
      </div>
    </div>

    ${salesList.filter(s=>!s.returned).length?`<div class="rep-sec"><h3>🔩 المبيعات (${salesList.filter(s=>!s.returned).length})</h3>${salesRows}</div>`:''}
    ${buyList.length?`<div class="rep-sec"><h3>🚗 المشتريات (${buyList.length})</h3>${buyRows}</div>`:''}
    ${expList.length?`<div class="rep-sec"><h3>💸 المصاريف (${expList.length})</h3>${expRows}</div>`:''}

    <button class="btn" style="width:100%;margin-top:8px" onclick="exportRepPDF('${from}','${to}')">
      📄 تصدير PDF
    </button>`;
  };

  // افتراضي = الشهر الحالي
  window.setRep('month');
}

function exportRepPDF(from,to){
  if(!window._repData){toast('افتح التقارير أولاً');return;}
  const{jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'p',unit:'mm',format:'a4'});
  const W=210;

  // دالة رسم نص عربي كصورة
  function ar(text,fs,color,bold,w){
    const wd=w||420;
    const cv=document.createElement('canvas');
    const sc=3;cv.width=wd*sc;cv.height=(fs+12)*sc;
    const ctx=cv.getContext('2d');
    ctx.scale(sc,sc);
    ctx.font=(bold?'bold ':'')+fs+'px Cairo,Arial';
    ctx.fillStyle=color||'#0f172a';
    ctx.textAlign='right';
    ctx.fillText(text,wd-2,fs+2);
    return cv.toDataURL('image/png');
  }

  // ── هيدر ──
  doc.setFillColor(...SH.GD);doc.rect(0,0,W,20,'F');
  doc.setFillColor(...SH.G);doc.rect(0,20,W,22,'F');
  // اسم الشركة
  doc.addImage(ar('تشليح البرج',18,'#ffffff',true,300),14,4,80,12);
  doc.addImage(ar('تقرير مالي',13,'#ffffff',false,250),14,22,65,10);
  doc.addImage(ar('القصيم — الرس',9,'rgba(255,255,255,0.8)',false,200),14,32,55,8);
  doc.setFontSize(8);doc.setTextColor(255,255,255);doc.setFont('helvetica','normal');
  doc.text(new Date().toLocaleDateString('en-GB'),W-14,38,{align:'right'});
  let y=50;

  // ── الفترة الزمنية ──
  doc.addImage(ar('الفترة: من '+from+' إلى '+to,10,'#64748b',false,350),14,y,90,8);
  y+=12;

  // ── جمع البيانات ──
  const{exps,freeS}=window._repData;
  const f=new Date(from+'T00:00:00'),t=new Date(to+'T23:59:59');
  let tS=0,tL=0,tB=0,tRet=0,totFree=0,totExp=0;
  const salesDetails=[];
  const buyDetails=[];

  cars.forEach(car=>{
    car.sales.forEach(s=>{
      const sd=new Date(s.sale_date);
      if(sd>=f&&sd<=t){
        if(s.returned){tRet+=Number(s.price||0);}
        else{tS+=Number(s.price||0);tL+=Number(s.labor||0);}
        salesDetails.push({...s,carNum:car.num,carModel:car.model,isReturn:s.returned});
      }
    });
    const cd=new Date(car.created_at);
    if(cd>=f&&cd<=t){tB+=Number(car.buy_price||0);buyDetails.push(car);}
  });
  const freeList=(freeS||[]).filter(x=>{const d=new Date(x.sale_date);return d>=f&&d<=t;});
  totFree=freeList.reduce((s,x)=>s+Number(x.price||0),0);
  const expList=(exps||[]).filter(x=>{const d=new Date(x.created_at);return d>=f&&d<=t;});
  totExp=expList.reduce((s,x)=>s+Number(x.amount||0),0);
  const net=tS+tL+totFree-tB-totExp;

  // ── دالة رسم قسم ──
  function section(title){
    doc.setFillColor(...SH.G);doc.rect(14,y,W-28,8,'F');
    doc.addImage(ar(title,9,'#ffffff',true,300),14,y,W-28,8);
    y+=10;
  }

  function row(label,val,color,minus){
    if(y>270){doc.addPage();y=18;}
    doc.setFillColor(248,255,250);doc.rect(14,y,W-28,9,'F');
    doc.setDrawColor(220,240,220);doc.setLineWidth(.2);doc.rect(14,y,W-28,9,'D');
    doc.addImage(ar(label,9,color||'#0f172a',false,300),14,y,80,9);
    doc.setFontSize(9);doc.setTextColor(color==='#dc2626'?220:color==='#16a34a'?22:50,
      color==='#16a34a'?163:50,color==='#dc2626'?38:50);
    doc.setFont('helvetica','bold');
    doc.text((minus?'- ':'')+Number(val).toLocaleString()+' SAR',W-16,y+6,{align:'right'});
    y+=9;
  }

  // ── الملخص المالي ──
  section('الملخص المالي');
  if(tS>0) row('مبيعات القطع',tS,'#16a34a');
  if(tL>0) row('شغل اليد',tL,'#16a34a');
  if(totFree>0) row('خدمات الورشة',totFree,'#16a34a');
  if(tRet>0) row('مرتجعات القطع',tRet,'#dc2626',true);
  if(tB>0) row('مشتريات السيارات',tB,'#dc2626',true);
  if(totExp>0) row('المصاريف الإدارية',totExp,'#dc2626',true);
  y+=4;

  // صافي الربح/الخسارة
  doc.setFillColor(...(net>=0?SH.G:SH.GR));
  doc.roundedRect(14,y,W-28,14,3,3,'F');
  doc.addImage(ar((net>=0?'صافي الربح: ':'صافي الخسارة: ')+Math.abs(net).toLocaleString()+' SAR',
    12,'#ffffff',true,400),14,y,W-28,14);
  y+=20;

  // ── تفاصيل المبيعات ──
  const activeSales=salesDetails.filter(s=>!s.isReturn);
  if(activeSales.length){
    section('تفاصيل المبيعات ('+activeSales.length+')');
    // رأس الجدول
    doc.setFillColor(240,253,244);doc.rect(14,y,W-28,8,'F');
    doc.addImage(ar('القطعة',8,'#14532d',true,120),14,y,35,8);
    doc.addImage(ar('السيارة',8,'#14532d',true,80),75,y,22,8);
    doc.addImage(ar('التاريخ',8,'#14532d',true,80),100,y,22,8);
    doc.addImage(ar('الموظف',8,'#14532d',true,80),125,y,22,8);
    doc.addImage(ar('المبلغ',8,'#14532d',true,80),W-14,y,22,8);
    y+=8;

    activeSales.forEach((s,i)=>{
      if(y>268){pF(doc,W);doc.addPage();y=18;}
      const bg=i%2===0?[255,255,255]:[248,255,248];
      doc.setFillColor(...bg);doc.rect(14,y,W-28,8,'F');
      doc.addImage(ar(String(s.part_name||'قطعة').substring(0,18),8,'#0f172a',true,160),14,y,45,8);
      doc.addImage(ar('#'+s.carNum,8,'#64748b',false,60),75,y,18,8);
      doc.setFontSize(7.5);doc.setTextColor(100,116,139);doc.setFont('helvetica','normal');
      doc.text(new Date(s.sale_date).toLocaleDateString('en-GB'),102,y+5.5);
      doc.addImage(ar(String(s.sold_by||'-').substring(0,10),7.5,'#64748b',false,100),125,y,25,8);
      doc.setTextColor(...SH.G);doc.setFont('helvetica','bold');doc.setFontSize(8);
      doc.text((Number(s.price||0)+Number(s.labor||0)).toLocaleString(),W-14,y+5.5,{align:'right'});
      doc.setDrawColor(220,240,220);doc.setLineWidth(.15);doc.line(14,y+8,W-14,y+8);
      y+=8;
    });
    y+=6;
  }

  // ── المرتجعات ──
  const retSales=salesDetails.filter(s=>s.isReturn);
  if(retSales.length){
    section('المرتجعات ('+retSales.length+')');
    retSales.forEach((s,i)=>{
      if(y>268){pF(doc,W);doc.addPage();y=18;}
      doc.setFillColor(255,248,248);doc.rect(14,y,W-28,8,'F');
      doc.addImage(ar(String(s.part_name||'قطعة').substring(0,20),8,'#dc2626',true,200),14,y,55,8);
      doc.addImage(ar('#'+s.carNum,8,'#64748b',false,60),80,y,18,8);
      doc.setFontSize(7.5);doc.setTextColor(100,116,139);doc.setFont('helvetica','normal');
      doc.text(new Date(s.sale_date).toLocaleDateString('en-GB'),102,y+5.5);
      doc.setTextColor(...SH.GR);doc.setFont('helvetica','bold');doc.setFontSize(8);
      doc.text('-'+Number(s.price||0).toLocaleString()+' SAR',W-14,y+5.5,{align:'right'});
      doc.setDrawColor(255,200,200);doc.setLineWidth(.15);doc.line(14,y+8,W-14,y+8);
      y+=8;
    });
    y+=6;
  }

  // ── مشتريات السيارات ──
  if(buyDetails.length){
    section('مشتريات السيارات ('+buyDetails.length+')');
    buyDetails.forEach((c,i)=>{
      if(y>268){pF(doc,W);doc.addPage();y=18;}
      const bg=i%2===0?[255,255,255]:[248,255,248];
      doc.setFillColor(...bg);doc.rect(14,y,W-28,8,'F');
      doc.addImage(ar((c.model||'سيارة')+' #'+c.num,8,'#0f172a',true,200),14,y,55,8);
      doc.setFontSize(7.5);doc.setTextColor(100,116,139);doc.setFont('helvetica','normal');
      doc.text(new Date(c.created_at).toLocaleDateString('en-GB'),102,y+5.5);
      doc.setTextColor(...SH.GR);doc.setFont('helvetica','bold');doc.setFontSize(8);
      doc.text('-'+Number(c.buy_price||0).toLocaleString()+' SAR',W-14,y+5.5,{align:'right'});
      doc.setDrawColor(220,240,220);doc.setLineWidth(.15);doc.line(14,y+8,W-14,y+8);
      y+=8;
    });
    y+=6;
  }

  // ── الورشة ──
  if(freeList.length){
    section('خدمات الورشة ('+freeList.length+')');
    freeList.forEach((s,i)=>{
      if(y>268){pF(doc,W);doc.addPage();y=18;}
      const bg=i%2===0?[255,255,255]:[248,255,248];
      doc.setFillColor(...bg);doc.rect(14,y,W-28,8,'F');
      doc.addImage(ar(String(s.description||s.category||'خدمة').substring(0,20),8,'#0f172a',true,200),14,y,55,8);
      doc.setFontSize(7.5);doc.setTextColor(100,116,139);doc.setFont('helvetica','normal');
      doc.text(new Date(s.sale_date||s.created_at).toLocaleDateString('en-GB'),102,y+5.5);
      doc.setTextColor(...SH.G);doc.setFont('helvetica','bold');doc.setFontSize(8);
      doc.text(Number(s.price||0).toLocaleString()+' SAR',W-14,y+5.5,{align:'right'});
      doc.setDrawColor(220,240,220);doc.setLineWidth(.15);doc.line(14,y+8,W-14,y+8);
      y+=8;
    });
    y+=6;
  }

  // ── المصاريف ──
  if(expList.length){
    section('المصاريف الإدارية ('+expList.length+')');
    expList.forEach((e,i)=>{
      if(y>268){pF(doc,W);doc.addPage();y=18;}
      const bg=i%2===0?[255,255,255]:[255,248,248];
      doc.setFillColor(...bg);doc.rect(14,y,W-28,8,'F');
      doc.addImage(ar(String(e.description||e.category||'مصروف').substring(0,20),8,'#0f172a',true,200),14,y,55,8);
      doc.setFontSize(7.5);doc.setTextColor(100,116,139);doc.setFont('helvetica','normal');
      doc.text(new Date(e.created_at).toLocaleDateString('en-GB'),102,y+5.5);
      doc.setTextColor(...SH.GR);doc.setFont('helvetica','bold');doc.setFontSize(8);
      doc.text('-'+Number(e.amount||0).toLocaleString()+' SAR',W-14,y+5.5,{align:'right'});
      doc.setDrawColor(255,200,200);doc.setLineWidth(.15);doc.line(14,y+8,W-14,y+8);
      y+=8;
    });
  }

  pF(doc,W);
  doc.save('تقرير_'+from+'_الى_'+to+'.pdf');
  toast(T('pdfOk'));
}
