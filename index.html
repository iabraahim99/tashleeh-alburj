let _notifInterval=null;

async function loadNotifications(){
  if(!CU)return;
  // جلب إشعارات المستخدم + العامة
  const{data}=await sb.from('notifications')
    .select('*')
    .or(`user_id.eq.${CU.id},user_id.is.null`)
    .order('created_at',{ascending:false})
    .limit(50);
  const notifs=data||[];
  renderBell(notifs);
}

function renderBell(notifs){
  const unread=notifs.filter(n=>!n.is_read).length;
  const badge=document.getElementById('bellBadge');
  if(badge){
    badge.textContent=unread>9?'9+':unread;
    badge.style.display=unread>0?'flex':'none';
  }

  const list=document.getElementById('bellList');
  if(!list)return;

  if(!notifs.length){
    list.innerHTML=`<div style="text-align:center;color:var(--mu);padding:20px;font-size:13px">لا توجد تنبيهات</div>`;
    return;
  }

  const typeColor={deposit:'#ef4444',document:'#f59e0b',warranty:'#f97316',general:'#3b82f6'};
  const typeIcon={deposit:'💰',document:'📄',warranty:'🛡️',general:'ℹ️'};

  list.innerHTML=notifs.map(n=>{
    const d=new Date(n.created_at);
    const timeAgo=timeSince(d);
    const color=typeColor[n.type]||'#64748b';
    const icon=typeIcon[n.type]||'🔔';
    return `<div onclick="readNotif('${n.id}','${n.link||''}')"
      style="padding:11px 14px;border-bottom:1px solid var(--bor);cursor:pointer;background:${n.is_read?'#fff':'#f0fdf4'};transition:background .2s"
      onmouseover="this.style.background='#f8fafc'" onmouseout="this.style.background='${n.is_read?'#fff':'#f0fdf4'}'">
      <div style="display:flex;align-items:flex-start;gap:8px">
        <span style="font-size:16px;margin-top:1px">${icon}</span>
        <div style="flex:1">
          <div style="font-size:12px;font-weight:${n.is_read?'600':'800'};color:${n.is_read?'var(--mu)':'var(--txt)'};line-height:1.4">${n.title}</div>
          <div style="font-size:11px;color:var(--mu);margin-top:2px;line-height:1.4">${n.message}</div>
          <div style="font-size:10px;color:#94a3b8;margin-top:3px">${timeAgo}</div>
        </div>
        ${!n.is_read?`<span style="width:8px;height:8px;background:#3b82f6;border-radius:50%;margin-top:4px;flex-shrink:0"></span>`:''}
      </div>
    </div>`;
  }).join('');
}

function timeSince(date){
  const sec=Math.floor((Date.now()-date.getTime())/1000);
  if(sec<60)return 'الآن';
  if(sec<3600)return Math.floor(sec/60)+' دقيقة';
  if(sec<86400)return Math.floor(sec/3600)+' ساعة';
  return Math.floor(sec/86400)+' يوم';
}

function toggleBell(){
  const dd=document.getElementById('bellDropdown');
  if(!dd)return;
  const isOpen=dd.style.display!=='none';
  dd.style.display=isOpen?'none':'block';
  if(!isOpen)loadNotifications();
  // إغلاق عند الضغط خارج الجرس
  if(!isOpen){
    setTimeout(()=>{
      document.addEventListener('click',closeBellOutside,{once:true});
    },100);
  }
}

function closeBellOutside(e){
  const wrap=document.getElementById('bellWrap');
  if(wrap&&!wrap.contains(e.target)){
    const dd=document.getElementById('bellDropdown');
    if(dd)dd.style.display='none';
  }
}

async function readNotif(id,link){
  await sb.from('notifications').update({is_read:true}).eq('id',id);
  const dd=document.getElementById('bellDropdown');
  if(dd)dd.style.display='none';
  if(link){
    if(link.includes('deposits')){nav('Data',document.getElementById('navData'));switchData('deposits',document.getElementById('tabDeposits'));}
    else if(link.includes('documents')){nav('Data',document.getElementById('navData'));switchData('documents',document.getElementById('tabDocuments'));}
    else if(link.includes('warranty')){nav('Data',document.getElementById('navData'));switchData('warranty',document.getElementById('tabWarranty'));}
  }
  loadNotifications();
}

async function markAllRead(){
  if(!CU)return;
  await sb.from('notifications').update({is_read:true})
    .or(`user_id.eq.${CU.id},user_id.is.null`)

// ── توليد التنبيهات تلقائياً ──
async function generateNotifications(){
  if(!CU||CU.role!=='admin')return;
  const now=Date.now();
  const weekAgo=now-(7*24*60*60*1000);
  const toInsert=[];

  // 1. عربونات متأخرة
  const{data:deps}=await sb.from('deposits').select('*').eq('status','pending');
  for(const d of deps||[]){
    if(new Date(d.created_at).getTime()<weekAgo){
      // تحقق إذا الإشعار موجود مسبقاً
      const{data:ex}=await sb.from('notifications').select('id').eq('type','deposit').ilike('message','%'+d.id+'%').limit(1);
      if(!ex||ex.length===0){
        const rem=Number(d.total_amount)-Number(d.deposit_amount);
        const days=Math.floor((now-new Date(d.created_at).getTime())/(1000*60*60*24));
        toInsert.push({
          user_id:null,type:'deposit',is_read:false,
          title:'🔴 عربون متأخر',
          message:`${d.customer_name} - ${d.part_description} - متبقي ${rem.toLocaleString()} ر.س (${days} يوم) [${d.id}]`,
          link:'deposits',created_at:new Date().toISOString()
        });
      }
    }
  }

  // 2. وثائق - تنبيهات عند 30 و14 و7 أيام
  const{data:docs}=await sb.from('documents').select('*');
  for(const d of docs||[]){
    const exp=new Date(d.expiry_date);
    const daysLeft=Math.ceil((exp-now)/(1000*60*60*24));

    // تحديد نوع التنبيه المناسب
    let alertType=null;
    if(daysLeft<0) alertType='expired';
    else if(daysLeft<=7) alertType='7days';
    else if(daysLeft<=14) alertType='14days';
    else if(daysLeft<=30) alertType='30days';

    if(!alertType)continue;

    // تحقق إذا نفس التنبيه أُرسل مسبقاً (بنفس نوعه للوثيقة نفسها)
    const{data:ex}=await sb.from('notifications')
      .select('id').eq('type','document')
      .ilike('title','%'+alertType+'%')
      .ilike('message','%'+d.id+'%').limit(1);
    if(ex&&ex.length>0)continue;

    let title='',emoji='';
    if(alertType==='expired'){title='🔴 [expired] وثيقة منتهية';emoji='🔴';}
    else if(alertType==='7days'){title='🔴 [7days] تنبيه عاجل - وثيقة';emoji='🔴';}
    else if(alertType==='14days'){title='🟡 [14days] تنبيه - وثيقة';emoji='🟡';}
    else if(alertType==='30days'){title='🟠 [30days] تذكير - وثيقة';emoji='🟠';}

    let msg='';
    if(alertType==='expired') msg=`${emoji} ${d.name} - منتهية منذ ${Math.abs(daysLeft)} يوم [${d.id}]`;
    else msg=`${emoji} ${d.name} - تنتهي بعد ${daysLeft} يوم [${d.id}]`;

    toInsert.push({user_id:null,type:'document',is_read:false,title,message:msg,link:'documents',created_at:new Date().toISOString()});
  }

  // 3. ضمانات على وشك الانتهاء (7 أيام)
  cars.forEach(car=>{
    car.sales.filter(s=>!s.returned&&s.warranty_days>0).forEach(s=>{
      const saleDate=new Date(s.sale_date);
      const expDate=new Date(saleDate.getTime()+s.warranty_days*24*60*60*1000);
      const daysLeft=Math.ceil((expDate-now)/(1000*60*60*24));
      if(daysLeft>=0&&daysLeft<=7){
        toInsert.push({user_id:null,type:'warranty',is_read:false,
          title:'🟠 ضمان على وشك الانتهاء',
          message:`${s.part_name||'قطعة'} - يتبقى ${daysLeft} يوم`,
          link:'warranty',created_at:new Date().toISOString()});
      }
    });
  });

  if(toInsert.length>0){
    await sb.from('notifications').insert(toInsert);
    loadNotifications();
  }
}

// ── بدء التحديث التلقائي كل 5 دقائق ──
function startNotifRefresh(){
  if(_notifInterval)clearInterval(_notifInterval);
  _notifInterval=setInterval(()=>{
    loadNotifications();
    generateNotifications();
  },5*60*1000);
}

async function saveQuickSale(){
  const mode=_qsMode;
  const cname=document.getElementById('qs_cname')?.value.trim()||null;
  const cphone=document.getElementById('qs_cphone')?.value.trim()||null;
  const pm=document.getElementById('qs_pm')?.value||'cash';
  const warranty=parseInt(document.getElementById('qs_warranty')?.value)||0;
  const tech=document.getElementById('qs_tech')?.value||'';
  const rows=document.querySelectorAll('#qs_partsContainer .part-row');
  const parts=[];
  rows.forEach(row=>{
    const name=row.querySelector('input[type="text"]')?.value.trim();
    const price=parseFloat(row.querySelector('input[placeholder="السعر"]')?.value)||0;
    const labor=parseFloat(row.querySelector('input[placeholder="شغل اليد"]')?.value)||0;
    const img=row.dataset.img||null;
    if(name||price)parts.push({name:name||'قطعة',price,labor,img});
  });
  if(!parts.length){toast(T('addPartFirst'));return;}
  if(!parts.some(p=>p.price>0)){toast(T('enterSalePrice'));return;}
  const invNum='INV-'+Date.now().toString().slice(-8);
  if(mode==='car'){
    const num=document.getElementById('qs_carnum')?.value;
    const car=cars.find(c=>String(c.num)===String(num));
    if(!car){toast(T('carNotFound'));return;}
    for(const part of parts){
      const{data:sd,error}=await sb.from('sales').insert({
        car_id:car.id,part_name:part.name,price:part.price,labor:part.labor,
        warranty_days:warranty,technician:tech,payment_method:pm,
        customer_name:cname,customer_phone:cphone,
        sold_by:CU.name,sold_by_id:CU.id,
        sale_date:new Date().toISOString(),returned:false,invoice_num:invNum
      }).select().single();
      if(!error&&part.img&&sd)await sb.from('media').insert({car_id:car.id,sale_id:sd.id,url:part.img,type:'part'});
    }
  } else {
    for(const part of parts){
      await sb.from('free_sales').insert({
        category:'general',description:part.name,price:part.price+part.labor,
        technician:tech,customer_name:cname,customer_phone:cphone,
        sold_by:CU.name,sale_date:new Date().toISOString()
      });
    }
  }
  const totalAmt=parts.reduce((s,p)=>s+(p.price+p.labor),0);
  if(totalAmt>=1000){
    sb.from('notifications').insert({user_id:null,type:'general',is_read:false,
      title:'💰 مبيعة كبيرة',
      message:`${parts.length} قطعة - ${totalAmt.toLocaleString()} ر.س - بواسطة ${CU.name}`,
      link:'',created_at:new Date().toISOString()}).then(()=>loadNotifications());
  }
  // مسح النموذج
  document.getElementById('qs_carnum').value='';
  document.getElementById('qs_carInfo').innerHTML='';
  document.getElementById('qs_cname').value='';
  document.getElementById('qs_cphone').value='';
  document.getElementById('qs_warranty').value='';
  _qsPartCounter=1;
  const cont=document.getElementById('qs_partsContainer');
  if(cont){
    const first=cont.querySelector('.part-row');
    if(first){first.querySelectorAll('input').forEach(i=>i.value='');first.dataset.img='';const pr=first.querySelector('[id^="qs_partImgPreview"]');if(pr)pr.style.display='none';}
    Array.from(cont.querySelectorAll('.part-row')).slice(1).forEach(r=>r.remove());
  }
  toast('✅ '+parts.length+' قطعة | '+invNum);
  loadCars();renderRecentSales();
}

  const{data:freeS}=await sb.from('free_sales').select('price,sale_date');

  const totFree=(freeS||[]).reduce((s,x)=>s+Number(x.price||0),0);

  let tB=0,tS=0,tL=0;
  cars.forEach(c=>{
    tB+=Number(c.buy_price||0);
    const r=calcCar(c);tS+=r.sales;tL+=r.labor;
  });
  const net=tS+tL+totFree-tB-totExp;
  const parts=cars.reduce((s,c)=>s+c.sales.filter(x=>!x.returned).length,0);

  // مبيعات اليوم
  const today=new Date();today.setHours(0,0,0,0);
  let todaySales=0;
  cars.forEach(c=>c.sales.filter(s=>!s.returned&&new Date(s.sale_date)>=today).forEach(s=>{todaySales+=Number(s.price||0)+Number(s.labor||0);}));

  // مبيعات الشهر
  const monthStart=new Date(today.getFullYear(),today.getMonth(),1);
  let monthSales=0;
  cars.forEach(c=>c.sales.filter(s=>!s.returned&&new Date(s.sale_date)>=monthStart).forEach(s=>{monthSales+=Number(s.price||0)+Number(s.labor||0);}));

  // أعلى 5 قطع
  const partCount={};
  cars.forEach(c=>c.sales.filter(s=>!s.returned).forEach(s=>{
    const n=(s.part_name||'قطعة').trim();
    partCount[n]=(partCount[n]||0)+1;
  }));
  const top5=Object.entries(partCount).sort((a,b)=>b[1]-a[1]).slice(0,5);

  // أعلى 5 سيارات بالقطع
  const carPartsCount={};
  cars.forEach(c=>{
    const cnt=c.sales.filter(s=>!s.returned).length;
    if(cnt>0)carPartsCount[c.id]=cnt;
  });
  const top5Cars=Object.entries(carPartsCount).sort((a,b)=>b[1]-a[1]).slice(0,5);

  // عربونات متأخرة (أكثر من 7 أيام)
  const{data:allDeps}=await sb.from('deposits').select('*').eq('status','pending');
  const weekAgo=Date.now()-(7*24*60*60*1000);
  const lateDeposits=(allDeps||[]).filter(d=>new Date(d.created_at).getTime()<weekAgo);

  // وثائق على وشك الانتهاء (خلال 30 يوم)
  const{data:docs}=await sb.from('documents').select('*').order('expiry_date');
  const now30=new Date();now30.setDate(now30.getDate()+30);
  const docAlerts=(docs||[]).filter(d=>new Date(d.expiry_date)<=now30&&new Date(d.expiry_date)>=new Date());

  // مبيعات آخر 7 أيام
  const days7=[];
  for(let i=6;i>=0;i--){
    const d=new Date(today);d.setDate(d.getDate()-i);
    const next=new Date(d);next.setDate(next.getDate()+1);
    let dayTotal=0;
    cars.forEach(c=>c.sales.filter(s=>!s.returned&&new Date(s.sale_date)>=d&&new Date(s.sale_date)<next).forEach(s=>{dayTotal+=Number(s.price||0)+Number(s.labor||0);}));
    days7.push({label:d.toLocaleDateString('ar-SA',{weekday:'short'}),val:dayTotal});
  }
  const maxDay=Math.max(...days7.map(d=>d.val),1);

  dc.innerHTML=`
  <!-- بطاقات إحصائية -->
  <div class="stats" style="margin-bottom:16px">
    <div class="stat"><div class="stat-icon">🚗</div><div class="stat-label">السيارات</div><div class="stat-val b">${cars.length}</div></div>
    <div class="stat"><div class="stat-icon">✅</div><div class="stat-label">نشطة</div><div class="stat-val g">${cars.filter(c=>!c.done).length}</div></div>
    <div class="stat"><div class="stat-icon">🔩</div><div class="stat-label">القطع</div><div class="stat-val">${parts}</div></div>
    <div class="stat ${net>=0?'':'red'}"><div class="stat-icon">${net>=0?'📈':'📉'}</div><div class="stat-label">${net>=0?'الربح':'الخسارة'}</div><div class="stat-val ${net>=0?'g':'r'}">${fmt(Math.abs(net))}</div></div>
  </div>

  <!-- مبيعات اليوم والشهر -->
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
    <div style="background:#f0fdf4;border-radius:12px;padding:14px;border:1.5px solid var(--g)">
      <div style="font-size:11px;font-weight:700;color:var(--g);margin-bottom:4px">اليوم</div>
      <div style="font-size:20px;font-weight:900;color:var(--gd)">${fmt(todaySales)}</div>
      <div style="font-size:10px;color:var(--mu)">ر.س</div>
    </div>
    <div style="background:#eff6ff;border-radius:12px;padding:14px;border:1.5px solid #3b82f6">
      <div style="font-size:11px;font-weight:700;color:#3b82f6;margin-bottom:4px">الشهر</div>
      <div style="font-size:20px;font-weight:900;color:#1d4ed8">${fmt(monthSales)}</div>
      <div style="font-size:10px;color:var(--mu)">ر.س</div>
    </div>
  </div>

  <!-- رسم بياني آخر 7 أيام -->
  <div style="background:#fff;border-radius:12px;padding:14px;border:1px solid var(--bor);margin-bottom:16px">
    <div style="font-size:12px;font-weight:800;color:var(--mu);margin-bottom:12px">📊 مبيعات آخر 7 أيام</div>
    <div style="display:flex;align-items:flex-end;gap:6px;height:80px">
      ${days7.map(d=>`
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px">
          <div style="font-size:9px;color:var(--mu);font-weight:600">${d.val>0?fmt(d.val).replace(',','').slice(0,4):''}</div>
          <div style="width:100%;background:${d.val>0?'var(--g)':'var(--bor)'};border-radius:4px 4px 0 0;height:${Math.max(4,Math.round((d.val/maxDay)*64))}px;transition:height .3s"></div>
          <div style="font-size:9px;color:var(--mu);font-weight:600">${d.label}</div>
        </div>`).join('')}
    </div>
  </div>

  <!-- أعلى 5 قطع -->
  <div style="background:#fff;border-radius:12px;padding:14px;border:1px solid var(--bor);margin-bottom:12px">
    <div style="font-size:12px;font-weight:800;color:var(--mu);margin-bottom:10px">🔥 أكثر القطع مبيعاً</div>
    ${top5.length?top5.map(([name,count],i)=>`
      <div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--bor)">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:13px;font-weight:900;color:${i===0?'#f59e0b':i===1?'#94a3b8':i===2?'#b45309':'var(--mu)'}">
            ${i===0?'🥇':i===1?'🥈':i===2?'🥉':'#'+(i+1)}
          </span>
          <span style="font-size:13px;font-weight:600">${name}</span>
        </div>
        <div style="font-size:12px;font-weight:800;color:var(--g);background:#f0fdf4;padding:2px 10px;border-radius:8px">${count} مرة</div>
      </div>`).join('')
    :'<div style="text-align:center;color:var(--mu);font-size:13px;padding:10px">لا توجد مبيعات بعد</div>'}
  </div>

  <!-- أعلى 5 سيارات -->
  <div style="background:#fff;border-radius:12px;padding:14px;border:1px solid var(--bor);margin-bottom:12px">
    <div style="font-size:12px;font-weight:800;color:var(--mu);margin-bottom:10px">🏆 أعلى السيارات مبيعاً بالقطع</div>
    ${top5Cars.length?top5Cars.map(([carId,count],i)=>{
      const c=cars.find(x=>x.id===carId)||{};
      return `<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--bor)">

          <span style="font-size:13px;font-weight:900;color:${i===0?'#f59e0b':i===1?'#94a3b8':i===2?'#b45309':'var(--mu)'}">
            ${i===0?'🥇':i===1?'🥈':i===2?'🥉':'#'+(i+1)}
          </span>
          <div>
            <div style="font-size:13px;font-weight:700">${c.model||'سيارة'}</div>
            <div style="font-size:10px;color:var(--mu)">#${c.num||'—'}</div>
          </div>
        </div>
        <div style="font-size:12px;font-weight:800;color:var(--bl);background:#eff6ff;padding:2px 10px;border-radius:8px">${count} قطعة</div>
      </div>`;
    }).join(''):'<div style="text-align:center;color:var(--mu);font-size:13px;padding:10px">لا توجد بيانات</div>'}
  </div>

  <!-- عربونات متأخرة -->
  ${lateDeposits.length?`
  <div style="background:#fff5f5;border-radius:12px;padding:14px;border:1.5px solid var(--r);margin-bottom:12px">
    <div style="font-size:12px;font-weight:800;color:var(--r);margin-bottom:10px">⚠️ عربونات متأخرة (${lateDeposits.length})</div>
    ${lateDeposits.map(d=>{
      const rem=Number(d.total_amount)-Number(d.deposit_amount);
      const days=Math.floor((Date.now()-new Date(d.created_at).getTime())/(1000*60*60*24));
      return `<div style="padding:8px 0;border-bottom:1px solid #fecaca;font-size:12px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div>
            <div style="font-weight:700">${d.customer_name}</div>
            <div style="color:var(--mu)">${d.part_description}</div>
          </div>
          <div style="text-align:left">
            <div style="font-weight:800;color:var(--r)">${fmt(rem)} ر.س</div>
            <div style="font-size:10px;color:var(--r)">${days} يوم</div>
          </div>
        </div>
      </div>`;
    }).join('')}
  </div>`:''}

  <!-- تنبيهات الوثائق -->
  ${docAlerts.length?`
  <div style="background:#fffbeb;border-radius:12px;padding:14px;border:1.5px solid #f59e0b;margin-bottom:12px">
    <div style="font-size:12px;font-weight:800;color:#92400e;margin-bottom:10px">📢 تنبيهات الوثائق (${docAlerts.length})</div>
    ${docAlerts.map(d=>{
      const daysLeft=Math.ceil((new Date(d.expiry_date)-Date.now())/(1000*60*60*24));
      const urgent=daysLeft<=7;
      return `<div style="padding:8px 0;border-bottom:1px solid #fde68a;font-size:12px;display:flex;justify-content:space-between;align-items:center">
        <div>
          <div style="font-weight:700">${d.name}</div>
          <div style="color:var(--mu)">${new Date(d.expiry_date).toLocaleDateString('ar-SA')}</div>
        </div>
        <div style="font-size:11px;font-weight:800;padding:3px 10px;border-radius:8px;background:${urgent?'var(--rl)':'#fef9c3'};color:${urgent?'var(--r)':'#854d0e'}">
          ${urgent?'🔴':'🟡'} ${daysLeft} يوم
        </div>
      </div>`;
    }).join('')}
  </div>`:''}
  `;
}

  const now=new Date();
  const el=document.getElementById('documentsContent');
  if(!el)return;

  const daysLeft=d=>Math.ceil((new Date(d.expiry_date)-now)/(1000*60*60*24));

  const statusBadge=d=>{

    if(dl<0)return `<span style="background:#fee2e2;color:#dc2626;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700">🔴 منتهية</span>`;

    if(dl<=30)return `<span style="background:#fef9c3;color:#854d0e;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700">🟡 ${dl} يوم</span>`;
    return `<span style="background:#f0fdf4;color:#16a34a;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700">🟢 ${dl} يوم</span>`;

  el.innerHTML=`

    </button>
    ${!list.length?'<div style="text-align:center;color:var(--mu);padding:20px">لا توجد وثائق مسجلة</div>':
    list.map(d=>`
      <div style="background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:8px;border:1px solid var(--bor)">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div style="flex:1">
            <div style="font-weight:800;font-size:14px;margin-bottom:3px">${d.name}</div>

            ${d.notes?`<div style="font-size:11px;color:var(--mu)">📝 ${d.notes}</div>`:''}
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px">
            ${statusBadge(d)}

              <button onclick="openEditDocument('${d.id}','${d.name.replace(/'/g,'')}','${d.expiry_date}','${(d.notes||'').replace(/'/g,'')}')" class="ibtn g" style="font-size:10px;padding:3px 8px">✏️</button>
              <button onclick="delDocument('${d.id}','${d.name.replace(/'/g,'')}')" class="ibtn r" style="font-size:10px;padding:3px 8px">🗑</button>
            </div>
          </div>
        </div>
      </div>`).join('')}`;
}

function previewDocImg(){
  const f=document.getElementById('doc_img')?.files[0]||document.getElementById('doc_img2')?.files[0];
  if(!f)return;
  const r=new FileReader();r.onload=e=>{
    document.getElementById('doc_imgThumb').src=e.target.result;
    document.getElementById('doc_imgPreview').style.display='block';
  };r.readAsDataURL(f);
}

async function saveDocument(){
  const name=(document.getElementById('doc_name')?.value||'').trim();
  const expiry=document.getElementById('doc_expiry')?.value;
  const notes=(document.getElementById('doc_notes')?.value||'').trim()||null;
  if(!name){toast(T('enterDocName'));return;}
  if(!expiry){toast(T('enterExpiry'));return;}
  let image_url=null;
  const f=document.getElementById('doc_img')?.files[0]||document.getElementById('doc_img2')?.files[0];
  if(f){image_url=await new Promise(res=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.readAsDataURL(f);});}
  const{error}=await sb.from('documents').insert({name,expiry_date:expiry,image_url,notes});
  if(error){toast('خطأ: '+error.message);return;}

  // إشعارات حسب المراحل
  const dLeft=Math.ceil((new Date(expiry)-Date.now())/(1000*60*60*24));
  const notifs=[];
  if(dLeft<=7){
    notifs.push({type:'🔴 [7days] تنبيه عاجل - وثيقة',msg:`🔴 ${name} - تنتهي بعد ${dLeft} يوم`});
    if(dLeft<=0) notifs[0]={type:'🔴 [expired] وثيقة منتهية',msg:`🔴 ${name} - منتهية منذ ${Math.abs(dLeft)} يوم`};
  } else if(dLeft<=14){
    notifs.push({type:'🟡 [14days] تنبيه - وثيقة',msg:`🟡 ${name} - تنتهي بعد ${dLeft} يوم`});
  } else if(dLeft<=30){
    notifs.push({type:'🟠 [30days] تذكير - وثيقة',msg:`🟠 ${name} - تنتهي بعد ${dLeft} يوم`});
  }
  if(notifs.length>0){
    for(const n of notifs){
      await sb.from('notifications').insert({
        user_id:null,type:'document',is_read:false,
        title:n.type,message:n.msg,
        link:'documents',created_at:new Date().toISOString()
      });
    }
    loadNotifications();
  }

  closeModal();toast('تم حفظ الوثيقة ✅');renderDocuments();
}

async function updateDocument(id){
  const name=(document.getElementById('edoc_name')?.value||'').trim();
  const expiry=document.getElementById('edoc_expiry')?.value;
  const notes=(document.getElementById('edoc_notes')?.value||'').trim()||null;
  if(!name||!expiry){toast(T('fillAll'));return;}
  const upd={name,expiry_date:expiry,notes};
  const f=document.getElementById('edoc_img')?.files[0];
  if(f){upd.image_url=await new Promise(res=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.readAsDataURL(f);});}

  await sb.from('documents').delete().eq('id',id);
  toast('تم الحذف');renderDocuments();
}

function searchDepCar(q){
  const results=document.getElementById('dep_car_results');
  const hidden=document.getElementById('dep_car');
  const selected=document.getElementById('dep_car_selected');
  if(!results)return;

  // إذا مسح البحث — إعادة تعيين الاختيار
  if(!q){
    results.style.display='none';
    if(hidden)hidden.value='';
    if(selected)selected.style.display='none';
    return;
  }

  const filtered=cars.filter(c=>!c.done&&(
    String(c.num).includes(q)||
    (c.model||'').toLowerCase().includes(q.toLowerCase())
  )).slice(0,8);

  if(!filtered.length){
    results.innerHTML=`<div style="padding:10px;font-size:12px;color:var(--mu);text-align:center">لا توجد نتائج</div>`;
    results.style.display='block';
    return;
  }

  results.innerHTML=filtered.map(c=>`
    <div onclick="selectDepCar('${c.id}','#${c.num} ${c.model||''}')"
      style="padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--bor);font-size:13px;display:flex;align-items:center;gap:8px"
      onmouseover="this.style.background='#f0fdf4'" onmouseout="this.style.background=''">
      <span style="font-size:11px;background:var(--g);color:#fff;padding:2px 7px;border-radius:5px;font-weight:700">#${c.num}</span>
      <span style="font-weight:600">${c.model||'-'}</span>
      <span style="font-size:11px;color:var(--mu);margin-right:auto">${fmt(c.buy_price)} ر.س</span>
    </div>`).join('');
  results.style.display='block';
}

function selectDepCar(id,label){

  const search=document.getElementById('dep_car_search');

function previewDepPartImg(input,idx){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    const preview=document.getElementById('dep_partImgPreview_'+idx);
    const thumb=document.getElementById('dep_partImgThumb_'+idx);
    if(thumb)thumb.src=e.target.result;
    if(preview)preview.style.display='block';
    if(input.closest('.part-row'))input.closest('.part-row').dataset.img=e.target.result;
  };
  r.readAsDataURL(f);
}

async function saveDeposit(){
  const customer_name=document.getElementById('dep_name')?.value.trim();
  const customer_phone=document.getElementById('dep_phone')?.value.trim()||null;
  const total_amount=parseFloat(document.getElementById('dep_total')?.value)||0;
  const deposit_amount=parseFloat(document.getElementById('dep_amount')?.value)||0;
  const payment_method=document.getElementById('dep_pm')?.value||'cash';
  const car_id=document.getElementById('dep_car')?.value||null;
  const notes=document.getElementById('dep_notes')?.value.trim();

  // جمع القطع
  const rows=document.querySelectorAll('#dep_partsContainer .part-row');
  const parts=[];
  rows.forEach((row,i)=>{
    const name=row.querySelector('input[type="text"]')?.value.trim();
    const img=row.dataset.img||null;
    if(name)parts.push({name,img});
  });
  const part_description=parts.map(p=>p.name).join(' | ')||'قطعة';

  if(!customer_name){toast(T('enterCustName'));return;}
  if(!part_description||part_description==='قطعة'&&parts.length===0){toast(T('fillFields'));return;}
  if(!total_amount){toast(T('fillFields'));return;}
  if(deposit_amount>total_amount){toast(T('depositBigger'));return;}

  const{data:dep,error}=await sb.from('deposits').insert({
    customer_name,customer_phone,
    part_description,
    total_amount,deposit_amount,payment_method,
    car_id:car_id||null,notes,status:'pending'
  }).select().single();

  if(error){toast('خطأ: '+error.message);return;}

  // رفع صور القطع
  if(dep){
    for(const part of parts){
      if(part.img){
        await sb.from('media').insert({
          car_id:car_id||null,
          url:part.img,
          type:'deposit_part'
        });
      }
    }
  }

  depPartCounter=1;
  closeModal();toast(T('depositSaved'));renderDeposits();
}

async function completeDeposit(id){
  // جلب بيانات العربون
  const{data:dep}=await sb.from('deposits').select('*').eq('id',id).single();
  if(!dep)return;

  // إذا مرتبط بسيارة — نسجل المبيعة في السيارة
  if(dep.car_id){
    openModal(`<h2>✅ اكتمال السداد</h2>
      <p style="font-size:13px;color:var(--mu);margin-bottom:14px">
        سيتم تسجيل المبيعة في السيارة المرتبطة تلقائياً
      </p>
      <div class="fgrid">
        <div class="fgi full"><label>اسم القطعة</label>
          <input id="cmp_part" type="text" value="${dep.part_description}" placeholder="اسم القطعة">
        </div>
        <div class="fgi"><label>المبلغ الكلي (ر.س)</label>
          <input id="cmp_price" type="number" value="${dep.total_amount}" min="0" inputmode="numeric">
        </div>
        <div class="fgi"><label>طريقة دفع المتبقي</label>
          <select id="cmp_pm">
            <option value="cash">💵 كاش</option>
            <option value="network">💳 شبكة</option>
          </select>
        </div>
      </div>
      <div class="macts">
        <button class="btn" style="margin-bottom:0" onclick="confirmComplete('${id}','${dep.car_id}')">✓ تأكيد وتسجيل</button>
        <button class="btn sec" style="margin-bottom:0" onclick="closeModal()">إلغاء</button>
      </div>`);
  } else {
    // بدون سيارة — نكمل مباشرة
    if(!confirm('تأكيد اكتمال السداد؟'))return;
    await sb.from('deposits').update({status:'completed'}).eq('id',id);
    toast('تم تسجيل اكتمال السداد ✅');renderDeposits();
  }
}

async function confirmComplete(depId, carId){
  const part_name=document.getElementById('cmp_part')?.value.trim();
  const price=parseFloat(document.getElementById('cmp_price')?.value)||0;
  const payment_method=document.getElementById('cmp_pm')?.value||'cash';
  const dep=await sb.from('deposits').select('*').eq('id',depId).single().then(r=>r.data);
  if(!part_name||!price){toast(T('fillAll'));return;}

  // سجل المبيعة في السيارة
  const{error:sErr}=await sb.from('sales').insert({
    car_id:carId,
    part_name,price,labor:0,warranty_days:0,
    customer_name:dep?.customer_name||null,
    customer_phone:dep?.customer_phone||null,
    payment_method,
    sold_by:CU.name,sold_by_id:CU.id,
    sale_date:new Date().toISOString(),
    returned:false,
    technician:''
  });
  if(sErr){toast('خطأ في تسجيل المبيعة: '+sErr.message);return;}

  // أكمل العربون
  await sb.from('deposits').update({status:'completed'}).eq('id',depId);

  closeModal();
  toast('تم اكتمال السداد وتسجيل المبيعة في السيارة ✅');
  renderDeposits();
  loadCars();
}

async function delDeposit(id){
  if(!confirm('هل أنت متأكد من حذف هذا العربون؟\nهذا الإجراء لا يمكن التراجع عنه.'))return;
  await sb.from('deposits').delete().eq('id',id);
  toast('تم الحذف');renderDeposits();
}

function exportDepositPDF(id){
  // نجلب البيانات من الـ DOM مؤقتاً
  sb.from('deposits').select('*').eq('id',id).single().then(({data:d})=>{
    if(!d)return;
    const{jsPDF}=window.jspdf;
    const doc=new jsPDF({orientation:'p',unit:'mm',format:'a4'});
    const W=210;
    const now=new Date();
    const dateStr=now.getDate()+'/'+(now.getMonth()+1)+'/'+now.getFullYear();
    const remaining=Number(d.total_amount)-Number(d.deposit_amount);
    const pct=Math.round((Number(d.deposit_amount)/Number(d.total_amount))*100)||0;

    function aImg(text,fontSize,color,bold,width){
      const w=width||500;
      const c=document.createElement('canvas');
      const scale=4;c.width=w*scale;c.height=(fontSize+10)*scale;
      const ctx=c.getContext('2d');ctx.scale(scale,scale);
      ctx.font=(bold?'bold ':'')+fontSize+'px Cairo, Arial';
      ctx.fillStyle=color||'#0f172a';ctx.textAlign='right';
      ctx.fillText(text,w-2,fontSize+1);
      return c.toDataURL('image/png');
    }

    // هيدر
    doc.setFillColor(20,83,45);doc.rect(0,0,W,50,'F');
    doc.setFillColor(22,163,74);doc.rect(0,25,W,25,'F');
    doc.setTextColor(255,255,255);
    doc.setFontSize(18);doc.setFont('helvetica','bold');
    doc.text('TASHLEEH AL-BURJ',14,13);
    const t1=aImg('تشليح البرج',18,'#ffffff',true,400);
    doc.addImage(t1,'PNG',W-100,2,86,11);
    doc.setFontSize(8);doc.setFont('helvetica','normal');
    doc.text('Al-Qassim - Al-Rass | Date: '+dateStr,14,20);
    const inv=aImg('فاتورة عربون معلقة',13,'#ffffff',true,300);
    doc.addImage(inv,'PNG',14,34,80,8);

    let y=58;
    // عنوان
    doc.setFillColor(22,163,74);doc.rect(14,y,W-28,8,'F');
    const sec=aImg('تفاصيل العربون',10,'#ffffff',true,300);
    doc.addImage(sec,'PNG',W-100,y+1,86,5);y+=10;

    const fields=[
      ['اسم الزبون',d.customer_name,true],
      ['القطعة / الخدمة',d.part_description,false],
      ['إجمالي الحساب',Number(d.total_amount).toLocaleString()+' ر.س',true],
      ['العربون المدفوع',Number(d.deposit_amount).toLocaleString()+' ر.س',false],
      ['المبلغ المتبقي',remaining.toLocaleString()+' ر.س',remaining>0],
      ['نسبة السداد',pct+'%',false],
      ['التاريخ',dateStr,false],
    ];

    fields.forEach(([lbl,val,hi],i)=>{
      doc.setFillColor(i%2===0?245:250,i%2===0?255:252,i%2===0?245:248);
      doc.rect(14,y,W-28,10,'F');
      const li=aImg(': '+lbl,9,'#64748b',true,200);
      doc.addImage(li,'PNG',W-82,y+1.5,68,5.5);
      const vi=aImg(String(val),10,hi?'#16a34a':'#0f172a',true,200);
      doc.addImage(vi,'PNG',14,y+1.5,80,5.5);
      y+=10;
    });

    if(d.notes){y+=6;
      const ni=aImg('ملاحظة: '+d.notes,9,'#64748b',false,400);
      doc.addImage(ni,'PNG',14,y,180,6);
    }

    // شريط السداد
    y+=14;
    doc.setFillColor(230,240,230);doc.roundedRect(14,y,W-28,8,2,2,'F');
    doc.setFillColor(22,163,74);doc.roundedRect(14,y,Math.max(4,(W-28)*pct/100),8,2,2,'F');
    const pctImg=aImg(pct+'% تم السداد',8,'#0f172a',true,200);
    doc.addImage(pctImg,'PNG',W-90,y+1,76,5);

    // فوتر
    const pH=doc.internal.pageSize.height;
    doc.setFillColor(20,83,45);doc.rect(0,pH-14,W,14,'F');
    doc.setTextColor(255,255,255);doc.setFontSize(8);doc.setFont('helvetica','bold');
    doc.text('TASHLEEH AL-BURJ | Al-Qassim - Al-Rass',14,pH-8);
    const fa=aImg('هذه فاتورة عربون معلقة — لم يكتمل السداد بعد',8,'rgba(255,255,255,0.8)',false,400);
    doc.addImage(fa,'PNG',14,pH-6,182,4);

    doc.save('عربون_'+d.customer_name+'.pdf');
    toast('تم إصدار فاتورة العربون ✅');
  });
}

function previewWsPartImg(input,idx){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    const prev=document.getElementById('ws_partImgPreview_'+idx);
    const thumb=document.getElementById('ws_partImgThumb_'+idx);
    if(thumb)thumb.src=e.target.result;
    if(prev)prev.style.display='block';
    if(input.closest('.part-row'))input.closest('.part-row').dataset.img=e.target.result;
  };r.readAsDataURL(f);
}

async function saveWorkshopSale(){
  const cat=document.getElementById('ws_cat')?.value||'other';
  const cname=document.getElementById('ws_cname')?.value.trim()||null;
  const cphone=document.getElementById('ws_cphone')?.value.trim()||null;
  const tech=document.getElementById('ws_tech')?.value||'';
  const rows=document.querySelectorAll('#ws_partsContainer .part-row');
  const services=[];
  rows.forEach(row=>{
    const name=row.querySelector('input[type="text"]')?.value.trim();
    const price=parseFloat(row.querySelector('input[type="number"]')?.value)||0;
    if(name||price)services.push({name:name||'خدمة',price});
  });
  if(!services.length){toast(T('addServiceFirst'));return;}
  if(!services.some(s=>s.price>0)){toast(T('enterAmount'));return;}
  for(const svc of services){
    await sb.from('free_sales').insert({
      category:cat,description:svc.name,price:svc.price,
      technician:tech,customer_name:cname,customer_phone:cphone,
      sold_by:CU.name,sale_date:new Date().toISOString()
    });
  }
  toast('✅ تم تسجيل '+services.length+' خدمة');
  document.getElementById('ws_cname').value='';
  document.getElementById('ws_cphone').value='';
  _wsPartCounter=1;
  const cont=document.getElementById('ws_partsContainer');
  if(cont){
    const first=cont.querySelector('.part-row');
    if(first){first.querySelectorAll('input').forEach(i=>i.value='');const pr=first.querySelector('[id^="ws_partImgPreview"]');if(pr)pr.style.display='none';}
    Array.from(cont.querySelectorAll('.part-row')).slice(1).forEach(r=>r.remove());
  }
  renderRecentWorkshop();
}

// ── فاتورة مبيعة بدون سيارة ──
async function exportGenSalePDF(saleId){
  // جلب البيانات من Supabase
  const{data:s}=await sb.from('free_sales').select('*').eq('id',saleId).single();
  if(!s){toast('خطأ: لم يتم إيجاد المبيعة');return;}

  const{jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'p',unit:'mm',format:'a4'});
  const W=210;

  // دالة نص عربي
  function arImg(text,fs,clr,bold){
    const w=500,h=fs*2+12;
    const cv=document.createElement('canvas');
    cv.width=w*3;cv.height=h*3;
    const ctx=cv.getContext('2d');
    ctx.scale(3,3);
    ctx.font=(bold?'bold ':'')+fs+'px Cairo,Arial';
    ctx.fillStyle=clr||'#0f172a';
    ctx.direction='rtl';ctx.textAlign='right';
    ctx.fillText(text,w-2,fs+3);
    return cv.toDataURL('image/png');
  }
  function arR(text,fs,clr,bold,xRight,yy,maxW){
    const mw=maxW||200;
    const h=(fs+6)*0.35;
    doc.addImage(arImg(text,fs,clr,bold),'PNG',xRight-mw,yy,mw,h);
  }

  // ── هيدر ──
  doc.setFillColor(20,83,45);doc.rect(0,0,W,20,'F');
  doc.setFillColor(22,163,74);doc.rect(0,20,W,20,'F');
  arR('تشليح البرج',18,'#ffffff',true,W-14,3,120);
  arR('فاتورة مبيعة',12,'#ffffff',false,W-14,21,100);
  arR('القصيم — الرس',9,'#dcfce7',false,W-14,31,100);
  doc.setFontSize(8);doc.setTextColor(255,255,255);doc.setFont('helvetica','normal');
  doc.text(new Date().toLocaleDateString('en-GB'),14,36);
  let y=50;

  // رقم الفاتورة
  doc.setFillColor(240,253,244);doc.roundedRect(14,y,W-28,30,3,3,'F');
  doc.setDrawColor(22,163,74);doc.setLineWidth(.5);doc.roundedRect(14,y,W-28,30,3,3,'D');

  const cats={mechanic:'ميكانيكا',electric:'كهرباء',ac:'تكييف',body:'هيكل',other:'أخرى',general:'عامة'};
  const details=[
    ['الخدمة / القطعة', s.description||'مبيعة'],
    ['النوع', cats[s.category]||s.category||'-'],
    ['التاريخ', new Date(s.sale_date).toLocaleDateString('ar-SA')],
    ['الموظف', s.sold_by||'-'],
    ['الفني', s.technician||'-'],
  ];
  details.forEach(([lb,vl],i)=>{
    const ry=y+6+(i*5.5);
    doc.setFontSize(8);doc.setTextColor(100,116,139);doc.setFont('helvetica','normal');
    doc.text(lb+':',20,ry);
    arR(vl,8,'#0f172a',true,W-20,ry-6,120);
  });
  y+=36;

  // المبلغ
  y+=6;
  doc.setFillColor(22,163,74);doc.roundedRect(14,y,W-28,16,3,3,'F');
  arR('المبلغ الإجمالي: '+Number(s.price||0).toLocaleString()+' ر.س',14,'#ffffff',true,W-16,y+2,W-28);
  y+=22;

  // ملاحظة
  doc.setFontSize(9);doc.setTextColor(100,116,139);doc.setFont('helvetica','normal');
  doc.text('Thank you for choosing Tashleeh Al-Burj',W/2,y+10,{align:'center'});

  pF(doc,W);
  doc.save('فاتورة_'+s.description+'_'+new Date(s.sale_date).toLocaleDateString('en-GB').replace(/\//g,'-')+'.pdf');
  toast(T('pdfOk'));
}

function exportReturnPDF(carId,saleId,reason){
  const car=cars.find(c=>c.id===carId);if(!car)return;
  const s=car.sales.find(x=>x.id===saleId);if(!s)return;
  const{jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'p',unit:'mm',format:'a4'});
  const W=210;
  const now=new Date();
  const dateStr=now.getDate()+'/'+(now.getMonth()+1)+'/'+now.getFullYear();

  function aImg(text,fontSize,color,bold,width){
    const w=width||500;
    const c=document.createElement('canvas');
    const scale=4;
    c.width=w*scale;c.height=(fontSize+10)*scale;
    const ctx=c.getContext('2d');
    ctx.scale(scale,scale);
    ctx.font=(bold?'bold ':'')+fontSize+'px Cairo, Arial';
    ctx.fillStyle=color||'#0f172a';
    ctx.textAlign='right';
    ctx.fillText(text,w-2,fontSize+1);
    return c.toDataURL('image/png');
  }

  // هيدر أحمر
  doc.setFillColor(180,20,20); doc.rect(0,0,W,50,'F');
  doc.setFillColor(220,38,38); doc.rect(0,25,W,25,'F');
  doc.setTextColor(255,255,255);
  doc.setFontSize(20);doc.setFont('helvetica','bold');
  doc.text('TASHLEEH AL-BURJ',14,13);

  const shopAr=aImg('تشليح البرج',20,'#ffffff',true,400);
  doc.addImage(shopAr,'PNG',W-100,2,86,11);

  doc.setFontSize(8.5);doc.setFont('helvetica','normal');
  doc.text('Al-Qassim Region - Al-Rass',14,19);
  doc.text('Date: '+dateStr,14,28);

  const retTitle=aImg('فاتورة مرتجع',14,'#ffffff',true,300);
  doc.addImage(retTitle,'PNG',14,34,80,8);

  let y=58;

  // تفاصيل
  doc.setFillColor(220,38,38); doc.rect(14,y,W-28,8,'F');
  const sec=aImg('تفاصيل المرتجع',10,'#ffffff',true,300);
  doc.addImage(sec,'PNG',W-100,y+1,86,5);
  y+=10;

  const fields=[
    ['اسم القطعة',s.part_name||'قطعة'],
    ['سعر البيع الأصلي',Number(s.price).toLocaleString()+' ر.س'],
    ['سبب الإرجاع',reason],
    ['تاريخ الإرجاع',dateStr],
    ['أرجعه',CU.name],
  ];

  fields.forEach(([lbl,val2],i)=>{
    doc.setFillColor(i%2===0?255:250,i%2===0?245:245,i%2===0?245:245);
    doc.rect(14,y,W-28,10,'F');
    doc.setDrawColor(220,200,200);doc.setLineWidth(.2);doc.line(14,y+10,W-14,y+10);
    const li=aImg(': '+lbl,9,'#991b1b',true,200);
    doc.addImage(li,'PNG',W-82,y+1.5,68,5.5);
    const vi=aImg(String(val2),10,'#0f172a',true,200);
    doc.addImage(vi,'PNG',14,y+1.5,80,5.5);
    y+=10;
  });
  y+=8;

  // السيارة
  doc.setFillColor(220,38,38);doc.rect(14,y,W-28,8,'F');
  const carSec=aImg('السيارة المرجعية',10,'#ffffff',true,300);
  doc.addImage(carSec,'PNG',W-100,y+1,86,5);y+=10;
  doc.setFillColor(255,245,245);doc.rect(14,y,W-28,12,'F');
  const ci=aImg('#'+car.num+' — '+(car.model||'غير محدد'),11,'#991b1b',true,400);
  doc.addImage(ci,'PNG',W-110,y+2,96,7);y+=18;

  // فوتر
  const pH=doc.internal.pageSize.height;
  doc.setFillColor(180,20,20);doc.rect(0,pH-14,W,14,'F');
  doc.setTextColor(255,255,255);doc.setFontSize(8);doc.setFont('helvetica','bold');
  doc.text('TASHLEEH AL-BURJ | Al-Qassim - Al-Rass',14,pH-8);
  const fAr=aImg('شكراً لتعاملكم معنا',9,'rgba(255,255,255,0.8)',false,300);
  doc.addImage(fAr,'PNG',W-95,pH-13,80,6);

  doc.save('مرتجع_'+car.num+'.pdf');
  toast('تم إصدار فاتورة المرتجع ✅');
}

function pH(doc,W,sub,inv){
  doc.setFillColor(...SH.GD);doc.rect(0,0,W,18,'F');
  doc.setFillColor(...SH.G);doc.rect(0,18,W,26,'F');
  doc.setTextColor(...SH.WH);doc.setFontSize(20);doc.setFont('helvetica','bold');doc.text(SH.nameEn,14,13);
  if(inv){doc.setFillColor(...SH.WH);doc.roundedRect(W-58,3,44,12,2,2,'F');doc.setTextColor(...SH.GD);doc.setFontSize(7);doc.setFont('helvetica','bold');doc.text('INV NO.',W-56,8);doc.setFontSize(9);doc.text(inv,W-56,13);}
  doc.setTextColor(...SH.WH);doc.setFontSize(11);doc.setFont('helvetica','bold');doc.text(sub,14,27);
  doc.setFontSize(8);doc.setFont('helvetica','normal');
  doc.text(SH.addr1+'   |   '+SH.addr2,14,34);
  doc.text('Date: '+new Date().toLocaleDateString('en-GB'),14,41);
  return 52;
}

function pF(doc,W){
  const H=doc.internal.pageSize.height;
  doc.setFillColor(...SH.GD);doc.rect(0,H-14,W,14,'F');
  doc.setTextColor(...SH.WH);doc.setFontSize(7.5);doc.setFont('helvetica','bold');
  doc.text(SH.nameEn+'  |  '+SH.addr1+'  |  '+SH.addr2,W/2,H-8,{align:'center'});
  doc.setFont('helvetica','normal');doc.setFontSize(7);
  doc.text('Thank you for choosing Tashleeh Al-Burj',W/2,H-3,{align:'center'});
}

function pST(doc,txt,x,y,w){
  doc.setFillColor(...SH.G);doc.rect(x,y,w,8,'F');
  doc.setTextColor(...SH.WH);doc.setFontSize(9);doc.setFont('helvetica','bold');doc.text(txt,x+4,y+5.5);return y+8;
}

// ── PDF CAR ──
function exportCarPDF(carId){
  const car=cars.find(c=>c.id===carId);if(!car)return;
  const{sales,labor,net}=calcCar(car);
  const{jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'p',unit:'mm',format:'a4'});
  const W=210;
  const now=new Date();
  const dateStr=now.getDate()+'/'+(now.getMonth()+1)+'/'+now.getFullYear();

  function aImg(text,fs,color,bold,width){
    const w=width||500;
    const c=document.createElement('canvas');
    const sc=4;c.width=w*sc;c.height=(fs+10)*sc;
    const ctx=c.getContext('2d');ctx.scale(sc,sc);
    ctx.font=(bold?'bold ':'')+fs+'px Cairo,Arial';
    ctx.fillStyle=color||'#0f172a';ctx.textAlign='right';
    ctx.fillText(text,w-2,fs+1);
    return c.toDataURL('image/png');
  }

  // ── هيدر ──
  doc.setFillColor(...SH.GD);doc.rect(0,0,W,50,'F');
  doc.setFillColor(...SH.G);doc.rect(0,25,W,25,'F');
  doc.setTextColor(255,255,255);
  doc.setFontSize(18);doc.setFont('helvetica','bold');
  doc.text('TASHLEEH AL-BURJ',14,16);
  const shopAr=aImg('تشليح البرج',18,'#ffffff',true,350);
  doc.addImage(shopAr,'PNG',W-95,3,80,11);
  doc.setFontSize(8);doc.setFont('helvetica','normal');
  doc.text('Al-Qassim - Al-Rass  |  Date: '+dateStr,14,23);
  const repTitle=aImg('تقرير مركبة',13,'#ffffff',true,250);
  doc.addImage(repTitle,'PNG',14,32,60,8);
  // بادج رقم السيارة
  doc.setFillColor(255,255,255);doc.roundedRect(W-65,30,50,14,2,2,'F');
  doc.setTextColor(...SH.GD);doc.setFontSize(7);doc.setFont('helvetica','bold');
  doc.text('CAR NO.',W-63,37);
  doc.setFontSize(12);doc.text('#'+car.num,W-63,44);

  let y=58;

  // ── بيانات السيارة ──
  doc.setFillColor(...SH.G);doc.rect(14,y,W-28,8,'F');
  const sec1=aImg('بيانات المركبة',10,'#ffffff',true,300);
  doc.addImage(sec1,'PNG',W-100,y+1,86,5);y+=10;

  doc.setFillColor(245,255,250);doc.roundedRect(14,y,W-28,40,2,2,'F');
  doc.setDrawColor(...SH.G);doc.setLineWidth(.3);doc.roundedRect(14,y,W-28,40,2,2,'D');

  const carFields=[
    ['الموديل', car.model||'-'],
    ['رقم المركبة', '#'+car.num],
    ['سعر الشراء', Number(car.buy_price||0).toLocaleString()+' ر.س'],
    ['تاريخ الإضافة', new Date(car.created_at).getDate()+'/'+(new Date(car.created_at).getMonth()+1)+'/'+new Date(car.created_at).getFullYear()],
  ];
  carFields.forEach(([lbl,val],i)=>{
    const row=y+6+(i*9);
    const li=aImg(': '+lbl,8,'#64748b',true,150);
    doc.addImage(li,'PNG',W-78,row-2,64,6);
    const vi=aImg(String(val),9,'#0f172a',true,200);
    doc.addImage(vi,'PNG',14,row-2,80,6);
  });
  y+=42;

  if(car.notes){
    const ni=aImg('📝 '+car.notes.substring(0,70),8,'#92400e',false,400);
    doc.setFillColor(255,251,235);doc.roundedRect(14,y,W-28,10,2,2,'F');
    doc.addImage(ni,'PNG',14,y+2,180,6);y+=14;
  }

  // ── جدول القطع المباعة ──
  const activeSales=car.sales.filter(s=>!s.returned);
  const returnedSales=car.sales.filter(s=>s.returned);
  y+=4;
  doc.setFillColor(...SH.G);doc.rect(14,y,W-28,8,'F');
  const sec2=aImg('القطع المباعة ('+activeSales.length+')',10,'#ffffff',true,300);
  doc.addImage(sec2,'PNG',W-100,y+1,86,5);y+=10;

  // رأس الجدول
  doc.setFillColor(240,253,244);doc.rect(14,y,W-28,7,'F');
  const headers=[['#',W-18],['القطعة',W-28],['التاريخ',110],['الفني',75],['الضمان',52],['السعر',30]];
  headers.forEach(([h,x])=>{
    const hi=aImg(h,7,'#14532d',true,80);
    doc.addImage(hi,'PNG',x-8,y+0.5,20,5);
  });
  doc.setDrawColor(...SH.G);doc.setLineWidth(.3);doc.line(14,y+7,W-14,y+7);y+=7;

  if(!activeSales.length){
    const noSales=aImg('لا توجد مبيعات مسجلة',10,'#64748b',false,300);
    doc.addImage(noSales,'PNG',W-100,y+4,86,7);y+=16;
  } else {
    activeSales.forEach((s,i)=>{
      if(y>258){doc.addPage();y=18;}
      const bg=i%2===0?[255,255,255]:[248,255,250];
      doc.setFillColor(...bg);doc.rect(14,y,W-28,9,'F');
      // رقم
      doc.setTextColor(...SH.MU);doc.setFontSize(8);doc.setFont('helvetica','normal');
      doc.text(String(i+1),W-16,y+6,{align:'right'});
      // اسم القطعة
      const pImg=aImg(String(s.part_name||'قطعة').substring(0,22),8,'#0f172a',true,180);
      doc.addImage(pImg,'PNG',W-30,y+1,60,6);
      // التاريخ
      const sd=new Date(s.sale_date);
      doc.text(sd.getDate()+'/'+(sd.getMonth()+1)+'/'+sd.getFullYear(),110,y+6);
      // الفني
      if(s.technician){
        const ti=aImg(s.technician.substring(0,8),7,'#64748b',false,80);
        doc.addImage(ti,'PNG',67,y+1.5,30,5);
      }
      // الضمان
      const ws=wStatus(s);
      if(ws.cls==='wa')doc.setTextColor(...SH.G);
      else if(ws.cls==='we')doc.setTextColor(...SH.GR);
      else doc.setTextColor(...SH.MU);
      doc.setFont('helvetica','bold');
      doc.text(s.warranty_days>0?s.warranty_days+'d':'--',50,y+6);
      // السعر
      doc.setTextColor(...SH.G);
      doc.text(Number(s.price||0).toLocaleString(),28,y+6,{align:'right'});
      doc.setDrawColor(225,240,225);doc.setLineWidth(.2);doc.line(14,y+9,W-14,y+9);
      y+=9;
    });
  }

  // ── المرتجعات ──
  if(returnedSales.length){
    y+=5;
    doc.setFillColor(...SH.GR);doc.rect(14,y,W-28,8,'F');
    const sec3=aImg('المرتجعات ('+returnedSales.length+')',10,'#ffffff',true,300);
    doc.addImage(sec3,'PNG',W-100,y+1,86,5);y+=10;
    returnedSales.forEach(s=>{
      if(y>258){doc.addPage();y=18;}
      doc.setFillColor(255,248,248);doc.rect(14,y,W-28,9,'F');
      const rImg=aImg(String(s.part_name||'قطعة').substring(0,25),8,'#dc2626',true,200);
      doc.addImage(rImg,'PNG',W-30,y+1,70,6);
      const sd=new Date(s.sale_date);
      doc.setTextColor(...SH.MU);doc.setFontSize(8);doc.setFont('helvetica','normal');
      doc.text(sd.getDate()+'/'+(sd.getMonth()+1)+'/'+sd.getFullYear(),110,y+6);
      doc.setTextColor(...SH.GR);doc.setFont('helvetica','bold');
      doc.text('-'+Number(s.price||0).toLocaleString(),28,y+6,{align:'right'});
      doc.setDrawColor(255,200,200);doc.setLineWidth(.2);doc.line(14,y+9,W-14,y+9);
      y+=9;
    });
  }

  // ── الملخص المالي ──
  y+=8;
  doc.setFillColor(...SH.G);doc.rect(14,y,W-28,8,'F');
  const sec4=aImg('الملخص المالي',10,'#ffffff',true,300);
  doc.addImage(sec4,'PNG',W-100,y+1,86,5);y+=10;

  const finRows=[
    ['مبيعات القطع',sales,'#16a34a'],
    ['شغل اليد',labor,'#16a34a'],
    ['سعر الشراء',Number(car.buy_price||0),'#dc2626'],
  ];
  finRows.forEach(([lbl,val,clr])=>{
    if(y>265){doc.addPage();y=18;}
    doc.setFillColor(248,252,248);doc.rect(14,y,W-28,9,'F');
    const li=aImg(lbl,9,'#64748b',true,200);
    doc.addImage(li,'PNG',W-80,y+1.5,66,5.5);
    doc.setTextColor(clr==='#dc2626'?220:22,clr==='#dc2626'?38:163,clr==='#dc2626'?38:74);
    doc.setFontSize(10);doc.setFont('helvetica','bold');
    doc.text(Number(val).toLocaleString()+' SAR',28,y+6.5,{align:'right'});
    doc.setDrawColor(220,240,220);doc.setLineWidth(.2);doc.line(14,y+9,W-14,y+9);
    y+=9;
  });

  y+=4;
  doc.setFillColor(...(net>=0?SH.G:SH.GR));
  doc.roundedRect(14,y,W-28,14,3,3,'F');
  const netLabel=aImg(net>=0?'صافي الربح':'صافي الخسارة',11,'#ffffff',true,200);
  doc.addImage(netLabel,'PNG',W-85,y+2,72,8);
  doc.setTextColor(255,255,255);doc.setFontSize(13);doc.setFont('helvetica','bold');
  doc.text(Math.abs(net).toLocaleString()+' SAR',28,y+9.5,{align:'right'});

  // ── فوتر ──
  const pH=doc.internal.pageSize.height;
  doc.setFillColor(...SH.GD);doc.rect(0,pH-14,W,14,'F');
  const footAr=aImg('شكراً لاختيارك تشليح البرج',8,'rgba(255,255,255,0.8)',false,350);
  doc.addImage(footAr,'PNG',W-95,pH-12,80,6);
  doc.setTextColor(255,255,255);doc.setFontSize(7);doc.setFont('helvetica','normal');
  doc.text('TASHLEEH AL-BURJ  |  Al-Qassim - Al-Rass',14,pH-8);
  doc.text('Thank you for your business',14,pH-3);

  doc.save('تقرير_سيارة_'+car.num+'.pdf');
  toast(T('pdfOk'));
}

// ── PDF SALE ──
function exportSalePDF(carId,saleId){
  const car=cars.find(c=>c.id===carId);if(!car)return;
  const s=car.sales.find(x=>x.id===saleId);if(!s)return;
  const ws=wStatus(s);
  const{jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'p',unit:'mm',format:'a4'});
  const W=210;
  const idx=car.sales.indexOf(s);
  const invNum=car.num+'-'+String(idx+1).padStart(3,'0');
  const now=new Date();
  const dateStr=now.getDate()+'/'+(now.getMonth()+1)+'/'+now.getFullYear();
  const saleD=new Date(s.sale_date);
  const saleDateStr=saleD.getDate()+'/'+(saleD.getMonth()+1)+'/'+saleD.getFullYear();

  // ── رسم النص العربي على canvas ──
  function aImg(text, fontSize, color, bold, width){
    const w=width||500;
    const c=document.createElement('canvas');
    const scale=4;
    c.width=w*scale; c.height=(fontSize+10)*scale;
    const ctx=c.getContext('2d');
    ctx.scale(scale,scale);
    ctx.font=(bold?'bold ':'')+fontSize+'px Cairo, Arial';
    ctx.fillStyle=color||'#0f172a';
    ctx.textAlign='right';
    ctx.fillText(text,w-2,fontSize+1);
    return c.toDataURL('image/png');
  }

  // ── هيدر أخضر كامل ──
  doc.setFillColor(...SH.GD); doc.rect(0,0,W,50,'F');
  doc.setFillColor(...SH.G);  doc.rect(0,25,W,25,'F');

  // اسم التشليح بالعربي
  const shopAr=aImg('تشليح البرج',22,'#ffffff',true,400);
  doc.addImage(shopAr,'PNG',W-100,2,86,12);

  // اسم التشليح بالإنجليزي
  doc.setTextColor(...SH.WH); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text('TASHLEEH AL-BURJ',14,10);

  // العنوان
  const addrAr=aImg('منطقة القصيم — الرس',11,'rgba(255,255,255,0.85)',false,400);
  doc.addImage(addrAr,'PNG',W-100,14,86,7);
  doc.setFontSize(8.5); doc.setFont('helvetica','normal'); doc.setTextColor(...SH.WH);
  doc.text('Al-Qassim Region - Al-Rass',14,19);

  // التاريخ ورقم الفاتورة
  const dateAr=aImg('التاريخ: '+dateStr,10,'rgba(255,255,255,0.8)',false,300);
  doc.addImage(dateAr,'PNG',W-80,23,66,6);
  doc.setFontSize(8); doc.setTextColor(...SH.WH);
  doc.text('Date: '+dateStr,14,28);

  // بادج رقم الفاتورة
  doc.setFillColor(255,255,255);
  doc.roundedRect(W-68,32,54,12,2,2,'F');
  doc.setTextColor(...SH.GD); doc.setFontSize(7); doc.setFont('helvetica','bold');
  doc.text('INVOICE NO.',W-66,38);
  doc.setFontSize(10); doc.text('INV-'+invNum,W-66,44);

  // عنوان "فاتورة قطعة" بالعربي
  const invTitle=aImg('فاتورة قطعة',13,'#ffffff',true,300);
  doc.addImage(invTitle,'PNG',14,34,66,8);

  let y=58;

  // ── تفاصيل القطعة ──
  // عنوان القسم
  doc.setFillColor(...SH.G); doc.rect(14,y,W-28,8,'F');
  const secTitle=aImg('تفاصيل القطعة',10,'#ffffff',true,300);
  doc.addImage(secTitle,'PNG',W-100,y+1,86,5);
  y+=10;

  const fields=[
    ['اسم القطعة', s.part_name||'قطعة', true],
    ['سعر البيع',  Number(s.price).toLocaleString()+' ر.س', true],
    ['شغل اليد',   Number(s.labor||0).toLocaleString()+' ر.س', false],
    ['الفني',      s.technician||'-', false],
    ['تاريخ البيع', saleDateStr, false],
  ];

  fields.forEach(([lbl,val,hi],i)=>{
    doc.setFillColor(i%2===0?245:250, i%2===0?255:252, i%2===0?245:248);
    doc.rect(14,y,W-28,10,'F');
    doc.setDrawColor(220,240,220); doc.setLineWidth(.2);
    doc.line(14,y+10,W-14,y+10);
    // التسمية — يمين
    const lblImg=aImg(': '+lbl,9,'#64748b',true,200);
    doc.addImage(lblImg,'PNG',W-82,y+1.5,68,5.5);
    // القيمة — يسار
    const valImg=aImg(String(val),10,hi?'#15803d':'#0f172a',true,180);
    doc.addImage(valImg,'PNG',14,y+1.5,72,5.5);
    y+=10;
  });
  y+=8;

  // ── الضمان ──
  const wc=ws.cls==='wa'?SH.G:ws.cls==='we'?SH.GR:SH.MU;
  const wH=ws.expiry?20:16;
  doc.setFillColor(...wc); doc.roundedRect(14,y,W-28,wH,3,3,'F');

  const wTitleImg=aImg('حالة الضمان',9,'#ffffff',true,200);
  doc.addImage(wTitleImg,'PNG',W-82,y+3,68,5);
  const wValImg=aImg(ws.label,11,'#ffffff',true,200);
  doc.addImage(wValImg,'PNG',14,y+3,80,6);

  if(ws.expiry){
    const expD=ws.expiry;
    const expStr=(ws.cls==='wa'?'ينتهي: ':'انتهى: ')+expD.getDate()+'/'+(expD.getMonth()+1)+'/'+expD.getFullYear();
    const expImg=aImg(expStr,8,'rgba(255,255,255,0.85)',false,300);
    doc.addImage(expImg,'PNG',W-120,y+12,106,5);
  }
  y+=wH+8;

  // ── السيارة المرجعية ──
  doc.setFillColor(...SH.G); doc.rect(14,y,W-28,8,'F');
  const carSecTitle=aImg('السيارة المرجعية',10,'#ffffff',true,300);
  doc.addImage(carSecTitle,'PNG',W-100,y+1,86,5);
  y+=10;

  doc.setFillColor(245,255,245); doc.rect(14,y,W-28,12,'F');
  doc.setDrawColor(...SH.G); doc.setLineWidth(.3);
  doc.roundedRect(14,y,W-28,12,1,1,'D');
  const carInfo=aImg('#'+car.num+' — '+(car.model||'غير محدد'),11,'#14532d',true,400);
  doc.addImage(carInfo,'PNG',W-110,y+2,96,7);
  y+=18;

  // ── الشروط ──
  doc.setDrawColor(200,235,210); doc.setLineWidth(.3);
  doc.roundedRect(14,y,W-28,16,2,2,'D');
  const t1=aImg('الفاتورة صادرة من تشليح البرج — منطقة القصيم، الرس *',8,'#64748b',false,500);
  const t2=aImg('الضمان يبدأ من تاريخ البيع. لا يقبل الإرجاع بعد انتهاء الضمان *',8,'#64748b',false,500);
  doc.addImage(t1,'PNG',14,y+2,182,5);
  doc.addImage(t2,'PNG',14,y+9,182,5);

  // ── فوتر ──
  const pH2=doc.internal.pageSize.height;
  doc.setFillColor(...SH.GD); doc.rect(0,pH2-16,W,16,'F');
  const footAr=aImg('شكراً لاختيارك تشليح البرج',9,'rgba(255,255,255,0.8)',false,400);
  doc.addImage(footAr,'PNG',W-100,pH2-13,86,6);
  doc.setTextColor(...SH.WH); doc.setFontSize(8); doc.setFont('helvetica','bold');
  doc.text('TASHLEEH AL-BURJ  |  Al-Qassim - Al-Rass',14,pH2-9);
  doc.setFont('helvetica','normal'); doc.setFontSize(7);
  doc.text('Thank you for choosing Tashleeh Al-Burj',14,pH2-4);

  doc.save('فاتورة_'+invNum+'.pdf');
  toast(T('pdfOk'));
}

// ── UTILS ──
function show(id){const el=document.getElementById(id);if(el){el.style.display='';el.classList.add('on');}}
function hide(id){const el=document.getElementById(id);if(el)el.classList.remove('on');}
function hideLd(){const el=document.getElementById('loading');if(el)el.style.display='none';}
function val(id){return document.getElementById(id)?.value||'';}
function showStep(id){document.querySelectorAll('.step').forEach(s=>s.classList.remove('on'));document.getElementById(id)?.classList.add('on');}
function modal(html){document.getElementById('modalWrap').innerHTML=`<div class="overlay" onclick="if(event.target.classList.contains('overlay'))closeModal()"><div class="modal"><div class="mhandle"></div>${html}</div></div>`;}
function openModal(html){modal(html);}
function closeModal(){document.getElementById('modalWrap').innerHTML='';}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.getElementById('toastWrap').appendChild(t);setTimeout(()=>t.remove(),2800);}

init();
</script>
