async function saveQuickSale(){
  const mode=_qsMode;
  const cname=document.getElementById('qs_cname')?.value.trim()||null;
  const cphone=document.getElementById('qs_cphone')?.value.trim()||null;
  const pm=document.getElementById('qs_pm')?.value||'cash';
  const tech=document.getElementById('qs_tech')?.value||'';
  const rows=document.querySelectorAll('#qs_partsContainer .part-row');
  const parts=[];
  rows.forEach((row,i)=>{
    const name=row.querySelector('input[type="text"]')?.value.trim();
    const price=parseFloat(row.querySelector('input[id*="_pp_"]')?.value)||0;
    const labor=parseFloat(row.querySelector('input[id*="_pl_"]')?.value)||0;
    const warranty=parseInt(row.querySelector('input[id*="_pw_"]')?.value)||0;
    const img=row.dataset.img||null;
    // رجيع
    const scrapCb=row.querySelector('input[type="checkbox"]');
    const hasScrap=scrapCb?.checked||false;
    const scrapVal=hasScrap?parseFloat(row.querySelector('input[id*="_sv_"]')?.value)||0:0;
    const scrapNote=hasScrap?row.querySelector('input[id*="_sn_"]')?.value.trim()||null:null;
    if(name||price)parts.push({name:name||'قطعة',price,labor,warranty,img,hasScrap,scrapVal,scrapNote});
  });
  // validation مع تحديد الخانة الخاطئة
  if(!parts.length){
    markRowError(document.querySelector('#qs_partsContainer .part-row'), T('addPartFirst'));
    return;
  }
  let hasError=false;
  document.querySelectorAll('#qs_partsContainer .part-row').forEach((row,i)=>{
    const nameInp=row.querySelector('input[type="text"]');
    const priceInp=row.querySelector('input[id*="_pp_"]');
    const name=nameInp?.value.trim();
    const price=parseFloat(priceInp?.value)||0;
    if(name&&!price){markError(priceInp, T('enterSalePrice'));hasError=true;}
    if(price&&!name){markError(nameInp, T('fillFields'));hasError=true;}
    if(!name&&!price&&i===0){markError(nameInp, T('addPartFirst'));hasError=true;}
  });
  if(hasError)return;
  if(!parts.some(p=>p.price>0)){
    markError(document.querySelector('#qs_partsContainer input[id*="_pp_"]'), T('enterSalePrice'));
    return;
  }
  const invNum='INV-'+Date.now().toString().slice(-8);
  const saleDate=document.getElementById('qs_date')?.value
    ?new Date(document.getElementById('qs_date').value).toISOString()
    :new Date().toISOString();
  if(mode==='car'){
    const num=document.getElementById('qs_carnum')?.value;
    const car=cars.find(c=>String(c.num)===String(num));
    if(!car){toast(T('carNotFound'));return;}
    for(const part of parts){
      const{data:sd,error}=await sb.from('sales').insert({
        car_id:car.id,part_name:part.name,price:part.price,labor:part.labor,
        warranty_days:part.warranty,technician:tech,payment_method:pm,
        customer_name:cname,customer_phone:cphone,
        sold_by:CU.name,sold_by_id:CU.id,
        sale_date:saleDate,returned:false,invoice_num:invNum
      }).select().single();
      if(error){toast('خطأ: '+error.message);continue;}
      if(part.img&&sd)await sb.from('media').insert({car_id:car.id,sale_id:sd.id,url:part.img,type:'part'});
      if(!error&&part.hasScrap&&part.scrapVal>0&&sd){
        await saveScrapReturn({saleId:sd.id,carId:car.id,carNum:String(car.num),
          partName:part.name,customerName:cname,customerPhone:cphone,
          value:part.scrapVal,notes:part.scrapNote});
      }
    }
  } else {
    for(const part of parts){
      const{data:fsd,error}=await sb.from('free_sales').insert({
        category:'general',description:part.name,price:part.price,labor:part.labor,
        technician:tech,customer_name:cname,customer_phone:cphone,
        payment_method:pm,sold_by:CU.name,sale_date:saleDate
      }).select().single();
      if(!error&&part.hasScrap&&part.scrapVal>0&&fsd){
        await saveScrapReturn({freeSaleId:fsd.id,partName:part.name,
          customerName:cname,customerPhone:cphone,
          value:part.scrapVal,notes:part.scrapNote});
      }
    }
  }
  const totalAmt=parts.reduce((s,p)=>s+(p.price+p.labor),0);
  if(totalAmt>=1000){
    sb.from('notifications').insert({user_id:null,type:'general',is_read:false,
      title:'💰 مبيعة كبيرة',
      message:`${parts.length} قطعة - ${totalAmt.toLocaleString()} ر.س - بواسطة ${CU.name}`,
      link:'',created_at:new Date().toISOString()}).then(()=>loadNotifications());
  }
  toast('✅ '+T('partsCountMsg').replace('{count}',parts.length)+' | '+invNum);
  // flash زر الحفظ
  const saveBtn=document.querySelector('[onclick="saveQuickSale()"]');
  if(saveBtn){saveBtn.style.background='var(--gl)';setTimeout(()=>saveBtn.style.background='var(--g)',800);}
  // مسح النموذج بالكامل
  _qsPartCounter=1;
  const cont=document.getElementById('qs_partsContainer');
  if(cont){
    const first=cont.querySelector('.part-row');
    if(first){
      first.querySelectorAll('input').forEach(i=>{if(i.type==='checkbox'){i.checked=false;}else{i.value='';}});
      first.dataset.img='';
      const pr=first.querySelector('[id^="qs_partImgPreview"]');
      if(pr)pr.style.display='none';
    }
    Array.from(cont.querySelectorAll('.part-row')).slice(1).forEach(r=>r.remove());
  }
  const scrapBox=document.getElementById('qs_scrapBox_0');
  if(scrapBox)scrapBox.style.display='none';
  ['qs_carnum','qs_cname','qs_cphone','qs_date'].forEach(id=>{
    const el=document.getElementById(id);if(el)el.value='';
  });
  const carInfo=document.getElementById('qs_carInfo');
  if(carInfo)carInfo.innerHTML='';
  loadCars();renderRecentSales();
}

function openGlobalSearch(){
  modal(`<div style="padding:4px">
    <h2 style="margin-bottom:14px;font-size:16px">🔍 بحث شامل</h2>
    <input type="text" id="gSearch" placeholder="ابحث برقم السيارة، اسم القطعة، اسم الزبون، جوال..."
      oninput="runGlobalSearch(this.value)"
      style="width:100%;padding:12px 14px;border:2px solid var(--g);border-radius:12px;font-size:14px;font-family:'Cairo',sans-serif;box-sizing:border-box;margin-bottom:12px">
    <div id="gSearchResults" style="max-height:60vh;overflow-y:auto"></div>
  </div>`);
  setTimeout(()=>document.getElementById('gSearch')?.focus(),200);

function runGlobalSearch(q){
  const el=document.getElementById('gSearchResults');
  if(!el)return;
  if(!q||q.length<2){el.innerHTML='<div style="text-align:center;color:var(--mu);padding:20px;font-size:13px">اكتب للبحث...</div>';return;}
  const ql=q.toLowerCase();
  const results=[];

  // بحث في السيارات والقطع
  cars.forEach(car=>{
    const carMatch=String(car.num).includes(ql)||(car.model||'').toLowerCase().includes(ql);
    if(carMatch)results.push({type:'car',icon:'🚗',title:`سيارة #${car.num}`,sub:car.model||'',action:`nav('Cars',document.getElementById('navCars'));setTimeout(()=>toggleCar('${car.id}'),500)`});
    car.sales.forEach(s=>{
      const sMatch=(s.part_name||'').toLowerCase().includes(ql)||(s.customer_name||'').toLowerCase().includes(ql)||(s.customer_phone||'').includes(ql)||String(car.num).includes(ql);
      if(sMatch)results.push({type:'sale',icon:'💰',title:s.part_name||'قطعة',sub:`#${car.num} · ${s.customer_name||''} · ${fmt(Number(s.price||0)+Number(s.labor||0))}`,carId:car.id,saleId:s.id});
    });
  });

  if(!results.length){el.innerHTML='<div style="text-align:center;color:var(--mu);padding:20px;font-size:13px">لا نتائج</div>';return;}

  el.innerHTML=results.slice(0,20).map(r=>`
    <div class="sale-card" onclick="${r.action||''}" style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fff;border:1px solid var(--bor);border-radius:10px;margin-bottom:6px;cursor:pointer">
      <span style="font-size:22px">${r.icon}</span>
      <div style="flex:1;min-width:0">
        <div style="font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.title}</div>
        <div style="font-size:11px;color:var(--mu)">${r.sub}</div>
      </div>
      ${r.type==='sale'?`<div style="display:flex;gap:4px">
        <button onclick="event.stopPropagation();closeModal();exportSalePDF('${r.carId}','${r.saleId}')" style="background:var(--bll);border:none;border-radius:6px;padding:3px 8px;font-size:10px;font-weight:700;color:var(--bl);cursor:pointer">🧾</button>
        <button onclick="event.stopPropagation();closeModal();openEditSale('${r.carId}','${r.saleId}')" style="background:#fef3c7;border:none;border-radius:6px;padding:3px 8px;font-size:10px;font-weight:700;color:#92400e;cursor:pointer">✏️</button>
      </div>`:''}
    </div>`).join('');
}

    labor:parseFloat(document.getElementById('es_labor')?.value)||0,
    warranty_days:parseInt(document.getElementById('es_warranty')?.value)||0,

async function saveEditWorkshopSale(id){
  const name=document.getElementById('ews_name')?.value.trim();
  const price=parseFloat(document.getElementById('ews_price')?.value)||0;
  if(!name){markError(document.getElementById('ews_name'),'اسم الخدمة مطلوب');return;}
  if(!price){markError(document.getElementById('ews_price'),'المبلغ مطلوب');return;}
  const{error}=await sb.from('free_sales').update({
    description:name, price,
    labor:parseFloat(document.getElementById('ews_labor')?.value)||0,
    category:document.getElementById('ews_cat')?.value||'other',
    technician:document.getElementById('ews_tech')?.value||null,
    customer_name:document.getElementById('ews_cname')?.value.trim()||null,
    customer_phone:document.getElementById('ews_cphone')?.value.trim()||null,
    payment_method:document.getElementById('ews_pm')?.value||'cash',
  }).eq('id',id);
  if(error){toast('خطأ: '+error.message);return;}
  closeModal();toast('تم التعديل ✅');renderRecentWorkshop();
}



// ── Workshop Save ──
async function saveWorkshopSale(){
  const cat=document.getElementById('ws_cat')?.value||'general';
  const cname=document.getElementById('ws_cname')?.value.trim()||null;
  const cphone=document.getElementById('ws_cphone')?.value.trim()||null;
  const pm=document.getElementById('ws_pm')?.value||'cash';
  const tech=document.getElementById('ws_tech')?.value||null;
  const rows=document.querySelectorAll('#ws_partsContainer .part-row');
  const services=[];
  rows.forEach((row,i)=>{
    const name=row.querySelector('input[type="text"]')?.value.trim();
    const price=parseFloat(row.querySelector('input[type="number"]')?.value)||0;
    const img=row.dataset.img||null;
    if(name||price)services.push({name:name||'خدمة',price,img});
  });
  clearErrors(document.getElementById('ws_partsContainer'));
  let wsErr=false;
  document.querySelectorAll('#ws_partsContainer .part-row').forEach((row,i)=>{
    const nameInp=row.querySelector('input[type="text"]');
    const priceInp=row.querySelector('input[type="number"]');
    const name=nameInp?.value.trim(); const price=parseFloat(priceInp?.value)||0;
    if(name&&!price){markError(priceInp,T('enterAmount'));wsErr=true;}
    if(price&&!name){markError(nameInp,T('fillFields'));wsErr=true;}
    if(!name&&!price&&i===0){markError(nameInp,T('addServiceFirst'));wsErr=true;}
  });
  if(wsErr)return;
  if(!services.length){markRowError(document.querySelector('#ws_partsContainer .part-row'),T('addServiceFirst'));return;}
  if(!services.some(s=>s.price>0)){markError(document.querySelector('#ws_partsContainer input[type="number"]'),T('enterAmount'));return;}
  const invNum='WS-'+Date.now().toString().slice(-8);
  for(const svc of services){
    const{data:fsd,error}=await sb.from('free_sales').insert({
      category:cat,description:svc.name,price:svc.price,
      technician:tech,customer_name:cname,customer_phone:cphone,
      payment_method:pm,sold_by:CU.name,sale_date:new Date().toISOString()
    }).select().single();
    if(error){toast('خطأ: '+error.message);continue;}
    if(svc.img&&fsd)await sb.from('media').insert({free_sale_id:fsd.id,url:svc.img,type:'workshop'});
  }
  toast(T('servicesCountMsg').replace('{count}',services.length));
  const saveBtn=document.querySelector('[onclick="saveWorkshopSale()"]');
  if(saveBtn){saveBtn.style.background='var(--gl)';setTimeout(()=>saveBtn.style.background='var(--g)',800);}
  // Reset form
  document.querySelectorAll('#ws_partsContainer .part-row').forEach((r,i)=>{if(i>0)r.remove();});
  ['ws_pd_0','ws_pp_0'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  await renderRecentWorkshop();
}

function previewWsPartImg(input,idx){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    const row=document.getElementById('ws_partRow_'+idx);
    if(!row)return;
    row.dataset.img=e.target.result;
    let prev=document.getElementById('ws_partImgPreview_'+idx);
    if(!prev){prev=document.createElement('div');prev.id='ws_partImgPreview_'+idx;prev.style.marginBottom='8px';row.insertBefore(prev,row.querySelector('.fgrid'));}
    prev.innerHTML=`<img style="width:100%;max-height:110px;object-fit:cover;border-radius:8px;border:1.5px solid var(--g)" src="${e.target.result}">`;
  };
  r.readAsDataURL(f);
}

async function saveDeposit(){
  const cname=document.getElementById('dep_cname')?.value.trim();
  const total=parseFloat(document.getElementById('dep_total')?.value)||0;
  const paid=parseFloat(document.getElementById('dep_paid')?.value)||0;
  if(!cname){markError(document.getElementById('dep_cname'),T('fillFields'));return;}
  if(!total){markError(document.getElementById('dep_total'),T('fillFields'));return;}
  if(paid>total){toast(T('depositBigger'));return;}
  const{error}=await sb.from('deposits').insert({
    customer_name:cname,
    customer_phone:document.getElementById('dep_cphone')?.value.trim()||null,
    part_description:document.getElementById('dep_desc')?.value.trim()||null,
    total_amount:total,deposit_amount:paid,
    payment_method:document.getElementById('dep_pm')?.value||'cash',
    car_id:document.getElementById('dep_car')?.value||null,
    notes:document.getElementById('dep_notes')?.value.trim()||null,
    status:'pending',created_at:new Date().toISOString()

/* ── رسم بياني للإيرادات الشهرية ── */
function renderDashboardChart(salesData, fsList){
  const canvas=document.getElementById('dashRevenueChart');
  if(!canvas||!window.Chart)return;
  // آخر 6 أشهر
  const months=[];
  const partsRev=[];
  const wsRev=[];
  const now=new Date();
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const y=d.getFullYear(), m=d.getMonth()+1;
    const label=d.toLocaleDateString('ar-SA',{month:'short',year:'2-digit'});
    months.push(label);
    const pRev=(salesData||[]).filter(s=>{
      if(s.returned)return false;
      const sd=new Date(s.sale_date);
      return sd.getFullYear()===y&&sd.getMonth()+1===m;
    }).reduce((sum,s)=>sum+Number(s.price||0)+Number(s.labor||0),0);
    const wRev=(fsList||[]).filter(f=>{
      const dateStr=f.sale_date||f.created_at;
      if(!dateStr)return false;
      const sd=new Date(dateStr);
      return sd.getFullYear()===y&&sd.getMonth()+1===m;
    }).reduce((sum,f)=>sum+Number(f.price||0)+Number(f.labor||0),0);
    partsRev.push(pRev);
    wsRev.push(wRev);
  }
  // تدمير الرسم القديم إن وجد
  if(window._dashChart)try{window._dashChart.destroy();}catch(e){}
  const isDark=document.documentElement.getAttribute('data-theme')==='dark';
  const gridColor=isDark?'rgba(255,255,255,.08)':'rgba(0,0,0,.06)';
  const labelColor=isDark?'#94a3b8':'#6b7280';
  window._dashChart=new Chart(canvas,{
    type:'bar',
    data:{
      labels:months,
      datasets:[
        {label:'القطع',data:partsRev,backgroundColor:'rgba(16,185,129,.75)',borderRadius:6},
        {label:'الورشة',data:wsRev,backgroundColor:'rgba(59,130,246,.65)',borderRadius:6}
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{labels:{color:labelColor,font:{family:'Cairo',size:11}}}},
      scales:{
        x:{ticks:{color:labelColor,font:{family:'Cairo',size:10}},grid:{color:gridColor}},
        y:{ticks:{color:labelColor,font:{family:'Cairo',size:10},callback:v=>v.toLocaleString()},grid:{color:gridColor}}
      }
    }
  });
}

/* ── إحصائيات الفنيين ── */
function renderTechnicianStats(salesData){
  const container=document.getElementById('dashTechStats');
  if(!container)return;

  (salesData||[]).filter(s=>!s.returned&&s.technician).forEach(s=>{
    const t=s.technician;
    if(!techMap[t])techMap[t]={name:t,count:0,rev:0};
    techMap[t].count++;
    techMap[t].rev+=Number(s.price||0)+Number(s.labor||0);
  });
  const techs=Object.values(techMap).sort((a,b)=>b.rev-a.rev);
  if(!techs.length){
    container.innerHTML=`<div style="background:#fff;border:1px solid var(--bor);border-radius:14px;padding:14px"><div style="font-size:13px;font-weight:800;margin-bottom:8px;color:var(--txt)">🛠️ إحصائيات الفنيين</div><div style="text-align:center;color:var(--mu);padding:10px;font-size:12px">لم يتم تسجيل بيانات فنيين بعد</div></div>`;return;
  }

// ── PDF Exports ──
function pF(doc,text,x,y,opts={}){
  try{
    const sz=opts.fontSize||12;
    const scale=8; // 8× → دقة 600+ DPI عند الطباعة
    const weight=opts.bold?'600':'400';
    const fontStr=`${weight} ${sz}px 'Cairo','Noto Naskh Arabic','Arial',sans-serif`;
    // ── قياس عرض النص الفعلي لتحجيم الكانفس بدقة ──
    const tmp=document.createElement('canvas');
    const tCtx=tmp.getContext('2d');
    tCtx.direction='ltr';
    tCtx.font=fontStr;
    const measuredW=Math.ceil(tCtx.measureText(text).width);
    const pad=Math.max(Math.ceil(sz*0.5),4);
    const cw=Math.max(measuredW+pad*2, 80);
    const ch=Math.ceil(sz*3.2); // ارتفاع أكبر يستوعب الأحرف الممتدة
    // ── كانفس عالي الدقة ──
    const canvas=document.createElement('canvas');
    canvas.width=cw*scale;
    canvas.height=ch*scale;
    const ctx2=canvas.getContext('2d',{alpha:true});
    ctx2.scale(scale,scale);
    ctx2.clearRect(0,0,cw,ch);
    ctx2.direction='ltr'; // تجاوز RTL الصفحة → سلوك موحّد للمحاذاة
    ctx2.font=fontStr;
    ctx2.fillStyle=opts.color||'#1f2937';
    ctx2.textAlign=opts.align||'right';
    ctx2.textBaseline='middle';
    const tx=opts.align==='center'?cw/2:opts.align==='left'?pad:cw-pad;
    ctx2.fillText(text,tx,ch/2);
    const img=canvas.toDataURL('image/png',1.0);
    const w=opts.width||sz*(text.length||1)*0.65;
    doc.addImage(img,'PNG',x-(opts.align==='right'?w:0),y-sz*0.68,w,sz*1.55);
  }catch(e){}
}

async function exportSalePDF(carId,saleId){
  const car=cars.find(c=>c.id===carId);
  const s=car?.sales.find(x=>x.id===saleId);
  if(!s)return;
  const{jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'p',unit:'mm',format:'a4'});
  doc.setFont('helvetica');
  const invNum=s.invoice_num||'INV-'+s.id.slice(-8).toUpperCase();
  const sd=new Date(s.sale_date);
  const dStr=`${String(sd.getDate()).padStart(2,'0')}/${String(sd.getMonth()+1).padStart(2,'0')}/${sd.getFullYear()}`;

  // ══════════════════════════════════════════
  // 1. HEADER — هيدر مثل القالب
  // ══════════════════════════════════════════
  doc.setFillColor(20,84,45);doc.rect(0,0,210,42,'F');       // خلفية داكنة
  doc.setFillColor(22,163,74);doc.rect(138,0,72,42,'F');     // مقطع أخضر يمين كالشكل الهندسي
  doc.setFillColor(12,60,30);doc.rect(138,0,2,42,'F');       // فاصل

  // اسم الشركة — يمين (الجزء الأخضر الفاتح)
  pF(doc,'تشليح البرج',208,13,{fontSize:18,bold:true,color:'#ffffff',align:'right',width:68});
  pF(doc,'منطقة القصيم — الرس',208,23,{fontSize:9,color:'rgba(255,255,255,0.85)',align:'right',width:68});
  pF(doc,'قطع غيار السيارات',208,31,{fontSize:8,color:'rgba(255,255,255,0.7)',align:'right',width:68});

  // "فاتورة" كبيرة — يسار كالكلمة INVOICE
  pF(doc,'فـاتـورة',136,22,{fontSize:20,bold:true,color:'rgba(255,255,255,0.92)',align:'right',width:112});

  // إنجليزي صغير
  doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(255,255,255);
  doc.text('TASHLEEH AL-BURJ',14,11);
  doc.setFont('helvetica','normal');doc.setFontSize(8);
  doc.text('Al-Qassim Region - Al-Rass',14,17.5);

  // ══════════════════════════════════════════
  // 2. INFO ROW — صف معلومات العميل والفاتورة
  // ══════════════════════════════════════════
  const IY=42;
  // يسار: فاتورة إلى (INVOICE TO)
  doc.setFillColor(240,253,244);doc.rect(14,IY,92,30,'F');

  if(s.customer_phone)pF(doc,s.customer_phone,104,IY+25,{fontSize:9,color:'#4b5563',align:'right',width:88});

  // يمين: رقم الفاتورة والتاريخ
  doc.setFillColor(255,255,255);doc.rect(112,IY,84,30,'F');
  doc.setDrawColor(187,247,208);doc.setLineWidth(0.25);doc.rect(112,IY,84,30,'S');

  doc.text('Date: '+dStr,114,IY+25);

  // ══════════════════════════════════════════
  // 3. SECOND INFO ROW — سيارة مرجعية + دفع
  // ══════════════════════════════════════════
  const IY2=IY+34;

  let y=IY2+26;

async function exportCarPDF(carId){
  const car=cars.find(c=>c.id===carId);
  if(!car)return;
  const{jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'p',unit:'mm',format:'a4'});
  doc.setFont('helvetica');
  pHeader(doc,T('carReportBtn')||'تقرير السيارة');
  let y=58,ri=0;
  const row=(label,value,vc,bold=false)=>{
    doc.setFillColor(...(ri%2===0?[245,255,245]:[255,255,255]));
    doc.rect(14,y,182,10,'F');
    pF(doc,label+' :',194,y+5,{fontSize:8.5,color:'#9ca3af',align:'right',width:74});
    pF(doc,String(value||'-'),14,y+5,{fontSize:10,bold:bold,color:vc||'#1e293b',align:'center',width:100});
    y+=10;ri++;
  };
  // ─── بيانات المركبة ───
  y=pSectA4(doc,'بيانات المركبة',y);
  row(T('carLabel')+' #',car.num,'#1e293b',true);
  row(T('modelLabel')||'الموديل',car.model||'-','#1e293b',true);
  row(T('buyPriceLabel')||'سعر الشراء',fmt(car.buy_price),'#dc2626',true);
  y+=5;
  // ─── الملخص المالي ───
  const activeSales=car.sales.filter(s=>!s.returned);
  const totalSales=activeSales.reduce((s,x)=>s+Number(x.price||0)+Number(x.labor||0),0);
  const profit=totalSales-Number(car.buy_price||0);
  y=pSectA4(doc,'الملخص المالي',y);ri=0;
  row(T('salesPartsLabel')||'إجمالي المبيعات',fmt(totalSales),'#16a34a',true);
  row(T('partsCount')||'عدد القطع المباعة',activeSales.length,'#1e293b',true);
  row(profit>=0?(T('netProfitLabel')||'صافي الربح'):(T('netLossLabel')||'صافي الخسارة'),fmt(Math.abs(profit)),profit>=0?'#16a34a':'#dc2626',true);
  // ─── القطع المباعة ───
  if(activeSales.length){
    y+=5;
    y=pSectA4(doc,(T('carSalesSection')||'القطع المباعة')+' ('+activeSales.length+')',y);ri=0;
    activeSales.forEach((s,i)=>{
      if(y>265){doc.addPage();y=20;}
      doc.setFillColor(...(i%2===0?[245,255,245]:[255,255,255]));
      doc.rect(14,y,182,10,'F');
      pF(doc,s.part_name||'-',194,y+5,{fontSize:9,bold:true,color:'#1e293b',align:'right',width:100});
      pF(doc,new Date(s.sale_date).toLocaleDateString('ar-SA'),100,y+5,{fontSize:8,color:'#9ca3af',align:'right',width:58});
      pF(doc,fmt(Number(s.price||0)+Number(s.labor||0)),46,y+5,{fontSize:9,bold:true,color:'#16a34a',align:'right',width:40});
      y+=10;
    });
    y+=4;
    doc.setFillColor(22,163,74);doc.rect(14,y,182,12,'F');
    pF(doc,T('totalLabel2')||'الإجمالي :',194,y+6,{fontSize:9,bold:true,color:'#fff',align:'right',width:74});
    pF(doc,fmt(totalSales),14,y+6,{fontSize:11,bold:true,color:'#fff',align:'center',width:100});
  }
  pFooterA4(doc);
  doc.save(`car-report-${car.num}.pdf`);
}

  if(partPrice>0)items.push({no:items.length+1,desc:s.description||'خدمة',price:partPrice});
  if(laborVal>0) items.push({no:items.length+1,desc:'أجرة العمل — شغل اليد',price:laborVal});
  if(!items.length)items.push({no:1,desc:s.description||'-',price:0});

  items.forEach((item,i)=>{
    const ry=y+i*RH;
    doc.setFillColor(...(i%2===0?[245,255,245]:[255,255,255]));
    doc.rect(14,ry,TW,RH,'F');
    doc.setDrawColor(209,250,229);doc.setLineWidth(0.2);doc.rect(14,ry,TW,RH,'S');
    [C.no.lx,C.desc.lx,C.price.lx,C.qty.lx].forEach(cx=>{
      doc.setDrawColor(209,250,229);doc.line(cx,ry,cx,ry+RH);
    });
    pF(doc,String(item.no),  C.no.rx,   ry+5.5,{fontSize:10,color:'#9ca3af',align:'right',width:C.no.w});
    pF(doc,item.desc,         C.desc.rx, ry+5.5,{fontSize:10,bold:true,color:'#1e293b',align:'right',width:C.desc.w});
    pF(doc,fmt(item.price),   C.price.rx,ry+5.5,{fontSize:10,color:'#374151',align:'right',width:C.price.w});
    pF(doc,'1',               C.qty.rx,  ry+5.5,{fontSize:10,color:'#374151',align:'right',width:C.qty.w});
    pF(doc,fmt(item.price),   C.total.rx,ry+5.5,{fontSize:10,bold:true,color:'#16a34a',align:'right',width:C.total.w});
  });
  y+=items.length*RH+10;

  // ── SUMMARY ──
  const grandTotal=partPrice+laborVal;
  const bx=118,bw=78;

  doc.setFillColor(248,252,248);doc.rect(14,y,98,38,'F');
  doc.setDrawColor(187,247,208);doc.setLineWidth(0.2);doc.rect(14,y,98,38,'S');
  pF(doc,'الشروط والأحكام :',110,y+8,{fontSize:9,bold:true,color:'#14532d',align:'right',width:94});
  pF(doc,'* جميع المبالغ بالريال السعودي',110,y+18,{fontSize:8,color:'#4b5563',align:'right',width:94});
  pF(doc,'* الفاتورة صادرة من تشليح البرج — القصيم',110,y+27,{fontSize:8,color:'#4b5563',align:'right',width:94});
  if(s.technician&&!isWs)pF(doc,'* الفني المسؤول: '+s.technician,110,y+36,{fontSize:8,color:'#4b5563',align:'right',width:94});
  else pF(doc,'* لا يقبل الإرجاع بعد المغادرة',110,y+36,{fontSize:8,color:'#4b5563',align:'right',width:94});

  if(laborVal>0){
    doc.setFillColor(240,253,244);doc.rect(bx,y,bw,11,'F');
    doc.setDrawColor(187,247,208);doc.setLineWidth(0.2);doc.rect(bx,y,bw,11,'S');
    pF(doc,'سعر الخدمة :',bx+bw,y+5.5,{fontSize:9,color:'#6b7280',align:'right',width:42});
    pF(doc,fmt(partPrice),bx+2,y+5.5,{fontSize:10,bold:true,color:'#1e293b',align:'left',width:34});

    doc.setFillColor(248,252,248);doc.rect(bx,y+11,bw,11,'F');
    doc.setDrawColor(187,247,208);doc.setLineWidth(0.2);doc.rect(bx,y+11,bw,11,'S');
    pF(doc,'شغل اليد :',bx+bw,y+16.5,{fontSize:9,color:'#6b7280',align:'right',width:42});
    pF(doc,fmt(laborVal),bx+2,y+16.5,{fontSize:10,bold:true,color:'#1e293b',align:'left',width:34});

    doc.setFillColor(22,163,74);doc.rect(bx,y+22,bw,14,'F');
    pF(doc,'الإجمالي :',bx+bw,y+29,{fontSize:11,bold:true,color:'#ffffff',align:'right',width:42});
    pF(doc,fmt(grandTotal),bx+2,y+29,{fontSize:12,bold:true,color:'#ffffff',align:'left',width:34});
  } else {
    doc.setFillColor(22,163,74);doc.rect(bx,y,bw,14,'F');
    pF(doc,'الإجمالي :',bx+bw,y+7,{fontSize:11,bold:true,color:'#ffffff',align:'right',width:42});
    pF(doc,fmt(grandTotal),bx+2,y+7,{fontSize:12,bold:true,color:'#ffffff',align:'left',width:34});
  }

  y+=48;
  pF(doc,'شكراً لتعاملكم معنا',196,y,{fontSize:11,bold:true,color:'#14532d',align:'right',width:182});
  y+=11;
  doc.setDrawColor(187,247,208);doc.setLineWidth(0.3);doc.line(14,y,68,y);
  pF(doc,'التوقيع المعتمد',68,y+5,{fontSize:8,color:'#9ca3af',align:'right',width:54});

  pFooterA4(doc);
  doc.save(`sale-${fsId.slice(-6)}.pdf`);
}

async function exportDepositPDF(depId){
  const{data:d}=await sb.from('deposits').select('*').eq('id',depId).single();
  if(!d)return;
  const{jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'p',unit:'mm',format:'a4'});
  doc.setFont('helvetica');
  const depNum='DEP-'+depId.slice(-8).toUpperCase();
  const td=new Date(d.created_at);
  const dStr=`${String(td.getDate()).padStart(2,'0')}/${String(td.getMonth()+1).padStart(2,'0')}/${td.getFullYear()}`;
  const totalAmt=Number(d.total_amount||0);
  const depAmt=Number(d.deposit_amount||0);
  const rem=totalAmt-depAmt;
  const pct=totalAmt>0?Math.round((depAmt/totalAmt)*100):0;

  // ── HEADER ──
  doc.setFillColor(20,84,45);doc.rect(0,0,210,42,'F');
  doc.setFillColor(107,114,128);doc.rect(138,0,72,42,'F');  // رمادي للعربون
  doc.setFillColor(50,55,65);doc.rect(138,0,2,42,'F');
  pF(doc,'تشليح البرج',208,13,{fontSize:18,bold:true,color:'#ffffff',align:'right',width:68});
  pF(doc,'منطقة القصيم — الرس',208,23,{fontSize:9,color:'rgba(255,255,255,0.85)',align:'right',width:68});
  pF(doc,'قطع غيار السيارات',208,31,{fontSize:8,color:'rgba(255,255,255,0.7)',align:'right',width:68});
  pF(doc,'عـربـون',136,22,{fontSize:20,bold:true,color:'rgba(255,255,255,0.92)',align:'right',width:112});
  doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(255,255,255);
  doc.text('TASHLEEH AL-BURJ',14,11);
  doc.setFont('helvetica','normal');doc.setFontSize(8);
  doc.text('Al-Qassim Region - Al-Rass',14,17.5);

  // ── INFO ROW 1 — العميل + رقم الإيصال ──
  const IY=42;
  doc.setFillColor(245,246,250);doc.rect(14,IY,92,30,'F');
  doc.setDrawColor(209,213,219);doc.setLineWidth(0.25);doc.rect(14,IY,92,30,'S');
  pF(doc,'إيصال لـ :',104,IY+7,{fontSize:8,bold:true,color:'#374151',align:'right',width:88});
  pF(doc,d.customer_name||'زبون عام',104,IY+17,{fontSize:11,bold:true,color:'#1e293b',align:'right',width:88});
  if(d.customer_phone)pF(doc,d.customer_phone,104,IY+25,{fontSize:9,color:'#4b5563',align:'right',width:88});

  doc.setFillColor(255,255,255);doc.rect(112,IY,84,30,'F');
  doc.setDrawColor(209,213,219);doc.setLineWidth(0.25);doc.rect(112,IY,84,30,'S');
  doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(55,65,81);
  doc.text('DEPOSIT NO.',114,IY+8);
  doc.setFontSize(11);doc.text(String(depNum),114,IY+17);
  doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(107,114,128);
  doc.text('Date: '+dStr,114,IY+25);

  // ── INFO ROW 2 — القطعة + نسبة السداد ──
  const IY2=IY+34;
  doc.setFillColor(248,249,252);doc.rect(14,IY2,92,20,'F');
  doc.setDrawColor(209,213,219);doc.setLineWidth(0.2);doc.rect(14,IY2,92,20,'S');
  pF(doc,'القطعة / الخدمة :',104,IY2+6,{fontSize:8,bold:true,color:'#374151',align:'right',width:88});
  pF(doc,d.part_description||'—',104,IY2+15,{fontSize:11,bold:true,color:'#1e293b',align:'right',width:88});

  doc.setFillColor(248,249,252);doc.rect(112,IY2,84,20,'F');
  doc.setDrawColor(209,213,219);doc.setLineWidth(0.2);doc.rect(112,IY2,84,20,'S');

  // ── TABLE — إجمالي / عربون / متبقي ──

  pF(doc,'المبلغ (ريال)',116,y+5.5,{...hs,width:80});
  y+=HH;

  const rows=[
    {label:'إجمالي الطلب',val:fmt(totalAmt),vc:'#1e293b'},
    {label:'المبلغ المدفوع (العربون)',val:fmt(depAmt),vc:'#16a34a'},

  const bx=118,bw=78;

  pF(doc,'ملاحظات وشروط العربون :',110,y+8,{fontSize:9,bold:true,color:'#374151',align:'right',width:94});
  pF(doc,'* هذا الإيصال يُثبت استلام العربون فقط',110,y+18,{fontSize:8,color:'#4b5563',align:'right',width:94});
  pF(doc,'* العربون غير قابل للاسترداد بعد التأكيد',110,y+27,{fontSize:8,color:'#4b5563',align:'right',width:94});
  if(d.notes){
    pF(doc,'* '+d.notes,110,y+36,{fontSize:8,color:'#4b5563',align:'right',width:94});
  } else {
    pF(doc,'* الرجاء الاحتفاظ بهذا الإيصال',110,y+36,{fontSize:8,color:'#4b5563',align:'right',width:94});
  }
  pF(doc,'* تشليح البرج — منطقة القصيم',110,y+45,{fontSize:8,color:'#4b5563',align:'right',width:94});

  // صندوق العربون (أخضر) والمتبقي (أحمر إن وُجد)
  doc.setFillColor(22,163,74);doc.rect(bx,y,bw,14,'F');
  pF(doc,'العربون :',bx+bw,y+7,{fontSize:11,bold:true,color:'#ffffff',align:'right',width:42});
  pF(doc,fmt(depAmt),bx+2,y+7,{fontSize:12,bold:true,color:'#ffffff',align:'left',width:34});

  if(rem>0){
    doc.setFillColor(239,68,68);doc.rect(bx,y+14,bw,14,'F');
    pF(doc,'المتبقي :',bx+bw,y+21,{fontSize:11,bold:true,color:'#ffffff',align:'right',width:42});
    pF(doc,fmt(rem),bx+2,y+21,{fontSize:12,bold:true,color:'#ffffff',align:'left',width:34});
  } else {
    doc.setFillColor(22,163,74);doc.rect(bx,y+14,bw,14,'F');
    pF(doc,'مُسدَّد بالكامل',bx+bw,y+21,{fontSize:11,bold:true,color:'#ffffff',align:'right',width:76});
  }

  y+=58;
  pF(doc,'شكراً لثقتكم بتشليح البرج',196,y,{fontSize:11,bold:true,color:'#374151',align:'right',width:182});
  y+=11;
  doc.setDrawColor(209,213,219);doc.setLineWidth(0.3);doc.line(14,y,68,y);
  pF(doc,'التوقيع المعتمد',68,y+5,{fontSize:8,color:'#9ca3af',align:'right',width:54});

  pFooterA4(doc);
  doc.save(`deposit-${depId.slice(-6)}.pdf`);
}

function updateQsTechList(){
  const sel=document.getElementById('qs_tech');
  if(!sel)return;
  const opts=(window._accounts||[]).map(a=>`<option value="${a.name}">${a.name}</option>`).join('');
  sel.innerHTML=`<option value="">${T('chooseTech')}</option>`+opts;
}

// ── Modal & Toast ──
function modal(html){
  let overlay=document.getElementById('modalOverlay');
  if(!overlay){
    overlay=document.createElement('div');
    overlay.id='modalOverlay';
    overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:flex-end;justify-content:center;padding:0';
    overlay.onclick=e=>{if(e.target===overlay)closeModal();};
    document.body.appendChild(overlay);
  }
  overlay.innerHTML=`<div id="modalBox" style="background:#fff;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px 16px 32px;font-family:'Cairo',sans-serif;direction:rtl">${html}</div>`;
  overlay.style.display='flex';
  document.body.style.overflow='hidden';
}

function openModal(html){
  modal(html);
}

function closeModal(){
  const o=document.getElementById('modalOverlay');
  if(o){o.style.display='none';o.innerHTML='';}
  document.body.style.overflow='';
}

function toast(msg,duration=3000){
  let t=document.getElementById('toastEl');
  if(!t){
    t=document.createElement('div');
    t.id='toastEl';
    t.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 20px;border-radius:12px;font-size:13px;font-weight:700;font-family:"Cairo",sans-serif;z-index:9999;transition:opacity .3s;max-width:90vw;text-align:center;direction:rtl';
    document.body.appendChild(t);
  }
  t.textContent=msg;
  t.style.opacity='1';
  clearTimeout(t._timeout);
  t._timeout=setTimeout(()=>{t.style.opacity='0';},duration);
}

// ── تشغيل التطبيق ──
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
